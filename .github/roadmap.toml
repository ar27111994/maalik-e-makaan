[[milestones.issues]]
id = "mcp-read"
title = "A read-only MCP server, so a landlord's own AI can read their ledger"
title_ur = "صرف پڑھنے والا رابطہ، تاکہ مالک کا اپنا اے آئی اس کا کھاتہ پڑھ سکے"
body = """
Let a landlord's own AI assistant read their ledger through a Model Context Protocol server: one `mcp` Edge Function with four read-only tools (their portfolios, who owes what, a tenant's statement and the overdue list) behind Supabase's OAuth server. An `agent_grants` table limits each client to the portfolios the landlord chose, until they revoke it, and every write path in the database refuses a token that carries a client id, so the server is read-only by construction. It ships behind a flag, and may move to the assistant milestone while Supabase's OAuth server is in beta.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/mcp-read.md

Done when:

- [ ] Two AI assistant apps from different vendors connect with OAuth and PKCE and call all four tools.
- [ ] A request without a token gets a 401 that points to the metadata.
- [ ] pgTAP proves isolation between portfolios, revocation and expiry.
- [ ] A `client_id` token cannot write through any RPC or table, and every tool runs read-only.
- [ ] No tool output contains a CNIC, phone number or URL, checked over fixtures.
- [ ] Every call appears in `agent_access_log` and on the audit screen.

This is the plan's list as it stood when this issue was opened. If the plan has changed since, its list is the one to meet before the issue is closed.

Depends on: [audit-screen](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/audit-screen.md), [legal-review](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/legal-review.md).

Waits on: Supabase's OAuth server on the hosted project, and the consent records ([decision 3](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/README.md#decision-3-privacy-first-analytics-support-and-e-mail-d-18)).
"""

[[milestones.issues]]
id = "draft-payments"
title = "Draft a payment from a voice note or a pasted SMS, always confirmed"
title_ur = "وائس نوٹ یا ایس ایم ایس سے ادائیگی لکھ کر تیار کرنا، جو ہمیشہ تصدیق کے بعد ہی درج ہو"
body = """
Turn a bank or wallet SMS, a Raast screenshot or, later, a voice note into a draft payment that the landlord checks and confirms with one tap; nothing is recorded without that tap. Messages come in through the share sheet or by paste, never by reading the phone's SMS, and the amount, date and reference come only from tested parsers in `mm_core`. The confirmation goes through the existing idempotent `record_payment`, keyed on the transfer's own reference, so that a message shared twice, or an SMS and a screenshot of the same transfer, records one payment. The text path is for launch; screenshots and voice notes may move to the assistant milestone.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/draft-payments.md

Done when:

- [ ] Nothing is recorded without a Confirm tap.
- [ ] Sharing a message twice, or the SMS and then a screenshot of the same transfer, yields one payment, in Dart and SQL tests.
- [ ] Every amount comes from `mm_core` and is read back in words in both languages.
- [ ] The release manifest has no SMS or call-log permission.
- [ ] No raw message text remains after confirmation or discard.
- [ ] Every confirmed draft appears on the audit screen with its source.

This is the plan's list as it stood when this issue was opened. If the plan has changed since, its list is the one to meet before the issue is closed.

Depends on: [amount-parser](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/amount-parser.md), [audit-screen](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/audit-screen.md), [legal-review](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/legal-review.md), [urdu-review](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/urdu-review.md).

Waits on: the consent records ([decision 3](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/README.md#decision-3-privacy-first-analytics-support-and-e-mail-d-18)), before any cloud speech or OCR provider.
"""

[[milestones.issues]]
id = "amount-parser"
title = "A tested reader for amounts in Urdu numerals, lakh and crore, and Roman Urdu"
title_ur = "اردو ہندسوں، لاکھ کروڑ اور رومن اردو میں لکھی رقمیں پڑھنے کا جانچا ہوا طریقہ"
body = """
No amount should come from a model's text alone. Read amounts written or said in Urdu or Western digits, lakh and crore, Urdu words and Roman Urdu ("dedh lakh", "pachas hazar", "2 lakh 50 hazar", "Rs. 25,000/-") deterministically in `mm_core`, in whole paisa, from a word list a native speaker has reviewed. Hand-written contract vectors keep the Dart, Deno and website copies the same; an input that could mean two amounts returns `ambiguous` rather than a guess, and every amount is read back in words before anything is saved.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/amount-parser.md

Done when:

- [ ] All vectors pass in Dart, Deno and the website's TypeScript.
- [ ] 10,000 random amounts round-trip through words and back in both languages.
- [ ] Every example in the roadmap and the investor deck ("1.5 lac", "ڈیڑھ لاکھ", "پچاس ہزار", "50k", "Rs. 25,000/-") is a vector.
- [ ] Ambiguous inputs in the vectors return `ambiguous`, never a number.
- [ ] The parser uses no floating-point type.
- [ ] No screen saves a parsed amount without showing the read-back.

This is the plan's list as it stood when this issue was opened. If the plan has changed since, its list is the one to meet before the issue is closed.

Depends on: [urdu-review](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/urdu-review.md), for the review of the word list; the first pull requests can start before it.
"""

