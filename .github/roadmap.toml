body = """
Read incoming rent from a landlord's bank account, with their consent, once the State Bank's open-banking regulations are final and a licensed provider exists. One step cannot wait: comments on the draft regulations close on 30 November 2026, and the response should ask for the remitter's name and the transfer reference in transaction data. Once built, only credits are imported, into the reconciliation inbox, and nothing becomes a payment without the landlord's approval.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/open-banking.md

Done when:

- [ ] The consultation response is sent by 30 November 2026, or the owner has decided not to.
- [ ] Imports run only under an active, recorded consent (pgTAP and Deno tests).
- [ ] Revoking consent in the app or at the bank stops imports within one cycle and deletes the token.
- [ ] No banking password, PIN or other credential is ever asked for or stored.
- [ ] Only credits are written: fixtures that mix both leave no debit in any table or log.
- [ ] No credit becomes a payment without a person's approval, and a credit already recorded by hand with the same reference shows as matched, not as a new suggestion.
- [ ] Every string exists in English and Urdu, and the design lint passes.

This is the plan's list as it stood when this issue was opened. If the plan has changed since, its list is the one to meet before the issue is closed.

Depends on: [reconciliation](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/reconciliation.md), [draft-payments](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/draft-payments.md), [audit-screen](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/audit-screen.md), [legal-review](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/legal-review.md).

Waits on: the State Bank's final rules, licensed providers and a partner contract.
"""

