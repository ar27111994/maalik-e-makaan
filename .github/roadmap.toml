[[milestones.issues]]
id = "billing"
title = "Paid plans, with early-access users told first"
title_ur = "ادا شدہ پلان، ابتدائی صارفین کو پہلے اطلاع کے ساتھ"
body = """
Turn on the plans on the pricing page and keep the promises made to early-access landlords: at least 60 days' notice, no plan they did not choose, and half price for their first year. Plans attach to portfolios, not to store accounts, and Postgres enforces the limits; over a limit there are 14 days of grace, then the extra units become read-only, and nothing is deleted. Payment is through Google Play and StoreKit 2, verified on the server, and a rupee checkout on the website through one licensed payment provider.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/billing.md

Done when:

- [ ] No account is charged before its notice date, and every early-access account was sent the notice, logged, at least 60 days before its first charge.
- [ ] Calling the RPCs or the Data API directly cannot activate a sixth let unit on Free, nor one more by spreading units across portfolios.
- [ ] Duplicate store notifications or payment notices produce exactly one entitlement change, and a refund revokes it.
- [ ] A lapsed plan gives 14 days of full access, then read-only units; nothing is deleted, and export works.
- [ ] The Pakistani storefront shows only the rupee plans, other storefronts only Overseas, and no app text points to web prices.

Depends on: `play-store`, `app-store`, `legal-review`, `urdu-review`, `pilot`.

Waits on: tax registrations and a written tax opinion; a payment provider's agreement; the residence fields (decision 1) and the consent records and Customer.io set-up (decision 3). A charge before 28 February 2027 needs the notice sent by 30 December 2026.
"""

[[milestones.issues]]
id = "audit-screen"
title = "A screen that shows who changed what"
title_ur = "ایک اسکرین جو دکھائے کہ کس نے کیا بدلا"
body = """
The database already records structural and financial changes with who made them and when (`audit_logs`); add the screen that reads them, with filters, one sentence per change in English and Urdu, and History links from leases, payments, tenants and units (TEAM-05). It must exist before any assistant can write, and new columns record which assistant or client made each change. A background job seals the rows into a hash chain, so that a manual edit can be detected without breaking the lock order.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/audit-screen.md

Done when:

- [ ] Every change in the pgTAP fixtures appears in the feed with its actor, time and readable text in English and Urdu.
- [ ] No CNIC appears on the screen, phone numbers are masked, and a former member's entries say "former member".
- [ ] Writes by an assistant and reads through MCP are visibly marked.
- [ ] `verify_audit` fails after a manual edit in a test database, in CI.
- [ ] An accountant and a viewer cannot read the feed, through the app or the Data API.
- [ ] The first page loads in under a second on the 32,716-row stress portfolio.

Depends on: nothing that blocks a start; its strings go through `urdu-review`.
"""

[[milestones.issues]]
id = "mcp-read"
title = "A read-only MCP server, so a landlord's own AI can read their ledger"
title_ur = "صرف پڑھنے کا رابطہ، تاکہ مالک کا اپنا مصنوعی ذہانت والا معاون اس کا کھاتہ پڑھ سکے"
body = """
Let a landlord's own AI assistant read their ledger through a Model Context Protocol server: one `mcp` Edge Function with four read-only tools (their portfolios, who owes what, a tenant's statement and the overdue list) behind Supabase's OAuth server. An `agent_grants` table limits each client to the portfolios the landlord chose, until they revoke it, and every write path in the database refuses a token that carries a client id, so the server is read-only by construction. It ships behind a flag, and may move to the assistant milestone while Supabase's OAuth server is in beta.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/mcp-read.md

Done when:

- [ ] Two AI assistant apps from different vendors connect with OAuth and PKCE and call all four tools.
- [ ] A request without a token gets a 401 that points to the metadata.
- [ ] pgTAP proves isolation between portfolios, revocation and expiry, and that a token with a client id cannot write through any RPC or table.
- [ ] No tool output contains a CNIC, a phone number or a URL, checked over fixtures.
- [ ] Every call appears in `agent_access_log` and on the audit screen.

Depends on: `audit-screen`, `legal-review`.

Waits on: Supabase's OAuth server on the hosted project, and the consent records (decision 3).
"""

[[milestones.issues]]
id = "draft-payments"
title = "Draft a payment from a voice note or a pasted SMS, always confirmed"
title_ur = "وائس نوٹ یا ایس ایم ایس سے ادائیگی کا مسودہ، ہمیشہ تصدیق کے بعد"
body = """
Turn a bank or wallet SMS, a Raast screenshot or, later, a voice note into a draft payment that the landlord checks and confirms with one tap; nothing is recorded without that tap. Messages come in through the share sheet or by paste, never by reading the phone's SMS, and the amount, date and reference come only from tested parsers in `mm_core`. The confirmation goes through the existing idempotent `record_payment`, keyed on the transfer's own reference, so that a message shared twice, or an SMS and a screenshot of the same transfer, records one payment. The text path is for launch; screenshots and voice notes may move to the assistant milestone.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/draft-payments.md

Done when:

- [ ] Nothing is recorded without a Confirm tap.
- [ ] Sharing a message twice, or the SMS and then a screenshot of the same transfer, records one payment, in Dart and SQL tests.
- [ ] Every amount comes from `mm_core` and is read back in words in both languages.
- [ ] The release manifest has no SMS or call-log permission.
- [ ] No raw message text remains after confirmation or discard.
- [ ] Every confirmed draft appears on the audit screen with its source.

Depends on: `amount-parser`, `audit-screen`, `legal-review`, `urdu-review`.

Waits on: the consent records (decision 3), before any cloud speech or OCR provider.
"""

[[milestones.issues]]
id = "amount-parser"
title = "A tested reader for amounts in Urdu numerals, lakh and crore, and Roman Urdu"
title_ur = "اردو ہندسوں، لاکھ کروڑ اور رومن اردو میں لکھی رقمیں پڑھنے کا جانچا ہوا طریقہ"
body = """
No amount should come from a model's text alone. Read amounts written or said in Urdu or Western digits, lakh and crore, Urdu words and Roman Urdu ("dedh lakh", "pachas hazar", "2 lakh 50 hazar", "Rs. 25,000/-") deterministically in `mm_core`, in whole paisa, from a word list a native speaker has reviewed. Hand-written contract vectors keep the Dart, Deno and website copies the same; an input that could mean two amounts returns `ambiguous` rather than a guess, and every amount is read back in words before anything is saved.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/amount-parser.md

Done when:

- [ ] All vectors pass in Dart, Deno and the website's TypeScript.
- [ ] 10,000 random amounts round-trip through words and back in both languages.
- [ ] Every example in the roadmap and the investor deck is a vector.
- [ ] Ambiguous inputs return `ambiguous`, never a number.
- [ ] The parser uses no floating-point type, and no screen saves a parsed amount without the read-back.

Depends on: `urdu-review`, for the review of the word list; the first pull requests can start before it.
"""

[[milestones.issues]]
id = "pilot"
title = "A pilot with the first landlords"
title_ur = "پہلے مالکانِ مکان کے ساتھ آزمائشی استعمال"
body = """
Put the app in the hands of 15 to 25 landlords from December 2026 to February 2027, over at least two rent days: about 10 at home, about 8 abroad with their caretakers, and at least 5 tenants who receive receipts. Moderated sessions in Urdu come first, then eight weeks of real use with weekly check-ins, then exit interviews, each scheduled in the participant's own time zone. Measurement comes from aggregate database views that clients cannot read, not from trackers, and the pilot ends with a report and a go or no-go for the public launch.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/pilot.md

Done when:

- [ ] At least 15 landlords are onboarded, at least 5 of them abroad with a caretaker.
- [ ] At least 10 moderated sessions have run in Urdu.
- [ ] The metric views cover two rent cycles, against a target the owner sets.
- [ ] Every finding is filed as an issue with a severity and no personal data.
- [ ] The pilot report, with its go or no-go, is in the repository.

Depends on: `legal-review`, `urdu-review`. Testers join through the test tracks of `play-store` and `app-store` once they exist, and through the APK and the web app until then.

Waits on: the residence fields (decision 1) and the consent records (decision 3).
"""

