# The product roadmap, as code. Each [[milestones]] entry becomes a GitHub milestone and each
# [[milestones.issues]] entry an issue in it, labelled "roadmap": the Roadmap workflow
# (.github/workflows/roadmap.yml) runs tool/github/sync_roadmap.py when this file changes on main.
#
# The sync creates what is missing and keeps milestone titles, descriptions and due dates in step
# with this file. It never closes, reopens or deletes anything, and it does not rewrite an issue
# after creating it: once an issue exists, it is managed on GitHub (comments, assignees, closing it
# with a pull request). An issue is matched by its id, kept in a hidden comment in its body.
#
# The website's roadmap page (/roadmap/) shows the live milestones and issues from GitHub, with the
# Urdu titles below; tool/web/fetch_roadmap.py builds it (`make roadmap` for the offline copy).
# British English; Urdu in Urdu script, never Roman Urdu.

[label]
name = "roadmap"
color = "1D3F8F"
description = "On the public roadmap (maalik-e-makaan-site.vercel.app/roadmap/)"

[[milestones]]
id = "launch"
title = "Launch and listen"
title_ur = "اجرا، پھر سننا"
due = "2027-02-28"
description = "Get into the stores, get the Urdu and the legal texts reviewed, and put the app in the hands of the first landlords."
description_ur = "ایپ اسٹورز تک پہنچنا، اردو اور قانونی تحریروں پر نظرِ ثانی کروانا، اور ایپ پہلے مالکانِ مکان کے ہاتھ میں دینا۔"

[[milestones.issues]]
id = "play-store"
title = "Publish the Android app on Google Play"
title_ur = "اینڈرائیڈ ایپ گوگل پلے پر شائع کرنا"
body = """
Upload the app bundle that each release attaches, write the store listing in English and Urdu, and add Google Play's app-signing key to `assetlinks.json` so that e-mail links open the app.

Waiting on: a D-U-N-S number for AR Labs.
"""

[[milestones.issues]]
id = "app-store"
title = "Publish the iPhone app on the App Store"
title_ur = "آئی فون ایپ ایپ اسٹور پر شائع کرنا"
body = """
Sign the iOS build, add the associated-domains file for e-mail links, and write the store listing in English and Urdu.

Waiting on: an Apple Developer Program membership.
"""

[[milestones.issues]]
id = "urdu-review"
title = "A native speaker's review of every Urdu string"
title_ur = "ہر اردو عبارت پر اہلِ زبان کی نظرِ ثانی"
body = """
Have a native Urdu editor review the app's strings (`app/lib/l10n/arb/app_ur.arb`), the receipts and the website, for natural, respectful Urdu that Pakistani landlords and tenants read easily (NFR-03).
"""

[[milestones.issues]]
id = "legal-review"
title = "A lawyer's review of the privacy notice and terms"
title_ur = "رازداری کی پالیسی اور شرائط پر وکیل کی نظرِ ثانی"
body = """
Have a Pakistani lawyer review the privacy notice and the terms of use, and the official legal texts behind the guides (WEB-01).
"""

[[milestones.issues]]
id = "app-icon"
title = "The app's own icon and store artwork"
title_ur = "ایپ کا اپنا آئیکن اور اسٹور کی تصاویر"
body = """
Replace Flutter's default launcher icon on Android, iOS and the web, with an adaptive icon and a monochrome layer for Android's themed icons, and make the store screenshots.
"""

[[milestones.issues]]
id = "billing"
title = "Paid plans, with early-access users told first"
title_ur = "ادا شدہ پلان، ابتدائی صارفین کو پہلے اطلاع کے ساتھ"
body = """
Turn on the plans on the pricing page: store subscriptions on Android and iPhone, the plan limits in the app, and notice to everyone who joined during early access before anything is charged.
"""

[[milestones.issues]]
id = "audit-screen"
title = "A screen that shows who changed what"
title_ur = "ایک اسکرین جو دکھائے کہ کس نے کیا بدلا"
body = """
The database already records structural and financial changes with who made them and when (`audit_logs`); add the screen that reads them (TEAM-05). It must exist before any assistant can write.
"""

[[milestones.issues]]
id = "mcp-read"
title = "A read-only MCP server, so a landlord's own AI can read their ledger"
title_ur = "صرف پڑھنے کا رابطہ، تاکہ مالک کا اپنا مصنوعی ذہانت والا معاون اس کا کھاتہ پڑھ سکے"
body = """
Expose who owes what, statements and the overdue list as Model Context Protocol tools, read-only, with OAuth 2.1 and a scope per portfolio, through the same role-checked database functions the app uses.
"""

[[milestones.issues]]
id = "draft-payments"
title = "Draft a payment from a voice note or a pasted SMS, always confirmed"
title_ur = "وائس نوٹ یا ایس ایم ایس سے ادائیگی کا مسودہ، ہمیشہ تصدیق کے بعد"
body = """
Turn a voice note, a bank or wallet SMS or a Raast screenshot into a draft payment that the landlord confirms. The confirmation goes through the existing idempotent `record_payment`, keyed on the message, so a resent message never counts twice.
"""

[[milestones.issues]]
id = "amount-parser"
title = "A tested reader for amounts in Urdu numerals, lakh and crore, and Roman Urdu"
title_ur = "اردو ہندسوں، لاکھ کروڑ اور رومن اردو میں لکھی رقمیں پڑھنے کا جانچا ہوا طریقہ"
body = """
No amount should come from a model's text alone. Parse amounts deterministically in `mm_core`, with shared contract vectors, and read them back before anything is saved.
"""

[[milestones.issues]]
id = "pilot"
title = "A pilot with the first landlords"
title_ur = "پہلے مالکانِ مکان کے ساتھ آزمائشی استعمال"
body = """
Put the app in the hands of a first group of landlords, including owners abroad with a caretaker, and learn what to fix and what to build next.
"""

