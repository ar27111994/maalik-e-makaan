title_ur = "واٹس ایپ پر اسسٹنٹ، وائس نوٹ کے ساتھ"
body = """
Munshi on WhatsApp: ask who owes what, record a payment or draft a reminder in Urdu, Roman Urdu or English, by text or voice note. Munshi answers only about the linked person's own portfolios and acts as that person, under the same mandate checks as any other assistant, and every write is a draft confirmed with a button. Amounts come only from the deterministic parser, audio is deleted after transcription, and no AI provider receives anything before the person's consent is recorded.

