- [ ] No request reaches a model or speech provider before the person's consent is recorded.

Depends on: `whatsapp-reminders`, `agent-limits`, `amount-parser`, `draft-payments`, `mcp-read`, `audit-screen`, `legal-review`, `urdu-review`.

