body = """
Have a Pakistani lawyer review the privacy notice, the terms of use and the facts in the guides before the stores ask for a privacy policy (WEB-01). Today's notice says AR LABS decides how tenants' data is used, though landlords enter it, and promises no analytics, so it is rewritten for the owner's three decisions of 11 November 2026, and the analytics text is approved before any analytics SDK ships. The work is a fixed-fee request for quotation to two or three firms, a review pack, the terms and notice rewritten in English and Urdu, a tenant notice, corrections to the guides and two new guides.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/legal-review.md

Done when:

- [ ] A signed review memo or letter exists, dated after November 2026.
- [ ] Every question for the lawyer is answered or explicitly deferred.
- [ ] The notice names every processor and country, matching the infrastructure and both store forms.
- [ ] The terms state the governing law, the parties' roles and the prevailing language.
- [ ] Every claim in the guides is verified against an official source or labelled unverified.

Depends on: `urdu-review`. The lawyer also reads the paid terms from `billing`, the schedule from `retention` and the deposit guide for `move-out` as each is drafted.

