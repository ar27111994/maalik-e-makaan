title = "An oversight assistant for owners abroad"
title_ur = "اوورسیز مالکوں کے لیے نظر رکھنے والا اسسٹنٹ"
body = """
Watch the caretaker's cash in hand, handovers and changes to payment details with a fixed set of plain checks over the records the caretaker already keeps, and tell the owner abroad when something needs a look, at a sensible hour where they live. Findings go to an owner inbox, a weekly digest in the owner's time zone and, when urgent, a push; no model makes the judgement. The rules need no regulator or partner and are recommended for the second half of 2027; only the evidence pack and Munshi's wording of findings belong in 2028.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/overseas-oversight.md

Done when:

- [ ] A caretaker holding Rs 60,000 in cash across three leases for 15 days produces exactly one `cash_not_handed_over` finding of Rs 60,000.00, linked to the three payments; it resolves within one run after an owner confirms a handover of Rs 60,000 (pgTAP).
- [ ] A recorded but unconfirmed handover does not lower the cash the findings use.
- [ ] An IBAN change reaches every owner by push within 15 minutes, never between 22:00 and 08:00 owner-local time, before and after British Summer Time ends.
- [ ] Re-running the job, or two runs at once, never duplicates a finding.
- [ ] A caretaker sees only the findings the owner allowed (RLS tests).
- [ ] The evidence pack for a property and month reconciles to the ledger to the paisa.
- [ ] Every string exists in English and Urdu, and no finding content reaches analytics.

This is the plan's list as it stood when this issue was opened. If the plan has changed since, its list is the one to meet before the issue is closed.

