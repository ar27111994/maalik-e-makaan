title = "Collect rent with Raast Request-to-Pay, through a licensed partner"
title_ur = "لائسنس والے پارٹنر کے ذریعے راست سے کرایہ وصول کرنا"
body = """
Send each month's rent as a Raast request to pay and record it by its reference, through a payment service provider licensed by the State Bank. AR LABS acts only as a technical client of that partner: each landlord is the partner's merchant, and the money settles straight to the landlord's own account, never through AR LABS. This ends version 1's rule that collection is recorded, not processed (open proposal P-02 in [`.planning/PROJECT.md`](https://github.com/ar27111994/maalik-e-makaan/blob/main/.planning/PROJECT.md)), so the owner's decision, a partner contract and a legal opinion come before any migration.

