This is the plan's list as it stood when this issue was opened. If the plan has changed since, its list is the one to meet before the issue is closed.

Depends on: [legal-review](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/legal-review.md), [urdu-review](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/urdu-review.md). Testers join through the test tracks of [play-store](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/play-store.md) and [app-store](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/app-store.md) once they exist, and through the APK and the web app until then.

Waits on: the residence fields ([decision 1](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/README.md#decision-1-residence-per-person-and-per-portfolio-d-16)) and the consent records ([decision 3](https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/README.md#decision-3-privacy-first-analytics-support-and-e-mail-d-18)).
"""

