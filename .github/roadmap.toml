- [ ] Calling the RPCs or the Data API directly cannot activate a sixth let unit on Free; if the owner counts Free per owner, nor a sixth by spreading units across portfolios.
- [ ] Duplicate store notifications or PSP IPNs produce exactly one entitlement change; a refund revokes it.
- [ ] A lapsed plan gives 14 days of full access, then read-only units; nothing is deleted and export works.
- [ ] The Pakistani storefront shows only Free, Pro and Business in rupees; others show only Overseas; no app text points to web prices.
- [ ] Web receipts show the tax included and a sequential number.
- [ ] Every early-access account received the notice, logged, at least 60 days before its first charge.

This is the plan's list as it stood when this issue was opened. If the plan has changed since, its list is the one to meet before the issue is closed.

