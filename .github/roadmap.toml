[[milestones.issues]]
id = "whatsapp-reminders"
title = "Scheduled reminders through the WhatsApp Business Platform"
title_ur = "واٹس ایپ بزنس کے ذریعے طے شدہ وقت پر خودکار یاد دہانیاں"
body = """
Send rent reminders automatically through the WhatsApp Cloud API, on the landlord's schedule and by the etiquette the app already follows: between 10:00 and 20:00 Pakistan time, never during Friday prayers and never twice in three days. A tenant opts in by sending a single-use code, a recorded payment cancels the reminders queued for it, and the free `wa.me` reminder from the landlord's own phone stays the default. It reverses decision D-11 (open proposal P-01 in `.planning/PROJECT.md`), so the owner decides first.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/whatsapp-reminders.md

Done when:

- [ ] No automatic message reaches a tenant without recorded, unrevoked consent.
- [ ] Nothing is sent outside 10:00 to 20:00 Pakistan time, during Friday prayers, or within three days of the tenancy's last reminder, tested with the shared vectors.
- [ ] A recorded payment cancels the due's queued reminders before their send time, even when the two race.
- [ ] STOP in English, Urdu and Roman Urdu revokes consent, and a webhook without a valid signature changes nothing.
- [ ] Re-running the planner never sends a message twice, and with the switch off nothing is sent.

Depends on: `app-store`, `legal-review`, `urdu-review`, `billing`, `tenant-portal`.

Waits on: Meta's business verification of AR LABS and the approval of the templates; letterheads (decision 2).
"""

[[milestones.issues]]
id = "agent-limits"
title = "An agent role that writes only within set limits"
title_ur = "معاون کا ایسا کردار جو صرف طے شدہ حدوں کے اندر لکھ سکے"
body = """
An assistant acts for one person and can write only within limits that person sets: which tenancies, the largest amount, a monthly total and an expiry, kept in `agent_mandates` and checked in Postgres rather than by the assistant. Its writes are drafts that wait for the person's tap unless they decide otherwise, and voids, waivers, deletions and team changes are never open to an assistant. An owner approves a caretaker's mandate, and every write is marked in the audit trail.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/agent-limits.md

Done when:

- [ ] With no mandate, an agent token can call no write function (pgTAP).
- [ ] Each limit (lease, largest amount, monthly budget, expiry, revocation) has a passing and a failing test.
- [ ] Void, waive, delete and team functions always refuse an agent.
- [ ] Parallel confirmations never exceed the monthly budget, in the concurrency scenario and in TLA+.
- [ ] Every agent write shows on the audit screen as made through the assistant, for the person.

Depends on: `audit-screen`, `mcp-read`, `amount-parser`, `draft-payments`.
"""

[[milestones.issues]]
id = "tenant-portal"
title = "A read-only link for tenants"
title_ur = "کرایہ داروں کے لیے صرف دیکھنے کا لنک"
body = """
A tenant opens a link the landlord sends once, and sees their own ledger, downloads receipts on the landlord's letterhead and copies the Raast ID, in English, Urdu or Roman Urdu, without an account. Each tenancy has one revocable link, served read-only by an Edge Function with limits per link; the page shows no other tenancy, no CNIC and no phone number, and runs no analytics. A tenant can ask for a receipt, within a limit, and the landlord sees when the link was last opened.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/tenant-portal.md

Done when:

- [ ] A link returns only its own tenancy, tested against every other lease in the fixtures.
- [ ] Revoked, rotated and expired links show the same neutral page and no data.
- [ ] No response contains a CNIC, a phone number, a note or any document other than a receipt.
- [ ] Every receipt downloads as a PDF on the portfolio's letterhead.
- [ ] The page works at 360 px wide in all three languages, and makes no request to an analytics or support host.

Depends on: `legal-review`, `urdu-review`.

Waits on: letterheads (decision 2).
"""

[[milestones.issues]]
id = "reconciliation"
title = "Suggested matches between incoming payments and open dues"
title_ur = "آنے والی ادائیگیوں اور واجب الادا رقموں کے ممکنہ جوڑ کی تجویز"
body = """
From a bank or wallet statement, or the alerts a landlord shares, suggest which open dues each incoming credit pays, for a person to approve. Statements are read on the phone: debits and dismissed lines never leave it, and only the credits the landlord keeps are uploaded. Approval goes through `record_payment` with the same key as a drafted payment, so that an SMS and a statement line for the same transfer record one payment.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/reconciliation.md

Done when:

- [ ] On a synthetic month of 60 credits, the right match is the top suggestion for at least 90% of the rent credits.
- [ ] No payment is recorded without a person's approval.
- [ ] Importing the same file twice, or the same credit from an SMS and a statement, creates no duplicate suggestion or payment.
- [ ] A network-layer test shows that no debit or dismissed line leaves the device.
- [ ] Kept credits are deleted the set number of days after they are resolved.

Depends on: `amount-parser`, `draft-payments`, `tenant-portal`, `audit-screen`, `urdu-review`.
"""

[[milestones.issues]]
id = "document-reading"
title = "Read CNICs and agreements on the phone, with masking and consent"
title_ur = "شناختی کارڈ اور کرایہ نامے فون پر پڑھنا، نمبر چھپا کر اور رضامندی کے ساتھ"
body = """
Fill a tenant's details from a photo of their CNIC or the tenancy agreement. Latin text is read on the phone, and every CNIC digit is masked in the image and the text before anything leaves it; an Urdu agreement goes to a server for reading only after masking and the landlord's preview, and nothing is kept there. Every field stays a suggestion until confirmed, gender is never inferred, and nothing is saved before the tenant's consent is recorded.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/document-reading.md

Done when:

- [ ] Network capture on Android and iOS shows no unmasked CNIC digit leaving the device.
- [ ] No extracted field is saved without a person's confirmation and a `tenant_consents` row for its purpose.
- [ ] With image storage off, nothing but the confirmed fields remains after the flow.
- [ ] Field accuracy on the synthetic evaluation set meets the owner's threshold for each type of document.
- [ ] Existing consent dates and notes survive the migration.

Depends on: `retention`, `legal-review`, `tenant-portal`, `audit-screen`, `amount-parser`, `urdu-review`.

Waits on: the owner's decision on processing outside Pakistan, and the consent records (decision 3).
"""

[[milestones.issues]]
id = "hostel-mode"
title = "Hostel and PG mode"
title_ur = "ہاسٹل اور پی جی کے لیے خاص طریقہ"
body = """
Run a hostel or PG as rooms of beds: create a building of beds in one step, see which beds are let, free or overdue, check residents in and out quickly, and record a month's rent for every bed that paid in one action, with a numbered receipt each. A checklist reminds the manager to report each new resident to the police or HotelEye in time.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/hostel-mode.md

Done when:

- [ ] A 40-bed hostel is created in one action, in under two minutes on a mid-range Android phone.
- [ ] Recording a month for 38 of 40 let beds creates 38 payments and 38 numbered receipts, and running it again creates none.
- [ ] A 200-item call finishes well inside the statement timeout in the stress harness.
- [ ] Vacant beds raise no dues and are not counted against the plan.
- [ ] A resident with no police or HotelEye entry three hours after check-in appears on the checklist and the dashboard.

Depends on: `billing`, `push-notifications`, `document-reading`, `retention`, `move-out`, `urdu-review`.
"""

[[milestones.issues]]
id = "push-notifications"
title = "Push notifications"
title_ur = "فون پر فوری اطلاعات"
body = """
Notifications on Android, iPhone and the web for dues, deadlines and cash handovers, through a `device_tokens` table, a delivery queue and a `push-send` Edge Function on Firebase Cloud Messaging. By default a notification names no tenant and no amount, and quiet hours and the digest follow each person's declared time zone. Firebase is used for messaging only, with no Firebase Analytics.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/push-notifications.md

Done when:

- [ ] Each notification reaches each of a person's devices at most once, after retries and re-runs.
- [ ] Nothing arrives in the recipient's quiet hours in their own time zone, tested across the UK clock change.
- [ ] By default no payload contains a tenant name, a phone number or an amount.
- [ ] Signing out and deleting the account stop pushes to that device, and a recorded cash handover notifies the owners who can confirm it.
- [ ] It works on Android 13 and later, on an iPhone and in Chrome, with no Firebase Analytics among the dependencies.

Depends on: `app-store`, `legal-review`, `urdu-review`.

Waits on: the time-zone field (decision 1).
"""

[[milestones.issues]]
id = "retention"
title = "Remove identity documents automatically after a tenancy ends"
title_ur = "کرایہ داری ختم ہونے کے بعد شناختی دستاویزات خود بخود حذف کرنا"
body = """
Delete CNIC copies and similar identity documents, and blank the identifying fields, a set number of months after a tenancy ends, while payments, receipts and the tenant's name on them stay for the six years the tax law asks for. Owners are told 30 days ahead, can export first and can hold a file while there is a dispute; unpaid rent holds it automatically. The first release runs as a dry run.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/retention.md

Done when:

- [ ] For a tenancy past the period with no hold, no identity document remains in storage or in `documents`.
- [ ] Identifying fields are blank in tenants, occupants, reminder previews and the audit trail's changes.
- [ ] Receipt numbers, amounts, voids and balances are byte-identical before and after.
- [ ] The owner was told at least 30 days earlier, a hold stops the purge, and an outstanding balance holds it automatically.
- [ ] The audit seals still verify, and the privacy notice states the schedule in English and Urdu.

Depends on: `legal-review`, `push-notifications`, `audit-screen`, `urdu-review`.
"""

[[milestones.issues]]
id = "move-out"
title = "A move-out photo checklist"
title_ur = "مکان چھوڑتے وقت تصویروں کے ساتھ جانچ کی فہرست"
body = """
Dated photos of each room at move-in and at move-out, acknowledged by both sides, so that deductions from the deposit rest on a record both of them saw. The settlement raises damage charges, pays them from the deposit with a receipt in the gapless series and refunds the rest, and a utilities checklist covers the final bills. The report and statement are in English and Urdu on the landlord's letterhead; the app records what both sides saw and does not decide what may be deducted.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/move-out.md

Done when:

- [ ] A move-in inspection with at least one photo per room can be completed and acknowledged.
- [ ] Move-out shows each room beside its move-in photo, and every deduction links to a photo, a final bill or an unpaid charge.
- [ ] Settlement totals equal the ledger postings to the paisa, and the deposit adjustment carries a receipt in the gapless series.
- [ ] An acknowledged inspection cannot be edited, only voided with a reason.
- [ ] The report renders in English and Urdu with the letterhead, and no stored photo carries a location.

Depends on: `legal-review`, `retention`, `tenant-portal`, `urdu-review`, `push-notifications`, `billing`.

Waits on: letterheads (decision 2).
"""

[[milestones]]
id = "money"
title = "Money that moves"
title_ur = "براہِ راست وصولی"
due = "2028-11-30"
description = "Collect rent, not just record it, through licensed partners on Pakistan's payment rails, and give owners abroad an assistant that watches for them."
description_ur = "کرایہ صرف درج نہیں بلکہ وصول کرنا، پاکستان کے ادائیگی کے نظام پر لائسنس یافتہ شراکت داروں کے ذریعے، اور بیرونِ ملک مالکان کے لیے ایک نگران معاون۔"

[[milestones.issues]]
id = "raast-request-to-pay"
title = "Collect rent with Raast Request-to-Pay, through a licensed partner"
title_ur = "لائسنس یافتہ شراکت دار کے ذریعے راست سے کرایہ وصولی"
body = """
Send each month's rent as a Raast request to pay and record it by its reference, through a payment service provider licensed by the State Bank. AR LABS acts only as a technical client of that partner: each landlord is the partner's merchant, and the money settles straight to the landlord's own account, never through AR LABS. This ends version 1's rule that collection is recorded, not processed (open proposal P-02 in `.planning/PROJECT.md`), so the owner's decision, a partner contract and a legal opinion come before any migration.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/raast-request-to-pay.md

Done when:

- [ ] The decision entry is merged and the legal opinion is on file before the first migration.
- [ ] Each due has at most one live request, and ending a lease cancels its requests.
- [ ] Each partner payment is recorded exactly once with duplicate, late and out-of-order webhooks, and alongside a manual entry of the same transfer.
- [ ] A forged, unsigned or replayed webhook records nothing.
- [ ] In the sandbox every settlement goes to the landlord's account and none to AR LABS, and no request goes to a tenant without their consent.

Depends on: `billing`, `audit-screen`, `tenant-portal`, `reconciliation`, `draft-payments`, `push-notifications`, `legal-review`.

Waits on: a partner contract and a legal opinion.
"""

[[milestones.issues]]
id = "open-banking"
title = "Bank account data through open banking"
title_ur = "اوپن بینکنگ کے ذریعے بینک کھاتے کی معلومات"
body = """
Read incoming rent from a landlord's bank account, with their consent, once the State Bank's open-banking regulations are final and a licensed provider exists. One step cannot wait: comments on the draft regulations close on 30 November 2026, and the response should ask for the remitter's name and the transfer reference in transaction data. Once built, only credits are imported, into the reconciliation inbox, and nothing becomes a payment without the landlord's approval.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/open-banking.md

Done when:

- [ ] The consultation response is sent by 30 November 2026, or the owner has decided not to send one.
- [ ] Imports run only under an active, recorded consent, and revoking it stops imports within one cycle and deletes the token.
- [ ] No banking password, PIN or other credential is ever asked for or stored.
- [ ] Only credits are written: fixtures that mix credits and debits leave no debit in any table or log.
- [ ] No credit becomes a payment without a person's approval, and one already recorded by hand shows as matched.

Depends on: `reconciliation`, `draft-payments`, `audit-screen`, `legal-review`.

Waits on: the State Bank's final rules, licensed providers and a partner contract.
"""

[[milestones.issues]]
id = "overseas-oversight"
title = "An oversight assistant for owners abroad"
title_ur = "بیرونِ ملک مالکان کے لیے نگران معاون"
body = """
Watch the caretaker's cash in hand, handovers and changes to payment details with a fixed set of plain checks over the records the caretaker already keeps, and tell the owner abroad when something needs a look, at a sensible hour where they live. Findings go to an owner inbox, a weekly digest in the owner's time zone and, when urgent, a push; no model makes the judgement. The rules need no regulator or partner and are recommended for the second half of 2027; only the evidence pack and Munshi's wording of findings belong in 2028.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/overseas-oversight.md

Done when:

- [ ] A caretaker holding Rs 60,000 in cash across three leases for 15 days produces exactly one finding of Rs 60,000.00, which resolves within one run after an owner confirms the handover.
- [ ] A recorded but unconfirmed handover does not lower the cash the findings use.
- [ ] A change of IBAN reaches every owner by push within 15 minutes, never at night in the owner's own time zone.
- [ ] Re-running the job, or two runs at once, never duplicates a finding.
- [ ] A caretaker sees only the findings the owner allowed, and the evidence pack reconciles to the ledger to the paisa.

Depends on: `push-notifications`, `audit-screen`, `retention`, `legal-review`; Munshi's wording of findings also needs `whatsapp-assistant`.

Waits on: the residence fields (decision 1).
"""

[[milestones.issues]]
id = "agent-coordination"
title = "Landlord, tenant and caretaker assistants that work together"
title_ur = "مالک، کرایہ دار اور نگران کے معاون جو مل کر کام کریں"
body = """
Let the tenant's, the caretaker's and the landlord's assistants hand each other structured items that can be checked, such as a tenant's payment claim or a caretaker's cash handover, which reach the owner as drafts to confirm and never as ledger writes. The first phase coordinates through database rows, and only structured fields pass from one role to another; signed webhooks come with the first outside subscriber. An open agent-to-agent interface is built only when a real outside agent wants one.

Plan: https://github.com/ar27111994/maalik-e-makaan/blob/main/docs/roadmap/agent-coordination.md

Done when:

- [ ] A tenant's claim and a caretaker's handover each reach an owner as a draft to confirm, never as a ledger write.
- [ ] A claim and a statement line for the same transfer record one payment.
- [ ] Injection fixtures in a claim's or a handover's text never reach the other side's assistant.
- [ ] Outbound webhooks verify against the published key directory, including after a key rotation.
- [ ] If an agent-to-agent interface is built, an outside agent can do nothing beyond its grant.

Depends on: `agent-limits`, `tenant-portal` and `whatsapp-assistant` for the first phase; `mcp-read`, `reconciliation`, `overseas-oversight`, `raast-request-to-pay` and `open-banking` for the rest.
"""
