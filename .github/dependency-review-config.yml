# dependency-review-action configuration (security.yml, Dependency review).
fail-on-severity: moderate
# Copyleft licences would oblige the closed app binaries.
deny-licenses:
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
# GitHub's dependency graph gives these pub packages lowercase licence IDs
# ("mit", "bsd-3-clause"), which the action cannot parse as SPDX, and it
# fails on an unparsable licence even when nothing is denied. Their licence
# files were read on 2026-11-09: BSD-3-Clause, MIT, Apache-2.0 and MPL-2.0
# (dbus), none copyleft (THIRD_PARTY_NOTICES.md). A pub package added later
# fails the same way until its licence is checked and it is listed here.
allow-dependencies-licenses:
  - pkg:pub/_fe_analyzer_shared
  - pkg:pub/analyzer
  - pkg:pub/android_file_picker
  - pkg:pub/archive
  - pkg:pub/cli_util
  - pkg:pub/clock
