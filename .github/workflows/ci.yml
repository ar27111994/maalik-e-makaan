# Quality, test and coverage gates. Every job runs a Makefile target, so a
# green `make` locally means a green job here. "CI passed" is the single
# required status check for branch protection.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain pins. Other workflows repeat them, and make docs-check
  # (tool/docs/sync_facts.py) checks those copies and the versions the docs name.
  FLUTTER_VERSION: 3.47.9
  DENO_VERSION: 2.9.6
  SUPABASE_CLI_VERSION: 2.122.1
  JAVA_VERSION: "21"
  PYTHON_VERSION: "3.13"
  # Colour in logs, no telemetry prompts.
  FORCE_COLOR: "1"
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tool/requirements*.txt
      - name: Python tools, formatters and linters (hash-pinned)
        run: python3 -m pip install --require-hashes -r tool/requirements.txt -r tool/requirements-lint.txt
      - name: Commit messages follow the conventions (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
      - name: Commit messages follow the conventions (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A force-push can leave `before` outside the new history; check the head commit then.
          if git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            npx --no-install commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            npx --no-install commitlint --last --verbose
          fi
      - name: Formatting (Python, shell, Markdown, YAML, JSON)
        run: make format-check-repo
      - name: Lint (make lint)
        run: make lint
      - name: Repository tooling tests
        run: make test-tools
      - name: Generated files are up to date
        run: make tokens-check icons-check fonts-check app-icons-check contracts-check roadmap-check docs-check
      - name: DESIGN.md is valid
        run: npx --yes --package @google/design.md@0.4.0 designmd lint DESIGN.md

  dart:
    name: Dart · ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: mm_core
            dir: packages/mm_core
            analyzer: dart
            target: test-core
          - package: mm_ui
            dir: packages/mm_ui
            analyzer: flutter
            target: test-ui
          - package: app
            dir: app
            analyzer: flutter
            target: test-app
          # The mm_ui gallery: every page in every theme, Urdu and 200% text,
          # with the accessibility checks (no coverage gate of its own).
          - package: mm_ui_gallery
            dir: packages/mm_ui/example
            analyzer: flutter
            target: test-gallery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Localisations are up to date
        if: matrix.package == 'app'
        working-directory: app
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
      - name: Formatting
        env:
          DIR: ${{ matrix.dir }}
        run: dart format --output=none --set-exit-if-changed "$DIR"
      - name: Static analysis
        working-directory: ${{ matrix.dir }}
        env:
          ANALYZER: ${{ matrix.analyzer }}
        run: '"$ANALYZER" analyze --fatal-infos'
      - name: Tests (make ${{ matrix.target }}, with its coverage gate if it has one)
        env:
          TARGET: ${{ matrix.target }}
        run: make "$TARGET"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.package }}
          path: ${{ matrix.dir }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload golden-test failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-${{ matrix.package }}
          path: ${{ matrix.dir }}/test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  web-build:
    name: Flutter web release build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLACEHOLDER_SUPABASE: https://placeholder.supabase.co
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: app
        # The example configuration is enough to prove the release build compiles;
        # deployments build with the real values.
        run: >
          flutter build web --release --no-web-resources-cdn
          --dart-define-from-file=config/production.example.json
      - name: Package for Vercel, as the Deploy workflow does
        run: >
          python3 tool/web/package_vercel.py --build app/build/web
          --output "$RUNNER_TEMP/vercel/.vercel/output" --supabase-url "$PLACEHOLDER_SUPABASE"
      - name: Headers, fallback and App Links of the package
        # The same smoke test as after a deploy, against a local server that
        # applies the package's config.json the way Vercel does.
        run: |
          python3 tool/web/serve_output.py "$RUNNER_TEMP/vercel/.vercel/output" --port 8080 &
          for _ in {1..20}; do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
          tool/web/smoke_test.sh http://127.0.0.1:8080 io.github.ar27111994.maalik_e_makaan \
            "$PLACEHOLDER_SUPABASE"

  website:
    name: Website (Astro)
    runs-on: ubuntu-24.04
    # About 10 minutes: install 1, check 1, build 1, e2e 3, Lighthouse subset 5.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Playwright's Chromium (the build @playwright/test in the lockfile pins)
        run: npx --no-install playwright install --with-deps chromium
      - name: Types, lint and formatting (astro check, tsc, ESLint, Stylelint, Prettier)
        run: npm run check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Pitch deck (PDF, from deck/ and the current release)
        run: npm run deck
      - name: Build (fails on a missing twin page or inline code)
        run: npm run build
      - name: Links, then Playwright end to end with axe
        run: npm run test:e2e
      - name: Lighthouse on a subset of pages (both languages, each category 95 or more)
        run: npm run lighthouse:ci
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-playwright-report
          path: |
            website/playwright-report/
            website/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-lighthouse
          path: website/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    name: Android release build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build an app bundle (debug-signed outside releases)
        working-directory: app
        run: >
          flutter build appbundle --release
          --dart-define-from-file=config/production.example.json
      - name: Check the merged release manifest
        # The main manifest can pass while a plugin or Gradle setting changes
        # what ships, so check what the release build actually merged.
        run: |
          mapfile -t manifests < <(find app/build/app/intermediates -type f \
            -path '*merged_manifest*/release/*' -name AndroidManifest.xml)
          if ((${#manifests[@]} == 0)); then
            echo "No merged release manifest under app/build/app/intermediates" >&2
            exit 1
          fi
          python3 tool/android/check_manifest.py "${manifests[@]}"

  ios-build:
    # Proves the iOS app compiles and keeps an unsigned build to install with
    # one's own Apple Account (docs/operations.md, iOS builds). No signing
    # identity is needed or used.
    name: iOS build (unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build for iPhone without signing
        working-directory: app
        run: >
          flutter build ios --release --no-codesign
          --dart-define-from-file=config/production.example.json
      - name: Package an unsigned .ipa
        run: tool/ios/package_unsigned_ipa.sh app/build/ios/iphoneos/Runner.app maalik-e-makaan-unsigned.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-ipa
          path: maalik-e-makaan-unsigned.ipa
          retention-days: 14

  functions:
    name: Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.lock') }}
      - name: Format, lint and type-check
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno task check
      - name: Tests with the 100% coverage gate
        run: make test-functions

  database:
    name: Database (pgTAP and concurrency)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL 16 and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "alter role postgres password 'postgres'"
      - name: Migrations and pgTAP suites
        run: make test-db
      # About 5 minutes. Each scenario has its own watchdog (tool/db/concurrency_test.sh);
      # this limit ends the step, not the job, so its log can still be read.
      - name: Concurrency scenarios and invariants
        timeout-minutes: 20
        run: make test-db-concurrency

  supabase-stack:
    name: Supabase stack (pgTAP, lint, function e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.lock') }}
      - name: Function secrets for the local stack
        run: cp supabase/functions/.env.example supabase/functions/.env
      - name: Start the stack
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,postgres-meta
      - name: Database lint (plpgsql_check)
        run: supabase db lint --level error --fail-on error
      - name: pgTAP suites on the real stack
        run: supabase test db
      - name: Edge Functions end to end
        run: make test-functions-e2e
      # A stack that failed to start leaves no container: say so instead of
      # failing this step and hiding the error above.
      - name: Function logs
        if: failure()
        run: |
          id="$(docker ps -aq --filter name=supabase_edge_runtime | head -n 1)"
          if [[ -n "$id" ]]; then
            docker logs "$id" 2>&1 | tail -200
          else
            echo "No edge-runtime container: the stack did not start (see 'Start the stack')."
          fi
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  uat:
    name: UAT (web app on the Supabase stack)
    runs-on: ubuntu-24.04
    # About 12 minutes: stack 3, Flutter web build 4, Playwright browser 1,
    # the journeys 2.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/uat/package-lock.json
      - name: Function secrets for the local stack (with a storage-cleanup token)
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          echo "STORAGE_CLEANUP_TOKEN=$(openssl rand -hex 24)" >> supabase/functions/.env
      - name: Start the stack
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,postgres-meta
      - run: flutter pub get
      - name: Playwright and its Chromium (the build the lockfile pins)
        working-directory: app/uat
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: The journeys (make test-uat)
        env:
          UAT_SCREENSHOTS: ${{ runner.temp }}/uat-screenshots
        run: make test-uat
      - name: Upload the Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uat-report
          path: |
            app/uat/build/report/
            app/uat/build/test-results/
            ${{ runner.temp }}/uat-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      # The page as Playwright last saw it (its accessibility snapshot), so a
      # failure can be read from the log; the data is the journeys' own.
      - name: Page at the failure
        if: failure()
        run: |
          shopt -s nullglob
          for file in app/uat/build/test-results/*/error-context.md; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
      - name: Function, auth, storage and REST logs
        if: failure()
        run: |
          for name in supabase_edge_runtime supabase_auth supabase_storage supabase_rest; do
            id="$(docker ps -aq --filter "name=$name" | head -n 1)"
            if [[ -n "$id" ]]; then
              echo "::group::$name"
              docker logs "$id" 2>&1 | tail -100
              echo "::endgroup::"
            else
              echo "No $name container: the stack did not start (see 'Start the stack')."
            fi
          done
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  formal:
    name: Formal verification (TLA+, Lean, Z3, Bend)
    runs-on: ubuntu-24.04
    # `make verify` took 11 minutes on a shared, overloaded 4-CPU machine from a
    # cold Lean build and Bend kernel (TLA+ 10, Lean and Z3 0.25, Bend 1). The
    # installer unpacks in under a minute; a cache miss also downloads the pinned tools (sizes in
    # formal/README.md).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TLC 2.19 runs on Java 11 or later.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # z3-solver is hash-pinned for the Python requirements.txt is compiled with.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The pinned tools (about 7 GB unpacked, mostly the two Lean toolchains)
      # and the Bend kernel built with Lean 4.34.0. The installer checks every
      # download's sha256, so a new pin needs a new key: it hashes the installer.
      - name: Cache the pinned formal-verification tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/formal
            ~/.bend/bendtt
          key: formal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/formal/install.sh', 'tool/formal/requirements.txt') }}
      - name: Install the pinned tools (sha256-verified, idempotent)
        run: make formal-install
      - name: Every track's ci set (TLA+, Lean and Z3, Bend)
        run: make verify

  passed:
    name: CI passed
    if: always()
    needs:
      [
        hygiene,
        dart,
        web-build,
        website,
        android-build,
        ios-build,
        functions,
        database,
        supabase-stack,
        uat,
        formal,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || { echo "::error::A required job did not succeed"; exit 1; }
          done
