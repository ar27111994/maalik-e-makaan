# Releases. release-please keeps a release pull request open from the
# conventional commits on main; merging it tags vX.Y.Z, writes CHANGELOG.md and
# publishes a GitHub release. This workflow then builds the signed Android app,
# the web app and an unsigned iOS app for that tag in jobs that can write nothing,
# hands each build's files to a publish job of its own on a fresh runner, which
# attests their provenance and attaches them with that provenance beside them as a
# .intoto.jsonl file (SECURITY.md, Checking a download; docs/operations.md, Release
# provenance), and deploys the tag to production
# (deploy.yml): the backend and the web app at once, the website once those
# builds and the web app's deploy have finished. The builds start only once the
# web app's origin answers (tool/web/check_live.py), since every one of them
# names it, and Auth allows the e-mail link callbacks they send
# (tool/web/check_auth_urls.py; a token that may not read Auth's settings only
# warns there, and the builds go ahead).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Equal to ci.yml's; make docs-check checks them.
  FLUTTER_VERSION: 3.47.9
  JAVA_VERSION: "21"

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tag, changelog and GitHub release
      issues: write # labels on the release pull request
      pull-requests: write # open and update the release pull request
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with GITHUB_TOKEN does not trigger CI, so a
          # fine-grained token (contents and pull requests: write) is preferred.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  preflight:
    # Every build names the web app's origin (its APP_URL, from the tag's
    # contracts/origins.json), and the Android app lists it in its App Links.
    # An origin that does not answer over HTTPS would break the e-mail links of
    # every install, and on Android 6 to 11 the App Links of the earlier host
    # too (all of an app's hosts verify, or none). And each build asks Auth to
    # send its e-mail links to its own callback (the origin's, and on iOS the
    # same under the app's URL scheme): one Auth does not allow sends them to the
    # Site URL, where no build can finish the sign-in. An APK cannot be recalled,
    # so nothing is built or attached until both hold (docs/operations.md,
    # Domains). A token that may not read Auth's settings only warns, and the
    # builds go ahead; check them by hand then. Re-run the failed jobs once the
    # origin answers or Auth allows the callbacks. Deploy's supabase job runs the
    # same Auth check before it deploys.
    name: The web app's origin answers and Auth allows its callbacks
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment of the builds it gates, so a reviewer or branch rule on it holds this job
    # too. A push to main runs it, so such a rule must allow main, never tags alone
    # (docs/release-readiness.md, Optional hardening).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: The web app's origin answers over HTTPS
        run: python3 tool/web/check_live.py app
      - name: Auth accepts the e-mail links of the release's builds
        # Read with the Management API; only the Site URL and the redirect URLs are kept.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python3 tool/web/check_auth_urls.py --project-ref "$PROJECT_REF"

  artefacts:
    # Builds with the workflow's read-only token and no OIDC token: Gradle's plugins, the pub
    # packages and Flutter run here, and none of them can write to the release or sign a
    # provenance. publish-artefacts attests and attaches what this job hands over.
    name: Build the Android app and the web app
    needs: [release-please, preflight]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read # check out the tag; nothing in this job can write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Production configuration
        # Public values only (the publishable key is meant for clients). The
        # Supabase ones live in repository variables; APP_URL is the web app's
        # origin in the tag's contracts/origins.json (decision D-20). The app
        # refuses anything else at start.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Repository variable $name is not set"; exit 1; }
          done
          APP_URL="$(jq -er .app.origin contracts/origins.json)"
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" --arg app "$APP_URL" \
            '{ENVIRONMENT: "production", SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, APP_URL: $app}' \
            > app/config/production.json
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          base64 --decode <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
          echo "MM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Android (app bundle and per-ABI APKs)
        working-directory: app
        env:
          MM_REQUIRE_RELEASE_SIGNING: "true"
          MM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        # Version codes: Flutter gives each split APK 1000 x its ABI number (1 to 4) plus the
        # build number, so the app bundle (for Google Play) adds 10000 to stay above every APK
        # of the same or an earlier release. Play can then update a phone that sideloaded an
        # APK, when Play signs with the same key (docs/operations.md, Releasing).
        run: |
          common=(--release --build-name="$VERSION"
            --dart-define-from-file=config/production.json --obfuscate --split-debug-info=build/symbols)
          flutter build appbundle "${common[@]}" --build-number="$((10000 + BUILD_NUMBER))"
          flutter build apk --split-per-abi "${common[@]}" --build-number="$BUILD_NUMBER"
      - name: Web
        working-directory: app
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define-from-file=config/production.json
      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp app/build/app/outputs/bundle/release/app-release.aab "dist/maalik-e-makaan-$TAG.aab"
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            cp "$apk" "dist/maalik-e-makaan-$TAG-$abi.apk"
          done
          (cd app/build/web && zip -qr "../../../dist/maalik-e-makaan-$TAG-web.zip" .)
          (cd app/build && zip -qr "../../dist/maalik-e-makaan-$TAG-debug-symbols.zip" symbols)
          (cd dist && sha256sum -- * > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"
      - id: upload
        name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per attempt, so a re-run of this job never meets the earlier attempt's
          # artifact; the publish job takes it by its id, never by this name.
          name: release-android-web-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          # publish-artefacts reads it minutes later; a week leaves time to look at the files of
          # a failed run (they are public on the release anyway).
          retention-days: 7
          compression-level: 0 # APKs, the app bundle and the zips are compressed already

  ios:
    # Unsigned: there is no Apple Developer Program membership yet. The owner
    # signs it with their own Apple Account to install it (docs/operations.md,
    # iOS builds). Like artefacts, it builds with the read-only token: CocoaPods, the pub
    # packages and Flutter run here, and publish-ios attests and attaches what it hands over.
    name: Build the unsigned iOS app
    needs: [release-please, preflight]
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read # check out the tag; nothing in this job can write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Production configuration
        # The same public values as the Android and web builds.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Repository variable $name is not set"; exit 1; }
          done
          APP_URL="$(jq -er .app.origin contracts/origins.json)"
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" --arg app "$APP_URL" \
            '{ENVIRONMENT: "production", SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, APP_URL: $app}' \
            > app/config/production.json
      - name: iOS (unsigned)
        working-directory: app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: >
          flutter build ios --release --no-codesign
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          --dart-define-from-file=config/production.json
      - name: Package
        run: |
          mkdir -p dist
          tool/ios/package_unsigned_ipa.sh app/build/ios/iphoneos/Runner.app \
            "dist/maalik-e-makaan-$TAG-ios-unsigned.ipa"
          (cd dist && shasum -a 256 -- * > SHA256SUMS-ios)
      - id: upload
        name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per attempt, so a re-run of this job never meets the earlier attempt's
          # artifact; the publish job takes it by its id, never by this name.
          name: release-ios-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # the .ipa is a zip already

  publish-artefacts:
    # A fresh runner that runs no build tool and checks nothing out. It takes the files
    # of the artefacts job by the artifact's id, keeps only the names this release attaches
    # for that build, attests them, checks the provenance file against each and attaches
    # them. A process a build left running cannot reach this machine, and no build tool
    # holds this job's write token or its OIDC token. tool/github/check_release_provenance.py
    # (make lint) holds this job to exactly these values.
    name: Attest and attach the Android and web files
    needs: [release-please, artefacts]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      attestations: write # record build provenance
      contents: write # upload assets to the release
      id-token: write # sign the provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: The build's files, by the artifact's id
        # By id, not by name: an artifact another job of the run made or replaced under this
        # name is not this one, and the download fails. The digest GitHub recorded at the
        # upload is checked (digest-mismatch: error). An empty id (an output the runner
        # skipped, say because it held a masked value) would download every artifact of the
        # run; 'missing' is no id, so the download fails instead.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.artefacts.outputs.artifact-id || 'missing' }}
          path: build
          digest-mismatch: error
      - name: Only the files this release attaches for the build
        # Exactly these names: a missing file fails mv, and anything else the artifact holds
        # (a file named as the other build's, say) fails rmdir, so neither is attested or
        # attached.
        run: |
          mkdir dist
          mv -- build/SHA256SUMS "build/maalik-e-makaan-$TAG.aab" \
            "build/maalik-e-makaan-$TAG"-{arm64-v8a,armeabi-v7a,x86_64}.apk \
            "build/maalik-e-makaan-$TAG"-{web,debug-symbols}.zip dist/
          rmdir build
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Provenance file, checked against every file it covers
        # The attestation is a Sigstore bundle naming every file in dist/. It goes beside them
        # as a .intoto.jsonl file, the provenance file Scorecard's Signed-Releases check counts,
        # and is checked here against each of them, with the options SECURITY.md gives, before
        # anything is attached. The source ref is main's literally: a run started by hand from
        # another branch fails here and attaches nothing.
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          PROVENANCE: dist/maalik-e-makaan-${{ needs.release-please.outputs.tag }}.intoto.jsonl
        run: |
          gh --version
          cp -- "$BUNDLE" "$PROVENANCE"
          for file in dist/*; do
            [[ "$file" == "$PROVENANCE" ]] && continue
            gh attestation verify "$file" --bundle "$PROVENANCE" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --deny-self-hosted-runners
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-ios:
    # A fresh runner that runs no build tool and checks nothing out. It takes the files
    # of the ios job by the artifact's id, keeps only the names this release attaches
    # for that build, attests them, checks the provenance file against each and attaches
    # them. A process a build left running cannot reach this machine, and no build tool
    # holds this job's write token or its OIDC token. tool/github/check_release_provenance.py
    # (make lint) holds this job to exactly these values.
    name: Attest and attach the iOS files
    needs: [release-please, ios]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      attestations: write # record build provenance
      contents: write # upload assets to the release
      id-token: write # sign the provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: The build's files, by the artifact's id
        # By id, not by name: an artifact another job of the run made or replaced under this
        # name is not this one, and the download fails. The digest GitHub recorded at the
        # upload is checked (digest-mismatch: error). An empty id (an output the runner
        # skipped, say because it held a masked value) would download every artifact of the
        # run; 'missing' is no id, so the download fails instead.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ios.outputs.artifact-id || 'missing' }}
          path: build
          digest-mismatch: error
      - name: Only the files this release attaches for the build
        # Exactly these names: a missing file fails mv, and anything else the artifact holds
        # (a file named as the other build's, say) fails rmdir, so neither is attested or
        # attached.
        run: |
          mkdir dist
          mv -- build/SHA256SUMS-ios "build/maalik-e-makaan-$TAG-ios-unsigned.ipa" dist/
          rmdir build
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Provenance file, checked against every file it covers
        # The attestation is a Sigstore bundle naming every file in dist/. It goes beside them
        # as a .intoto.jsonl file, the provenance file Scorecard's Signed-Releases check counts,
        # and is checked here against each of them, with the options SECURITY.md gives, before
        # anything is attached. The source ref is main's literally: a run started by hand from
        # another branch fails here and attaches nothing.
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          PROVENANCE: dist/maalik-e-makaan-${{ needs.release-please.outputs.tag }}-ios.intoto.jsonl
        run: |
          gh --version
          cp -- "$BUNDLE" "$PROVENANCE"
          for file in dist/*; do
            [[ "$file" == "$PROVENANCE" ]] && continue
            gh attestation verify "$file" --bundle "$PROVENANCE" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --deny-self-hosted-runners
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  deploy:
    # The backend and the web app, without waiting for the builds above: its
    # supabase job runs the same Auth check, and its web job the same origin
    # check, before either deploys anything.
    name: Deploy the release
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      issues: read # asked for by deploy.yml's site job, skipped here
    uses: $/.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
      skip-site: true
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  site:
    # The download page links to the files publish-artefacts and publish-ios
    # attach, and only to those attached when the site is built (deploy.yml), so
    # the website waits for both to finish. It goes out even if a build or a
    # publish job failed (that publish job is then skipped or failed), without
    # that build's files (or with the part an upload cut off part-way left on
    # the release); re-running the failed job runs this one again after
    # it, and the page then links to them too. It also waits for the backend
    # and the web app (deploy), and goes out only once they are deployed: the
    # site links to the web app and to builds that expect this release's
    # backend, and after a move to a web app built for its new address
    # (docs/operations.md, Domains). Re-running deploy runs this one after it.
    name: Deploy the website
    needs: [release-please, publish-artefacts, publish-ios, deploy]
    if: >-
      ${{ !cancelled() && needs.release-please.outputs.created == 'true'
      && needs.deploy.result == 'success' }}
    permissions:
      contents: read
      issues: read # the roadmap page reads the roadmap's milestones and issues
    uses: $/.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
      site-only: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
