# Releases. release-please keeps a release pull request open from the
# conventional commits on main; merging it tags vX.Y.Z, writes CHANGELOG.md and
# publishes a GitHub release. This workflow then builds the signed Android app,
# the web app and an unsigned iOS app for that tag, attests their provenance and
# attaches them, and deploys the tag to production (deploy.yml).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.9

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tag, changelog and GitHub release
      issues: write # labels on the release pull request
      pull-requests: write # open and update the release pull request
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with GITHUB_TOKEN does not trigger CI, so a
          # fine-grained token (contents and pull requests: write) is preferred.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artefacts:
    name: Build and attach artefacts
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      attestations: write # record build provenance
      contents: write # upload assets to the release
      id-token: write # sign the provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Production configuration
        # Public values only (the publishable key is meant for clients). They
        # live in repository variables; the app refuses anything else at start.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY APP_URL; do
            [[ -n "${!name}" ]] || { echo "::error::Repository variable $name is not set"; exit 1; }
          done
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" --arg app "$APP_URL" \
            '{ENVIRONMENT: "production", SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, APP_URL: $app}' \
            > app/config/production.json
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          base64 --decode <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
          echo "MM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Android (app bundle and per-ABI APKs)
        working-directory: app
        env:
          MM_REQUIRE_RELEASE_SIGNING: "true"
          MM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        # Version codes: Flutter gives each split APK 1000 x its ABI number (1 to 4) plus the
        # build number, so the app bundle (for Google Play) adds 10000 to stay above every APK
        # of the same or an earlier release. Play can then update a phone that sideloaded an
        # APK, when Play signs with the same key (docs/operations.md, Releasing).
        run: |
          common=(--release --build-name="$VERSION"
            --dart-define-from-file=config/production.json --obfuscate --split-debug-info=build/symbols)
          flutter build appbundle "${common[@]}" --build-number="$((10000 + BUILD_NUMBER))"
          flutter build apk --split-per-abi "${common[@]}" --build-number="$BUILD_NUMBER"
      - name: Web
        working-directory: app
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define-from-file=config/production.json
      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp app/build/app/outputs/bundle/release/app-release.aab "dist/maalik-e-makaan-$TAG.aab"
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            cp "$apk" "dist/maalik-e-makaan-$TAG-$abi.apk"
          done
          (cd app/build/web && zip -qr "../../../dist/maalik-e-makaan-$TAG-web.zip" .)
          (cd app/build && zip -qr "../../dist/maalik-e-makaan-$TAG-debug-symbols.zip" symbols)
          (cd dist && sha256sum -- * > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    # Unsigned: there is no Apple Developer Program membership yet. The owner
    # signs it with their own Apple Account to install it (docs/operations.md,
    # iOS builds).
    name: Build and attach the unsigned iOS app
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      attestations: write # record build provenance
      contents: write # upload assets to the release
      id-token: write # sign the provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Production configuration
        # The same public values as the Android and web builds.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY APP_URL; do
            [[ -n "${!name}" ]] || { echo "::error::Repository variable $name is not set"; exit 1; }
          done
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" --arg app "$APP_URL" \
            '{ENVIRONMENT: "production", SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, APP_URL: $app}' \
            > app/config/production.json
      - name: iOS (unsigned)
        working-directory: app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: >
          flutter build ios --release --no-codesign
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          --dart-define-from-file=config/production.json
      - name: Package
        run: |
          mkdir -p dist
          tool/ios/package_unsigned_ipa.sh app/build/ios/iphoneos/Runner.app \
            "dist/maalik-e-makaan-$TAG-ios-unsigned.ipa"
          (cd dist && shasum -a 256 -- * > SHA256SUMS-ios)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.ipa
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  deploy:
    name: Deploy the release
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
