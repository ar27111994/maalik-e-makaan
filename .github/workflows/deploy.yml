# Production deployment: the Supabase backend (migrations, then Edge Functions),
# then the Flutter web app on Vercel, and, independently of both, the website
# (website/) on Vercel, each followed by a smoke test. The Release workflow
# calls it twice for the tag it has just released: the backend and the web app
# at once, and the website once the release's files are attached, because the
# download page links to them. It also runs by hand (Actions, Deploy, Run
# workflow), for the branch or tag chosen there. The "production" environment
# should require a reviewer (repository settings).
#
# When another workflow calls this one, these steps come from the caller's
# commit (main, for site-refresh.yml) but the files they build come from
# inputs.ref, which can be an older tag: a step that runs a script from the
# checkout must cope with a tag that predates the script.
#
# It is called rather than started by the "release published" event: a
# release that release-please creates with the default GITHUB_TOKEN starts no
# other workflow, so the first release would not have deployed without a
# personal token (docs/operations.md, Releasing).
name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: The tag to deploy
        type: string
        required: true
      site-only:
        description: Deploy only the website (site-refresh.yml, for a fresh roadmap)
        type: boolean
        default: false
      skip-site:
        description: Deploy everything but the website (release.yml deploys it later)
        type: boolean
        default: false
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false
      VERCEL_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      site-only:
        description: Only the website (the backend and the web app stay as they are)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Keep equal to ci.yml and release.yml.
  FLUTTER_VERSION: 3.47.9

defaults:
  run:
    shell: bash

jobs:
  supabase:
    name: Supabase (migrations and functions)
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SUPABASE_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Deployment is configured
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF SUPABASE_URL; do
            [[ -n "${!name}" ]] || { echo "::error::$name is not set (docs/operations.md, Deployment)"; exit 1; }
          done
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Pending migrations
        run: supabase db push --linked --dry-run
      - name: Apply migrations
        run: supabase db push --linked
      - name: Deploy Edge Functions
        # verify_jwt per function comes from supabase/config.toml.
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
      - name: Smoke test
        run: |
          status="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' \
            --retry 5 --retry-delay 5 --retry-all-errors "$SUPABASE_URL/functions/v1/health")"
          cat "$RUNNER_TEMP/health.json"; echo
          [[ "$status" == "200" ]] || { echo "::error::health answered $status"; exit 1; }

  web:
    name: Web app (Vercel)
    needs: supabase
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://maalik-e-makaan.vercel.app
    env:
      SITE_URL: https://maalik-e-makaan.vercel.app
      ANDROID_PACKAGE: io.github.ar27111994.maalik_e_makaan
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Deployment is configured
        # The token reaches only this step and the deploy, not the build's packages.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || {
            echo "::error::Secret VERCEL_TOKEN is not set (docs/operations.md, Deployment)"; exit 1; }
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY APP_URL; do
            [[ -n "${!name}" ]] || { echo "::error::Repository variable $name is not set"; exit 1; }
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Production configuration
        # Public values only, as in release.yml (the publishable key is meant for clients).
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" --arg app "$APP_URL" \
            '{ENVIRONMENT: "production", SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, APP_URL: $app}' \
            > app/config/production.json
      - name: Build
        working-directory: app
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define-from-file=config/production.json
      - name: Package (Vercel Build Output API)
        run: >
          python3 tool/web/package_vercel.py --build app/build/web
          --output "$RUNNER_TEMP/vercel/.vercel/output" --supabase-url "$SUPABASE_URL"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a release workflow (cache poisoning); npx fetches the pinned CLI.
          package-manager-cache: false
      - name: Deploy to production
        # Uploads the prebuilt output as is; nothing is built on Vercel.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Team ar27111994s-projects, project maalik-e-makaan (public identifiers).
          VERCEL_ORG_ID: team_APuR5C9ajzlq0OLwjgkjl3hQ
          VERCEL_PROJECT_ID: prj_rFGxDOR4N5EldxCiaXIS4aEosTEM
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          cd "$RUNNER_TEMP/vercel"
          npx --yes vercel@65.8.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Smoke test
        run: tool/web/smoke_test.sh "$SITE_URL" "$ANDROID_PACKAGE" "$SUPABASE_URL"

  site:
    # The marketing site does not use Supabase, so it does not wait for it.
    name: Website (Vercel)
    if: ${{ !inputs.skip-site }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The roadmap page reads the roadmap's milestones and issues.
      issues: read
    environment:
      name: production
      url: https://maalik-e-makaan-site.vercel.app
    env:
      # The project's production address until a custom domain is attached
      # (docs/operations.md, Hosting). Canonical URLs, hreflang, the sitemap,
      # robots.txt and llms.txt are built for it.
      SITE_URL: https://maalik-e-makaan-site.vercel.app
      PUBLIC_APP_URL: ${{ vars.APP_URL }}
      # Team ar27111994s-projects, project maalik-e-makaan-site (public identifiers).
      VERCEL_ORG_ID: team_APuR5C9ajzlq0OLwjgkjl3hQ
      VERCEL_PROJECT_ID: prj_hGrXXKBhAGxmKrfdwjBegAbyd4E7
      VERCEL_TELEMETRY_DISABLED: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Deployment is configured
        # The token reaches only this step and the deploy, not the build's packages.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || {
            echo "::error::Secret VERCEL_TOKEN is not set (docs/operations.md, Deployment)"; exit 1; }
          [[ -n "$PUBLIC_APP_URL" ]] || {
            echo "::error::Repository variable APP_URL is not set (docs/operations.md, Deployment)"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a release workflow (cache poisoning); npx fetches the pinned CLI.
          package-manager-cache: false
      - name: Project settings, from the repository
        # What `vercel pull` would fetch, fixed here so the build does not depend
        # on the dashboard: the site lives in website/, whose vercel.json sets
        # the install and build commands, the output, trailing slashes and headers.
        run: |
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg project "$VERCEL_PROJECT_ID" \
            '{orgId: $org, projectId: $project, projectName: "maalik-e-makaan-site",
              settings: {framework: "astro", rootDirectory: "website", nodeVersion: "22.x"}}' \
            > .vercel/project.json
      - name: Pitch deck (PDF, with this release's version and date)
        # Chromium renders website/deck/ into public/; the build then copies it.
        # A tag from before the deck has no "deck" script and no link to the PDF.
        working-directory: website
        run: |
          if ! jq -e '.scripts.deck' package.json >/dev/null; then
            echo "::warning::This ref has no pitch deck (no \"deck\" script); the site is built without it"
            exit 0
          fi
          npm ci
          npx --no-install playwright install --with-deps chromium
          npm run deck
      - name: Roadmap, live from GitHub
        # The roadmap page shows the milestones and issues as they are now; if
        # GitHub cannot be read it keeps the copy in the repository and warns.
        # A tag from before the tool keeps the roadmap committed with it, if any.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f tool/github/fetch_roadmap.py ]]; then
            echo "::warning::This ref has no tool/github/fetch_roadmap.py; the site keeps the roadmap committed with it, if any"
            exit 0
          fi
          python3 tool/github/fetch_roadmap.py --from-github --repository "$GITHUB_REPOSITORY"
      - name: Build (Vercel Build Output API, with vercel.json's headers)
        # Runs website/'s `npm ci` and `npm run build` (the build checks twins and inline code).
        run: npx --yes vercel@65.8.0 build --prod
      - name: Every release file the site links to is attached
        # The download page links to the files that release.yml's artefacts and
        # ios jobs attach to the release. Release deploys the site only after
        # both; this stops any other run (by hand, or Site refresh while a
        # release is building or after a build failed) from publishing links
        # to files that are not there. The live site then stays as it was.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t links < <(grep -rhoE --include='*.html' \
            'https://github\.com/[^/"]+/[^/"]+/releases/download/[^/"]+/[^"#?<>[:space:]]+' \
            .vercel/output/static | sort -u)
          missing=0 release=""
          for link in "${links[@]}"; do
            IFS=/ read -r owner repository _ _ tag file <<<"${link#https://github.com/}"
            if [[ "$owner/$repository/$tag" != "$release" ]]; then
              release="$owner/$repository/$tag"
              names="$(gh api "repos/$owner/$repository/releases/tags/$tag" \
                --jq '.assets[].name')" || names=""
            fi
            if grep -qxF -- "$file" <<<"$names"; then
              echo "Attached: $link"
            else
              echo "::error::$file is not attached to release $tag ($link)"
              missing=$((missing + 1))
            fi
          done
          echo "${#links[@]} release file link(s) checked"
          if ((missing > 0)); then
            echo "::error::Release's artefacts or ios job has not attached them: wait for it, or re-run it if it failed"
            exit 1
          fi
      - name: Deploy to production
        # Uploads .vercel/output as is; nothing is built on Vercel.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65.8.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Smoke test
        run: tool/web/site_smoke_test.sh "$SITE_URL"
