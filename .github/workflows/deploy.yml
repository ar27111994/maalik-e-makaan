# Production deployment: the Supabase backend (migrations, then Edge Functions),
# then the Flutter web app on Vercel, and the website (website/) on Vercel, each
# followed by a smoke test. The Release workflow calls it twice for the tag it
# has just released: the backend and the web app at once, and the website once
# the release's builds and the web app's deploy have finished, so that the
# download page links to the files the builds attached and to a web app built
# for the addresses it names. It also runs by hand (Actions, Deploy, Run
# workflow), for the branch or tag chosen there; GitHub then runs the
# deploy.yml of that branch or tag, not this one. The "production" environment
# should require a reviewer (repository settings).
#
# When another workflow calls this one, these steps come from the caller's
# commit (main, for site-refresh.yml) but the files they build come from
# inputs.ref, which can be an older tag: a step that runs a script from the
# checkout must cope with a tag that predates the script.
#
# The addresses come from the ref too: the web app's origin (its APP_URL) and
# the site's are read from inputs.ref's contracts/origins.json (decision D-20),
# never written here or kept in a repository variable. A site refresh of an
# older tag therefore builds the addresses that tag was released with, and a
# move of either reaches production with the release that carries it. Before
# anything is deployed, the supabase job checks that Auth sends the e-mail links
# of the release's builds where they can be finished (tool/web/check_auth_urls.py,
# which the Release workflow also runs before its builds), and the web and site
# jobs that the addresses they send people to answer (tool/web/check_live.py);
# the web job also checks that the Edge Functions accept the web app's origin.
#
# It is called rather than started by the "release published" event: a
# release that release-please creates with the default GITHUB_TOKEN starts no
# other workflow, so the first release would not have deployed without a
# personal token (docs/operations.md, Releasing).
name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: The tag to deploy
        type: string
        required: true
      site-only:
        description: Deploy only the website (site-refresh.yml, for a fresh roadmap)
        type: boolean
        default: false
      skip-site:
        description: Deploy everything but the website (release.yml deploys it later)
        type: boolean
        default: false
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false
      VERCEL_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      site-only:
        description: Only the website (the backend and the web app stay as they are)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Equal to ci.yml's; make docs-check checks them.
  FLUTTER_VERSION: 3.47.9
  SUPABASE_CLI_VERSION: 2.122.1
  # The Vercel CLI that builds and deploys the web app and the website (npx runs it from npm).
  VERCEL_CLI_VERSION: 65.8.0

defaults:
  run:
    shell: bash

jobs:
  supabase:
    name: Supabase (migrations and functions)
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SUPABASE_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Deployment is configured
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF SUPABASE_URL; do
            [[ -n "${!name}" ]] || { echo "::error::$name is not set (docs/operations.md, Deployment)"; exit 1; }
          done
      - name: Auth accepts the e-mail links of the release's builds
        # Each build asks Auth to send its e-mail links to its own callback (the web app's
        # origin, an earlier address for builds from before a move, and the iOS forms of both),
        # and Auth sends a link only where its URL Configuration allows (docs/operations.md,
        # Domains). Read with the Management API before anything is deployed, by the script the
        # Release workflow also runs before its builds; it keeps only the Site URL and the
        # redirect URLs, since the rest of the answer can hold secrets. A token that may not read
        # Auth's settings only warns: check them by hand then.
        run: |
          if [[ ! -f tool/web/check_auth_urls.py ]]; then
            echo "::notice::This ref has no tool/web/check_auth_urls.py; Auth's redirect URLs are not checked"
            exit 0
          fi
          python3 tool/web/check_auth_urls.py --project-ref "$PROJECT_REF"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Pending migrations
        run: supabase db push --linked --dry-run
      - name: Apply migrations
        run: supabase db push --linked
      - name: Deploy Edge Functions
        # verify_jwt per function comes from supabase/config.toml.
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
      - name: Smoke test
        run: |
          status="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' \
            --retry 5 --retry-delay 5 --retry-all-errors "$SUPABASE_URL/functions/v1/health")"
          cat "$RUNNER_TEMP/health.json"; echo
          [[ "$status" == "200" ]] || { echo "::error::health answered $status"; exit 1; }

  web:
    name: Web app (Vercel)
    needs: supabase
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.origins.outputs.app }}
    env:
      ANDROID_PACKAGE: io.github.ar27111994.maalik_e_makaan
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Deployment is configured
        # The token reaches only this step and the deploy, not the build's packages.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || {
            echo "::error::Secret VERCEL_TOKEN is not set (docs/operations.md, Deployment)"; exit 1; }
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Repository variable $name is not set"; exit 1; }
          done
      - name: The web app's origins, from the ref
        # contracts/origins.json (decision D-20): the origin is the build's APP_URL, and each
        # earlier address sends people on to it (tool/web/package_vercel.py). Only a caller that
        # passes an older ref reaches the refusal below; a run by hand on an older tag runs that
        # tag's own deploy.yml instead (docs/operations.md, Rollback and restore).
        id: origins
        run: |
          file=contracts/origins.json
          if [[ ! -f "$file" ]]; then
            echo "::error::This ref predates $file, so this workflow cannot build its web app (D-20); deploy a later tag (docs/operations.md, Rollback and restore)"
            exit 1
          fi
          app="$(jq -er '.app.origin' "$file")"
          legacy="$(jq -ec '.app.legacy // []' "$file")"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          echo "The web app's origin: $app; earlier addresses: $legacy"
      - name: The web app's origin answers
        # Over HTTPS, with its App Links file, before anything is built: the deploy makes each
        # earlier address send people on to it, so an origin whose DNS or certificate is not in
        # place would take the old address and the new one offline together (docs/operations.md,
        # Domains, steps 2 and 3).
        run: python3 tool/web/check_live.py app
      - name: The Edge Functions accept the origin
        # Browsers call the functions from the web app's origin, and the functions answer only
        # the origins in the ALLOWED_ORIGINS secret (by default APP_URL's). Checked before the
        # build, so a missing origin fails the deploy rather than every call in the new app
        # (docs/operations.md, Domains). Only the origin: since step 12 no page of an earlier
        # address runs the app, so none of them calls the functions.
        env:
          APP: ${{ steps.origins.outputs.app }}
        run: |
          preflight() {
            curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors \
              -X OPTIONS -H "Origin: $1" -H 'Access-Control-Request-Method: GET' \
              "$SUPABASE_URL/functions/v1/health"
          }
          status="$(preflight "$APP")"
          if [[ "$status" != 204 ]]; then
            echo "::error::The Edge Functions refuse $APP (preflight answered $status): add it to the ALLOWED_ORIGINS secret (docs/operations.md, Domains)"
            exit 1
          fi
          echo "$APP: preflight 204"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Production configuration
        # Public values only, as in release.yml (the publishable key is meant for clients).
        env:
          APP_URL: ${{ steps.origins.outputs.app }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" --arg app "$APP_URL" \
            '{ENVIRONMENT: "production", SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, APP_URL: $app}' \
            > app/config/production.json
      - name: Build
        working-directory: app
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define-from-file=config/production.json
      - name: Package (Vercel Build Output API)
        # With the page the earlier addresses answer with, which clears what the app kept in
        # the browser there and goes to the origin, from the ref's contracts/origins.json.
        run: >
          python3 tool/web/package_vercel.py --build app/build/web
          --output "$RUNNER_TEMP/vercel/.vercel/output" --supabase-url "$SUPABASE_URL"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a release workflow (cache poisoning); npx fetches the pinned CLI.
          package-manager-cache: false
      - name: Deploy to production
        # Uploads the prebuilt output as is; nothing is built on Vercel.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Team ar27111994s-projects, project maalik-e-makaan (public identifiers).
          VERCEL_ORG_ID: team_APuR5C9ajzlq0OLwjgkjl3hQ
          VERCEL_PROJECT_ID: prj_rFGxDOR4N5EldxCiaXIS4aEosTEM
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          cd "$RUNNER_TEMP/vercel"
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Smoke test
        # The origin, which never tells a browser to clear its storage. Then each earlier
        # address: every page answers with the one that clears that address's storage and goes
        # to the origin (--page), the e-mail links' callback included (--moved, which the check
        # also waits for, since the deployment before kept it), but it keeps answering the
        # Android App Links file (checked by Android without following a redirect), and clears
        # nothing there.
        env:
          APP: ${{ steps.origins.outputs.app }}
          LEGACY: ${{ steps.origins.outputs.legacy }}
        run: |
          tool/web/smoke_test.sh "$APP" "$ANDROID_PACKAGE" "$SUPABASE_URL"
          while read -r origin; do
            tool/web/redirect_smoke_test.sh "$origin" "$APP" --page \
              --moved '/auth/callback?code=smoke-test' --keep /.well-known/assetlinks.json
          done < <(jq -r '.[]' <<<"$LEGACY")

  site:
    # The marketing site does not use Supabase, so it does not wait for it.
    name: Website (Vercel)
    if: ${{ !inputs.skip-site }}
    runs-on: ubuntu-24.04
    # The address check alone may take 13 minutes when every address answers only on its last
    # try (tool/web/test_check_time.py), and the build, the deploy and the smoke test follow.
    timeout-minutes: 30
    permissions:
      contents: read # check out the tag and read its release's files
      issues: read # the roadmap page reads the roadmap's milestones and issues
    environment:
      name: production
      url: ${{ steps.built.outputs.site }}
    env:
      # No SITE_URL or PUBLIC_APP_URL: the build takes the site's and the web app's origins
      # from the ref (contracts/origins.json, decision D-20; an older tag, from its own
      # website/src/config/urls.ts), so a site refresh builds the addresses its tag names.
      # Team ar27111994s-projects, project maalik-e-makaan-site (public identifiers).
      VERCEL_ORG_ID: team_APuR5C9ajzlq0OLwjgkjl3hQ
      VERCEL_PROJECT_ID: prj_hGrXXKBhAGxmKrfdwjBegAbyd4E7
      VERCEL_TELEMETRY_DISABLED: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Deployment is configured
        # The token reaches only this step and the deploy, not the build's packages.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || {
            echo "::error::Secret VERCEL_TOKEN is not set (docs/operations.md, Deployment)"; exit 1; }
      - name: The addresses answer, and the web app is the one built for them
        # Before anything is built: the site's origin answers over HTTPS and www redirects to
        # it, and the web app the site links to answers at its origin and is the deployment
        # built for it (its earlier address sends people on to it, which only the web app's
        # deploy of the release that carries a move does). Sooner, the site's old address would
        # redirect to a host that does not answer, or the site would send people to a web app
        # whose e-mail links name another address (docs/operations.md, Domains). A ref from
        # before contracts/origins.json has none of this to check.
        run: |
          if [[ ! -f contracts/origins.json || ! -f tool/web/check_live.py ]]; then
            echo "::notice::This ref predates contracts/origins.json; its addresses are not checked"
            exit 0
          fi
          python3 tool/web/check_live.py site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a release workflow (cache poisoning); npx fetches the pinned CLI.
          package-manager-cache: false
      - name: Project settings, from the repository
        # What `vercel pull` would fetch, fixed here so the build does not depend
        # on the dashboard: the site lives in website/, whose vercel.json sets
        # the install and build commands, the output, trailing slashes and headers.
        run: |
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg project "$VERCEL_PROJECT_ID" \
            '{orgId: $org, projectId: $project, projectName: "maalik-e-makaan-site",
              settings: {framework: "astro", rootDirectory: "website", nodeVersion: "22.x"}}' \
            > .vercel/project.json
      - name: Pitch deck (PDF, with this release's version and date)
        # Chromium renders website/deck/ into public/; the build then copies it.
        # A tag from before the deck has no "deck" script and no link to the PDF.
        working-directory: website
        run: |
          if ! jq -e '.scripts.deck' package.json >/dev/null; then
            echo "::warning::This ref has no pitch deck (no \"deck\" script); the site is built without it"
            exit 0
          fi
          npm ci
          npx --no-install playwright install --with-deps chromium
          npm run deck
      - name: Roadmap, live from GitHub
        # The roadmap page shows the milestones and issues as they are now; if
        # GitHub cannot be read it keeps the copy in the repository and warns.
        # A tag from before the tool keeps the roadmap committed with it, if any.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f tool/github/fetch_roadmap.py ]]; then
            echo "::warning::This ref has no tool/github/fetch_roadmap.py; the site keeps the roadmap committed with it, if any"
            exit 0
          fi
          python3 tool/github/fetch_roadmap.py --from-github --repository "$GITHUB_REPOSITORY"
      - name: Release files, as attached now
        # The download page links only to the files listed here. Release's
        # artefacts and ios jobs attach them minutes after the tag, and a build
        # that fails before its upload attaches nothing until it is re-run (one
        # cut off during its upload can leave part of its files), so the page lists
        # what is there and the deploy never waits on a missing file. A tag
        # from before the list links to no release file.
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: website/src/data/release-assets.json
        run: |
          if [[ ! -f "$LIST" ]]; then
            echo "::notice::This ref has no $LIST; its download page links to no release file"
            exit 0
          fi
          tag="v$(jq -er '."."' .release-please-manifest.json)"
          files="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '[.assets[].name]')" || {
            echo "::error::Cannot read release $tag's files; if it is not published yet, run this again once it is"
            exit 1
          }
          jq -n --arg tag "$tag" --argjson files "$files" '{tag: $tag, files: $files}' > "$LIST"
          echo "Release $tag has $(jq length <<<"$files") file(s) attached:"
          jq -r '.[]' <<<"$files"
      - name: Build (Vercel Build Output API, with vercel.json's headers and redirects)
        # Runs website/'s `npm ci` and `npm run build` (the build checks twins and inline code).
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod
      - name: The origin the site was built for
        # Every page carries it (canonical and hreflang links, the sitemap, robots.txt), so it
        # is read back from the build, as the e2e suite does, and must be the ref's.
        id: built
        run: |
          site="$(grep -oE '<loc>https://[^/<]+' .vercel/output/static/sitemap-index.xml \
            | head -n 1 | sed 's/^<loc>//')"
          [[ -n "$site" ]] || { echo "::error::sitemap-index.xml names no https origin"; exit 1; }
          if [[ -f contracts/origins.json ]]; then
            expected="$(jq -er .site.origin contracts/origins.json)"
            [[ "$site" == "$expected" ]] || {
              echo "::error::The site was built for $site, but contracts/origins.json names $expected"; exit 1; }
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "Built for $site"
      - name: Every release file the site links to is attached
        # A safety net: the download page links only to the files listed above,
        # so this fails only if a page links to a release file some other way,
        # or one was removed from the release since. The live site then stays
        # as it was.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t links < <(grep -rhoE --include='*.html' \
            'https://github\.com/[^/"]+/[^/"]+/releases/download/[^/"]+/[^"#?<>[:space:]]+' \
            .vercel/output/static | sort -u)
          missing=0 release=""
          for link in "${links[@]}"; do
            IFS=/ read -r owner repository _ _ tag file <<<"${link#https://github.com/}"
            if [[ "$owner/$repository/$tag" != "$release" ]]; then
              release="$owner/$repository/$tag"
              names="$(gh api "repos/$owner/$repository/releases/tags/$tag" \
                --jq '.assets[].name')" || names=""
            fi
            if grep -qxF -- "$file" <<<"$names"; then
              echo "Attached: $link"
            else
              echo "::error::$file is not attached to release $tag ($link)"
              missing=$((missing + 1))
            fi
          done
          echo "${#links[@]} release file link(s) checked"
          if ((missing > 0)); then
            echo "::error::Link to release files only through releaseAssets() (website/src/lib/release.ts), which lists the attached ones"
            exit 1
          fi
      - name: Deploy to production
        # Uploads .vercel/output as is; nothing is built on Vercel.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Smoke test
        # The origin, then each earlier address and alias (www), which must redirect to it with
        # the path and query. A ref from before contracts/origins.json has neither.
        env:
          SITE: ${{ steps.built.outputs.site }}
        run: |
          tool/web/site_smoke_test.sh "$SITE"
          if [[ ! -f contracts/origins.json || ! -f tool/web/redirect_smoke_test.sh ]]; then
            echo "::notice::This ref predates contracts/origins.json; it has no earlier address to check"
            exit 0
          fi
          while read -r from; do
            tool/web/redirect_smoke_test.sh "$from" "$SITE"
          done < <(jq -r '.site.legacy[]?, .site.aliases[]?' contracts/origins.json)
