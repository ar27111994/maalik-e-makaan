# Pull requests are squash-merged, so the title becomes the commit message that
# release-please reads. It must follow the same conventions as every commit.
name: Pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read # read the title of the pull request

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # docs:commit-types-and-scopes from commitlint.config.mjs; generated by make docs, do not edit
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            app
            core
            ui
            db
            functions
            web
            ci
            deps
            deps-dev
            docs
            formal
            planning
            release
            repo
            security
            test
          # /docs:commit-types-and-scopes
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >
            The subject "{subject}" must start with a lower-case letter, like a commit message.
      # GitHub adds " (#<number>)" to the title when it squash-merges, and commitlint then
      # checks that header on main against its 100-character limit (header-max-length).
      # Only lengths are printed: the title is the author's text, never echoed into a
      # workflow command.
      - name: Title fits the squash commit's 100-character header
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          # commitlint's header-max-length; tool/docs/sync_facts.py checks they agree.
          MAX_HEADER: "100"
        run: |
          header="${TITLE} (#${NUMBER})"
          length=${#header}
          if [ "$length" -gt "$MAX_HEADER" ]; then
            echo "::error title=Title too long::With (#${NUMBER}) added the squash commit's header is ${length} characters; commitlint allows ${MAX_HEADER}. Shorten the title by $((length - MAX_HEADER))."
            exit 1
          fi
          echo "The squash commit's header will be ${length} characters (limit ${MAX_HEADER})."
