name: Feature request
description: Suggest something that would help landlords or tenants.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or slow today, and for whom (owner, manager, tenant)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you manage today
      description: Registers, WhatsApp, spreadsheets, another app…
