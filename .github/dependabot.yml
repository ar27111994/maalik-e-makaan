# Weekly dependency updates, grouped so each ecosystem opens at most one pull
# request for minor and patch releases. Majors arrive one by one. Commit
# messages follow commitlint (chore(deps): …, chore(deps-dev): …, ci(deps): …).
# Deno imports (supabase/functions) are not supported by Dependabot; the
# weekly Security run lists them instead.
#
# Every package.json names its npm in `packageManager` (the npm that Node in
# .nvmrc bundles, which CI runs). Without it Dependabot writes lockfiles with
# its own newer npm, and `npm ci` on the npm in CI rejects them. The cost: npm
# 10 has no --min-release-age (npm 11.10 and later), so `cooldown` holds back
# only the package being bumped, not transitive packages that npm re-resolves.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  # The website (Astro). Its README lists the overrides in package.json and why.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: chore
      include: scope
    groups:
      website:
        update-types: [minor, patch]
    # Exceptions to "majors one by one":
    # - @types/node follows the Node major in .nvmrc, and moves with it by hand.
    # - TypeScript 7 cannot run `astro check` or typed lint until
    #   @astrojs/check and typescript-eslint support it; upgrade by hand then.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # The browser UAT (app/uat/, docs/uat.md): Playwright only.
  - package-ecosystem: npm
    directory: /app/uat
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: chore
      include: scope
    groups:
      uat:
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  # One pub workspace (pubspec.yaml at the root lists app/ and packages/), one
  # lockfile. Dependabot reads every member from the root and refuses to run in
  # a member directory ("Only apply dependency_services to the root of the
  # workspace").
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: chore
      include: scope
    groups:
      dart:
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: chore
      include: scope
    groups:
      android:
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /tool
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
