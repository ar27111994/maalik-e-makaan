# Git hooks (https://lefthook.dev). Installed by `npm install` via the
# "prepare" script. Every check here also runs in CI, so hooks are a fast
# local feedback loop rather than the only gate. Python tools come from .venv
# (`make bootstrap`).
pre-commit:
  parallel: true
  commands:
    unicode-guard:
      run: python3 tool/check_unicode.py {staged_files}
    urdu-words:
      run: python3 tool/check_urdu_words.py {staged_files}
    editorconfig:
      run: PATH="$PWD/.venv/bin:$PATH" ec {staged_files}
    dart-format:
      glob: "*.dart"
      exclude:
        - "*.g.dart"
        - "**/l10n/generated/**"
      run: dart format --output=none --set-exit-if-changed {staged_files}
    prettier:
      glob: "*.{md,yml,yaml,json,jsonc}"
      run: npx --no-install prettier --check {staged_files}
    deno-fmt:
      glob: "supabase/functions/**/*.ts"
      run: deno fmt --check {staged_files}
    python:
      glob: "*.py"
      run: >-
        PATH="$PWD/.venv/bin:$PATH" black --check --quiet {staged_files}
        && PATH="$PWD/.venv/bin:$PATH" ruff check {staged_files}
    shell:
      glob: "*.sh"
      run: >-
        PATH="$PWD/.venv/bin:$PATH" shfmt --diff {staged_files}
        && PATH="$PWD/.venv/bin:$PATH" shellcheck {staged_files}
    workflows:
      glob: ".github/workflows/*.yml"
      run: PATH="$PWD/.venv/bin:$PATH" actionlint {staged_files}
    design-lint:
      glob: "{packages/mm_ui,app}/lib/**/*.dart"
      run: python3 tool/design/lint_hardcoded.py {staged_files}
    migrations:
      glob: "supabase/migrations/*.sql"
      run: PATH="$PWD/.venv/bin:$PATH" tool/db/lint_migrations.sh

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
