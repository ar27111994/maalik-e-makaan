name: maalik_e_makaan
description: "Maalik-e-Makaan: tenant and property management for Pakistani landlords."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.3
  http: ^1.5.0
  intl: any
  mm_core:
    path: ../packages/mm_core
  mm_ui:
    path: ../packages/mm_ui
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
