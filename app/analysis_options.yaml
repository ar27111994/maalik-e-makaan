include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - linux/**

linter:
  rules:
    # Application code is not a published library; public API docs are
    # required in packages/ instead.
    public_member_api_docs: false
