\* attach_vs_rmnolock: S1 with the probe flow but no row lock before the probe
\* (no Storage API version does this): nothing holds the file between the
\* probe and the superuser's DELETE, so an insert can commit in between. The
\* DELETE's own row lock waits for the insert, and the trigger keeps the file.
\* EXPECT: pass
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "attach_vs_rmnolock"
  MUTANT = "none"
  UPLOAD_BOUND = TRUE
  SWEEP = FALSE
  FAILURES = 0
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NoLeakedLocks
  NoDanglingDocument
  NoDocForQueuedFile
  NoLiveFileDeleted
  NoOrphanDocument
  DeletedFoldersQueued
  NoLiveFolderQueued
  NoWaitCycle
CHECK_DEADLOCK TRUE
