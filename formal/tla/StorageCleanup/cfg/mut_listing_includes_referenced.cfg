\* mut_listing_includes_referenced: Mutant: admin_storage_cleanup_objects
\* lists referenced objects.
\* With the trigger on storage.objects removed too: otherwise the trigger
\* keeps the file (mut_listing_includes_referenced_trigger shows that run passing).
\* EXPECT: violates NoLiveFileDeleted
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "listing_guard"
  MUTANT = "listing_includes_referenced+no_trigger"
  UPLOAD_BOUND = TRUE
  SWEEP = FALSE
  FAILURES = 0
SPECIFICATION Spec
INVARIANTS
  NoLiveFileDeleted
CHECK_DEADLOCK TRUE
