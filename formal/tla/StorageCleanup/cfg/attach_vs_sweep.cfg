\* attach_vs_sweep: FINDING S2, fixed by 20261105170557: a document INSERT
\* for a file older than a day races the daily sweep and the cleaner. The
\* sweep cannot take the gate while the insert holds it (the files wait a
\* day) and re-reads under it; the insert waits for the gate and sees the
\* queued file.
\* EXPECT: pass
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "attach_vs_sweep"
  MUTANT = "none"
  UPLOAD_BOUND = TRUE
  SWEEP = TRUE
  FAILURES = 1
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NoLeakedLocks
  NoDanglingDocument
  NoDocForQueuedFile
  NoLiveFileDeleted
  NoOrphanDocument
  DeletedFoldersQueued
  NoLiveFolderQueued
  NoWaitCycle
CHECK_DEADLOCK TRUE
