\* mut_no_delete_trigger_nolock: Mutant: no trigger on storage.objects. The
\* row locks alone protect only deletes that hold the row from the policy's
\* check to the DELETE; here the insert commits between the probe and the
\* superuser's DELETE, which row security does not see (second review, issue 1).
\* EXPECT: violates NoDanglingDocument
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "attach_vs_rmnolock"
  MUTANT = "no_delete_trigger"
  UPLOAD_BOUND = TRUE
  SWEEP = FALSE
  FAILURES = 0
SPECIFICATION Spec
INVARIANTS
  NoDanglingDocument
CHECK_DEADLOCK TRUE
