\* mut_live_orphan_no_sweep: Without the daily sweep, an orphaned document
\* row stays for ever.
\* EXPECT: temporal EventuallyNoOrphanDocument
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "entity_race"
  MUTANT = "no_entity_lock"
  UPLOAD_BOUND = TRUE
  SWEEP = FALSE
  FAILURES = 0
SPECIFICATION LiveSpec
INVARIANTS
  TypeOK
  NoLeakedLocks
PROPERTIES
  EventuallyNoOrphanDocument
CHECK_DEADLOCK TRUE
