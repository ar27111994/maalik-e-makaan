\* mut_no_pending_check: Mutant: no document_file_pending_deletion: a queued
\* file is attached again and the cleaner deletes it.
\* With the trigger on storage.objects removed too: otherwise the trigger
\* keeps the file (mut_no_pending_check_trigger shows that run passing).
\* EXPECT: violates NoDanglingDocument
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "reattach"
  MUTANT = "no_pending_check+no_trigger"
  UPLOAD_BOUND = TRUE
  SWEEP = FALSE
  FAILURES = 0
SPECIFICATION Spec
INVARIANTS
  NoDanglingDocument
CHECK_DEADLOCK TRUE
