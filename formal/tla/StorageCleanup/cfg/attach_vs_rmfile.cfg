\* attach_vs_rmfile: FINDING S1, fixed by 20261105170557: a document INSERT
\* races the user's Storage delete of the same file as the Storage API made it
\* up to v1.80 for a batch (DELETE as the user). The insert's check waits for
\* the row (key share) and re-reads (document_file_missing), or the policy
\* finds the row held and refuses the object.
\* EXPECT: pass
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "attach_vs_rmfile"
  MUTANT = "none"
  UPLOAD_BOUND = TRUE
  SWEEP = FALSE
  FAILURES = 0
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NoLeakedLocks
  NoDanglingDocument
  NoDocForQueuedFile
  NoLiveFileDeleted
  NoOrphanDocument
  DeletedFoldersQueued
  NoLiveFolderQueued
  NoWaitCycle
CHECK_DEADLOCK TRUE
