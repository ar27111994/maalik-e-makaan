\* mut_live_no_sweep: Without UPLOAD_BOUND and without the daily sweep, a
\* late upload stays for ever.
\* EXPECT: temporal EventuallyClean
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "late_upload"
  MUTANT = "none"
  UPLOAD_BOUND = FALSE
  SWEEP = FALSE
  FAILURES = 0
SPECIFICATION LiveSpec
INVARIANTS
  TypeOK
  NoLeakedLocks
PROPERTIES
  EventuallyClean
CHECK_DEADLOCK TRUE
