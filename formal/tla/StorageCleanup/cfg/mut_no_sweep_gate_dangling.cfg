\* mut_no_sweep_gate_dangling: Mutant: as mut_no_sweep_gate; the
\* consequence: the cleaner lists the file before the INSERT commits and
\* deletes the file the new row references.
\* With the trigger on storage.objects removed too: otherwise the trigger
\* keeps the file (mut_no_sweep_gate_dangling_trigger shows that run passing).
\* EXPECT: violates NoDanglingDocument
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "attach_vs_sweep"
  MUTANT = "no_sweep_gate+no_trigger"
  UPLOAD_BOUND = TRUE
  SWEEP = TRUE
  FAILURES = 0
SPECIFICATION Spec
INVARIANTS
  NoDanglingDocument
  NoLiveFileDeleted
CHECK_DEADLOCK TRUE
