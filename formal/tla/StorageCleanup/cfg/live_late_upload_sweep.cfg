\* live_late_upload_sweep: Liveness without UPLOAD_BOUND: the daily sweep re-
\* queues the folder and the cleaner empties it.
\* EXPECT: pass
\* MODE: ci
\* SPEC: StorageCleanup
CONSTANTS
  SCENARIO = "late_upload"
  MUTANT = "none"
  UPLOAD_BOUND = FALSE
  SWEEP = TRUE
  FAILURES = 2
SPECIFICATION LiveSpec
INVARIANTS
  TypeOK
  NoLeakedLocks
PROPERTIES
  EventuallyClean
CHECK_DEADLOCK TRUE
