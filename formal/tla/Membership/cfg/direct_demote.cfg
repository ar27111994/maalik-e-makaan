  SCENARIO = "direct_demote"
  MUTANT = "none"
  MAX_POSTS = 1
  CAN_ABORT = TRUE
  GOTRUE_ORDER = "portfolios_first"
  WAKE_FIRST = FALSE
SPECIFICATION LiveSpec
