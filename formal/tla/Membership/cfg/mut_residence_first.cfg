\* mut_residence_first: Mutant, expected to pass: the residence row cleared at
\* the start of the deletion instead of last. A person's residence UPDATE
\* holds that row only, so taking it last is the global order's convention,
\* not a lock-order necessity.
\* EXPECT: pass
\* MODE: all
CONSTANTS
  SCENARIO = "residence"
  MUTANT = "residence_first"
  MAX_POSTS = 2
  CAN_ABORT = TRUE
  GOTRUE_ORDER = "portfolios_first"
  WAKE_FIRST = FALSE
SPECIFICATION LiveSpec
INVARIANTS
  TypeOK
  RefIntegrity
  AtLeastOneOwner
  NoMemberless
  NoActivityAfterDeletion
  IdsNeverReused
  NoWaitCycle
  DeletionNotDefeated
  AuthorisedAtCommit
  DeletesOnlySoleOwned
  InviterAuthority
  CompletedDeletionsClean
  CaretakerIsManager
  CaretakerAuthorisedAtCommit
  AnswerAuthorisedAtCommit
  FirstAnswerKept
  ResidenceGoneAfterDeletion
PROPERTIES
  AllFinish
CHECK_DEADLOCK TRUE
