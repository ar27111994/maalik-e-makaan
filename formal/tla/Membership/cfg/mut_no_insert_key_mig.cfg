\* mut_no_insert_key_mig: Passes on purpose. Without the key in the WITH
\* CHECK, a one-row insert is safe in migration order (the portfolio key is
\* checked first), which is why only a restored database or a statement
\* spanning portfolios shows the cycle.
\* EXPECT: pass
\* MODE: ci
CONSTANTS
  SCENARIO = "insert_mig"
  MUTANT = "no_insert_key"
  MAX_POSTS = 2
  CAN_ABORT = TRUE
  GOTRUE_ORDER = "portfolios_first"
  WAKE_FIRST = FALSE
SPECIFICATION LiveSpec
INVARIANTS
  TypeOK
  RefIntegrity
  AtLeastOneOwner
  NoMemberless
  NoActivityAfterDeletion
  IdsNeverReused
  NoWaitCycle
  DeletionNotDefeated
  AuthorisedAtCommit
  DeletesOnlySoleOwned
  InviterAuthority
  CompletedDeletionsClean
PROPERTIES
  AllFinish
CHECK_DEADLOCK TRUE
