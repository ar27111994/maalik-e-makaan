\* mut_end_lease_keeps_fees: Mutant (finding F3, the code before ledger findings): end_lease voids a later month's rent but keeps its late fee.
\* EXPECT: violates NoFeeOnVoidedRent
\* MODE: ci
CONSTANTS
  SCENARIO = "end_lease"
  MUTANT = "end_lease_keeps_fees"
  MAX_DAY = 3
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NotOverpaid
  NoLeakedLocks
  AtMostOneFee
  FeeWithinCap
  FeeFitsCharge
  FeeOnlyWhenOverdue
  NoFeeWhenPaidInGrace
  IdempotentRerun
  FeeNotAboveFormula
  FeeOnlyGrows
  VoidedFeeStaysVoid
  NoFeeOnVoidedRent
  FeeOnlyOnActiveLease
  FeeUsesPolicyInForce
  NoWaitCycle
CHECK_DEADLOCK TRUE
