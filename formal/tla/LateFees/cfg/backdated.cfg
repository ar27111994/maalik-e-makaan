\* backdated: Finding F1: a rent paid within grace but recorded after the job posted its fee.
\* EXPECT: violates NoFeeWhenPaidInGrace
\* MODE: ci
CONSTANTS
  SCENARIO = "backdated"
  MUTANT = "none"
  FIX = "none"
  MAX_DAY = 3
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NotOverpaid
  NoLeakedLocks
  AtMostOneFee
  FeeWithinCap
  FeeFitsCharge
  FeeOnlyWhenOverdue
  NoFeeWhenPaidInGrace
  IdempotentRerun
  FeeNotAboveFormula
  FeeOnlyGrows
  VoidedFeeStaysVoid
  NoFeeOnVoidedRent
  FeeOnlyOnActiveLease
  FeeUsesPolicyInForce
  NoWaitCycle
CHECK_DEADLOCK TRUE
