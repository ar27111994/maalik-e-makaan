\* edit_pay: Finding F2: a client's multi-row UPDATE of charges (fee first) while a payment allocates.
\* EXPECT: violates NoWaitCycle
\* MODE: ci
CONSTANTS
  SCENARIO = "edit_pay"
  MUTANT = "none"
  FIX = "none"
  MAX_DAY = 2
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NotOverpaid
  NoLeakedLocks
  AtMostOneFee
  FeeWithinCap
  FeeFitsCharge
  FeeOnlyWhenOverdue
  NoFeeWhenPaidInGrace
  IdempotentRerun
  FeeNotAboveFormula
  FeeOnlyGrows
  VoidedFeeStaysVoid
  NoFeeOnVoidedRent
  FeeOnlyOnActiveLease
  FeeUsesPolicyInForce
  NoWaitCycle
CHECK_DEADLOCK TRUE
