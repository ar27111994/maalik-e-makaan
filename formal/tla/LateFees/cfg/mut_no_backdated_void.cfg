\* mut_no_backdated_void: Mutant (finding F1, the code before ledger findings): a rent paid within grace but recorded after the job posted its fee keeps the fee.
\* EXPECT: violates NoFeeWhenPaidInGrace
\* MODE: ci
CONSTANTS
  SCENARIO = "backdated"
  MUTANT = "no_backdated_void"
  MAX_DAY = 3
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NotOverpaid
  NoLeakedLocks
  AtMostOneFee
  FeeWithinCap
  FeeFitsCharge
  FeeOnlyWhenOverdue
  NoFeeWhenPaidInGrace
  IdempotentRerun
  FeeNotAboveFormula
  FeeOnlyGrows
  VoidedFeeStaysVoid
  NoFeeOnVoidedRent
  FeeOnlyOnActiveLease
  FeeUsesPolicyInForce
  NoWaitCycle
CHECK_DEADLOCK TRUE
