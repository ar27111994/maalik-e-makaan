\* mut_no_advisory_lock: Redundant on purpose: without the coordinator lock two runs overlap; the lease lock and the upsert keep every property.
\* EXPECT: pass
\* MODE: all
CONSTANTS
  SCENARIO = "rerun"
  MUTANT = "no_advisory_lock"
  FIX = "none"
  MAX_DAY = 3
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NotOverpaid
  NoLeakedLocks
  AtMostOneFee
  FeeWithinCap
  FeeFitsCharge
  FeeOnlyWhenOverdue
  NoFeeWhenPaidInGrace
  IdempotentRerun
  FeeNotAboveFormula
  FeeOnlyGrows
  VoidedFeeStaysVoid
  NoFeeOnVoidedRent
  FeeOnlyOnActiveLease
  FeeUsesPolicyInForce
  NoWaitCycle
CHECK_DEADLOCK TRUE
