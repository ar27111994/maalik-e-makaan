\* part_paid: A part payment on one lease and a full one on the other while the job runs.
\* EXPECT: pass
\* MODE: all
CONSTANTS
  SCENARIO = "part_paid"
  MUTANT = "none"
  MAX_DAY = 3
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NotOverpaid
  NoLeakedLocks
  AtMostOneFee
  FeeWithinCap
  FeeFitsCharge
  FeeOnlyWhenOverdue
  NoFeeWhenPaidInGrace
  IdempotentRerun
  FeeNotAboveFormula
  FeeOnlyGrows
  VoidedFeeStaysVoid
  NoFeeOnVoidedRent
  FeeOnlyOnActiveLease
  FeeUsesPolicyInForce
  NoWaitCycle
CHECK_DEADLOCK TRUE
