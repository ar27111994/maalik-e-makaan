\* backdated_fee: Today's code: a payment dated within grace, recorded after the fee was posted, with the fee chosen first: the fee is paid, the rent settled, then the fee voided and its money released (F1 fixed).
\* EXPECT: pass
\* MODE: ci
CONSTANTS
  SCENARIO = "backdated_fee"
  MUTANT = "none"
  MAX_DAY = 3
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NotOverpaid
  NoLeakedLocks
  AtMostOneFee
  FeeWithinCap
  FeeFitsCharge
  FeeOnlyWhenOverdue
  NoFeeWhenPaidInGrace
  IdempotentRerun
  FeeNotAboveFormula
  FeeOnlyGrows
  VoidedFeeStaysVoid
  NoFeeOnVoidedRent
  FeeOnlyOnActiveLease
  FeeUsesPolicyInForce
  NoWaitCycle
CHECK_DEADLOCK TRUE
