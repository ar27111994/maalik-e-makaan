\* Expected result: PASS.
\* Mode: ci
\* THE CODE.  As Invitations_gotrue_direct.cfg (direct deletion of o1's auth
\* user, without the portfolio lock), racing a demotion of o1, a re-invite and
\* two accepts: every safety invariant holds, NoPendingInvitationFromNonOwner
\* included (F4 fixed); in particular no invitation of the deleted inviter is
\* ever accepted.  Only the error property fails on this path (F3).
CONSTANTS
  Procs = {"GO", "AU1", "AU2", "C1", "MD"}
  InitInv = 1
  MaxInv = 2
  MaxClock = 0
  TTL = 1
  MaxEnvAborts = 1
  SoleOwner = FALSE
  PCreatedBy = "o2"
  MUTANT = "none"
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  AcceptedAtMostOnce
  AcceptedOnlyByInvitee
  OnlyInviteesJoin
  NeverAcceptedAfterRevoke
  NeverAcceptedAfterExpiry
  RoleWithinInviterAuthority
  InviterLossVoidsInvitations
  NoPendingInvitationFromNonOwner
  RevokedResponseIsFinal
  AtMostOnePendingInvitation
  AtMostOneLiveInvitation
  NoMembershipForDeletedAccount
  DeletedPortfolioIsEmpty
  AcceptNeverChangesRole
  GrantedRoleIsInvitationRole
  OwnersNotifiedOncePerAcceptance
