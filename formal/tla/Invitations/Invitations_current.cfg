\* Expected result: PASS.
\* Mode: ci
\* TODAY'S CODE.  The old deadlock scenario (accept_invitation vs
\* delete_portfolio, plus a re-invite and a revoke), now with the portfolio key
\* that accept_invitation takes before the invitation row: every safety
\* invariant holds and no RPC fails with an unexpected error.  (This
\* configuration used to expect AcceptNeverFailsUnexpectedly violated.)
CONSTANTS
  Procs = {"C1", "R1", "D1", "AU1", "AU2"}
  InitInv = 1
  MaxInv = 2
  MaxClock = 1
  TTL = 1
  MaxEnvAborts = 1
  SoleOwner = FALSE
  PCreatedBy = "o2"
  FIX_CREATE_SERIALISE = FALSE
  FIX_RESPONSE_ROLE = FALSE
  FIX_NULL_INVITER = FALSE
  MUTANT = "none"
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  AcceptedAtMostOnce
  AcceptedOnlyByInvitee
  OnlyInviteesJoin
  NeverAcceptedAfterRevoke
  NeverAcceptedAfterExpiry
  RoleWithinInviterAuthority
  InviterLossVoidsInvitations
  NoPendingInvitationFromNonOwner
  RevokedResponseIsFinal
  AtMostOnePendingInvitation
  AtMostOneLiveInvitation
  NoMembershipForDeletedAccount
  DeletedPortfolioIsEmpty
  AcceptNeverChangesRole
  GrantedRoleIsInvitationRole
  OwnersNotifiedOncePerAcceptance
  AcceptNeverFailsUnexpectedly
  NoRpcFailsUnexpectedly
