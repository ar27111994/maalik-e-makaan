title: "سوالات اور جوابات"
description: "مالکِ مکان ایپ کے بارے میں جوابات: یہ کیا ریکارڈ رکھے گی، زبانیں، نگران، رازداری، کرایے پر ٹیکس کی کٹوتی، پولیس رجسٹریشن اور کیلکولیٹر۔"
heading: "سوالات اور جوابات"
intro: "ایپ، اس قانون جس کا ریکارڈ رکھنے میں یہ مدد دیتی ہے، اور اس ویب سائٹ کے بارے میں مختصر جوابات۔ ایپ کا ورژن 1.0 ابھی تیار ہو رہا ہے، اس لیے ایپ سے متعلق جوابات بتاتے ہیں کہ اسے کیا کرنے کے لیے بنایا جا رہا ہے۔"
groups:
  - heading: "ایپ"
    items:
      - question: "مالکِ مکان ایپ کیا ہے؟"
        answer: "پاکستان کے مالکانِ مکان کے لیے ایک ایپ، جس میں جائیدادوں، کرایہ داروں، کرایے، ادائیگیوں، رسیدوں، بجلی گیس کے بلوں اور کاغذات کا ایک قابلِ بھروسا ریکارڈ اردو یا انگریزی میں رکھا جا سکے۔ یہ چند پورشن، فلیٹ یا دکانوں کے مالک، بیرونِ ملک مقیم اس مالک جس کی جائیداد کوئی رشتہ دار سنبھالتا ہو، اور چھوٹے ہاسٹل یا پلازہ کے مالک کے لیے ہے۔"
      - question: "کیا اسے ابھی استعمال کیا جا سکتا ہے؟"
        answer: "ابھی نہیں۔ ورژن 1.0 تیاری کے مراحل میں ہے اور ابھی جاری نہیں ہوا۔ ویب ایپ کا پتا محفوظ کر لیا گیا ہے، اور اینڈرائیڈ اور آئی فون ایپس شائع ہوتے ہی ڈاؤن لوڈ کے صفحے پر درج کر دی جائیں گی۔"
      - question: "کیا مالکِ مکان ایپ آن لائن کرایہ وصول کرے گی؟"
        answer: "نہیں۔ یہ آپ کو ملنے والی ادائیگیاں درج کرے گی، چاہے نقد ہوں یا کسی بینک یا موبائل والٹ کے ذریعے، اور ان کی رسید جاری کرے گی۔ یہ خود کوئی ادائیگی وصول نہیں کرے گی اور نہ رقم اپنے پاس رکھے گی۔"
      - question: "کیا یہ کمزور انٹرنیٹ پر چلے گی؟"
        answer: "اسے درمیانے درجے کے اینڈرائیڈ فونز اور غیر یقینی موبائل ڈیٹا کے لیے بنایا جا رہا ہے: تازہ معلومات آنے تک یہ آخری بار لوڈ ہونے والا ڈیٹا فوراً دکھاتی ہے، اور کنکشن ٹوٹنے کی وجہ سے دو بار بھیجی گئی ادائیگی بھی صرف ایک بار درج ہوتی ہے۔"
      - question: "یہ کن زبانوں میں دستیاب ہے؟"
        answer: "اردو اور انگریزی میں، جو آپ ایپ پہلی بار کھولتے وقت چنتے ہیں؛ اردو دائیں سے بائیں اور نستعلیق میں ہے۔ واٹس ایپ یاد دہانیاں رومن اردو میں بھی لکھی جا سکتی ہیں۔"
      - question: "کیا یہ اوپن سورس ہے؟"
        answer: "جی ہاں۔ ایپ، اس کا ڈیٹابیس اور یہ ویب سائٹ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلے ہیں، تاکہ کوئی بھی دیکھ سکے کہ یہ کیسے کام کرتے ہیں۔"
  - heading: "کرایہ، رسیدیں اور نگران"
    items:
      - question: "رسید نمبر کیسے رکھے جاتے ہیں؟"
        answer: "ہر ادائیگی کو آپ کے پورٹ فولیو میں اس سال کے مسلسل سلسلے کا اگلا نمبر ملتا ہے۔ غلطی سے درج ادائیگی وجہ لکھ کر منسوخ کی جاتی ہے، مٹائی نہیں جاتی، اس لیے سلسلے میں کوئی خلا نہیں رہتا اور ہر رسید کا سراغ لگایا جا سکتا ہے۔"
      - question: "کیا کوئی اور میری طرف سے کرایہ وصول کر سکتا ہے؟"
        answer: "جی ہاں۔ کسی رشتہ دار، نگران یا اکاؤنٹنٹ کو اس کے اپنے کردار کے ساتھ مدعو کریں: مالک، منیجر، اکاؤنٹنٹ یا صرف دیکھنے والا۔ مالک ان کی درج کی ہوئی ہر ادائیگی، ان کے پاس موجود نقدی اور اس کی حوالگی دیکھ سکتا ہے۔"
      - question: "یاد دہانیاں کیسے بھیجی جاتی ہیں؟"
        answer: "ایپ ایک شائستہ یاد دہانی لکھ کر آپ کے فون پر واٹس ایپ میں کرایہ دار کے نام کھول دیتی ہے؛ بھیجنے کا بٹن آپ دباتے ہیں، اپنے نمبر سے۔ فی پیغام کوئی خرچ نہیں، اور ایپ ہر یاد دہانی کا اندراج رکھتی ہے۔"
      - question: "کیا یہ ادھورے مہینے یا سالانہ اضافے کا حساب لگا سکتی ہے؟"
        answer: "جی ہاں۔ پہلے مہینے کا کرایہ ان دنوں کے حساب سے لگ سکتا ہے جتنے دن کرایہ دار رہے، اور کرایہ داری کا ہر سال مکمل ہونے پر ایپ سالانہ اضافہ تجویز کرتی ہے، قریب ترین 100 روپے تک گول کر کے۔ اس سائٹ کے کیلکولیٹر یہی حساب استعمال کرتے ہیں۔"
  - heading: "ٹیکس"
    items:
      - question: "کیا ایپ میرے انکم ٹیکس کا حساب لگائے گی؟"
        answer: "نہیں۔ یہ دفعہ 155 کے تحت کرایہ داروں کا کاٹا ہوا ٹیکس درج کرے گی، مرمت کی مد میں پانچویں حصے کی کٹوتی کا حساب لگائے گی اور آپ کے ٹیکس مشیر کے لیے جولائی سے جون کی اسٹیٹمنٹ بنائے گی۔ یہ آپ کے حتمی ٹیکس کا اندازہ نہیں لگائے گی، اور یہ اسٹیٹمنٹ ٹیکس مشورہ نہیں ہے۔"
      - question: "کن کرایہ داروں کو کرایے سے ٹیکس کاٹنا ہوتا ہے؟"
        answer: "دفعہ 155 کے تحت ایف بی آر کی رہنمائی میں حکومتیں، کمپنیاں، غیر منافع بخش تنظیمیں اور خیراتی ادارے، غیر ملکی سفارتی مشن، کچھ کاروبار جیسے نجی تعلیمی ادارے اور ہسپتال، اور وہ افراد یا افراد کی انجمنیں شامل ہیں جو سال میں 15 لاکھ روپے یا اس سے زیادہ کرایہ ادا کریں۔ تفصیل اور ذرائع کرایے کے ٹیکس کی رہنمائی میں ہیں۔"
      - question: "کیا کرایے سے کاٹا گیا ٹیکس میرا حتمی ٹیکس ہے؟"
        answer: "نہیں۔ دفعہ 155 کے تحت کٹا ہوا ٹیکس قابلِ تعدیل ہے: یہ سال کے آپ کے حتمی انکم ٹیکس میں شمار ہوتا ہے، جو آپ کی تمام آمدنی اور کٹوتیوں پر منحصر ہے۔"
  - heading: "پولیس رجسٹریشن اور کرایہ نامہ"
    items:
      - question: "کیا مجھے اپنے کرایہ دار کی پولیس رجسٹریشن کرانی ہوگی؟"
        answer: "پنجاب، سندھ، خیبر پختونخوا اور بلوچستان کے صوبائی قوانین اس کا تقاضا کرتے ہیں، اور مہلت 48 گھنٹے سے 15 دن تک ہے۔ اسلام آباد پولیس کے مطابق رجسٹریشن لازمی ہے، لیکن ہمیں کوئی ایسا قانون نہیں ملا جو مہلت مقرر کرے۔ پولیس رجسٹریشن کی رہنمائی میں ہر صوبے کا قانون اور اس کے ذرائع دیے گئے ہیں۔"
      - question: "ایپ پولیس رجسٹریشن کی یاد دہانی کیسے کرائے گی؟"
        answer: "یہ اسی تاریخ سے گنے گی جو ہر صوبے کا قانون استعمال کرتا ہے: پنجاب میں 15 دن اور سندھ میں دوسرے دن کے آخر تک (جہاں قانون 48 گھنٹے دیتا ہے، اس لیے اس سے پہلے رجسٹریشن کرائیں) کرایہ دار کے رہائش اختیار کرنے سے، خیبر پختونخوا میں 7 کیلنڈر دن اور بلوچستان میں 3 دن کرایہ نامے پر دستخط سے، اس لیے یہ تاریخ ضرور درج کریں۔ اسلام آباد، گلگت بلتستان اور آزاد کشمیر میں یہ کرایہ دار کے آنے کے ایک دن بعد کی مہلت تجویز کرتی ہے؛ یہ ایپ کی تجویز ہے، قانونی مہلت نہیں۔"
      - question: "اتنے کرایہ نامے 11 مہینے کے کیوں ہوتے ہیں؟"
        answer: "رجسٹریشن ایکٹ 1908 کے تحت ایک سال سے زیادہ مدت یا سال بہ سال کے پٹے کی رجسٹریشن لازمی ہے۔ 11 مہینے کے کرایہ ناموں کی یہی عام وجہ بتائی جاتی ہے، لیکن ہمیں کوئی سرکاری ذریعہ نہیں ملا جو خود اس رواج کو بیان کرتا ہو۔"
  - heading: "رازداری"
    items:
      - question: "میرے کرایہ داروں کی تفصیلات کون دیکھ سکتا ہے؟"
        answer: "صرف وہ لوگ جنہیں آپ اپنے پورٹ فولیو میں مدعو کریں، اور وہ بھی اپنے کردار کی حد تک۔ شناختی کارڈ نمبر اسکرین پر بطورِ طے شدہ چھپے رہتے ہیں اور شناختی دستاویزات نجی اسٹوریج میں رکھی جاتی ہیں، جو مختصر مدت کے لنک سے کھلتی ہیں۔"
      - question: "کیا یہ ویب سائٹ میری نگرانی کرتی ہے؟"
        answer: "نہیں۔ یہ نہ کوئی کوکی رکھتی ہے، نہ کوئی تجزیاتی یا ٹریکنگ ٹول استعمال کرتی ہے اور نہ کسی دوسری سائٹ سے کچھ منگواتی ہے۔ کیلکولیٹر آپ کے براؤزر کے اندر ہی کام کرتے ہیں: آپ جو لکھتے ہیں وہ کہیں نہیں بھیجا جاتا۔"
  - heading: "رہنمائی اور کیلکولیٹر"
    items:
      - question: "کیا یہ رہنمائی قانونی یا ٹیکس مشورہ ہے؟"
        answer: "نہیں۔ یہ عمومی معلومات ہے؛ ہر رہنمائی پر آخری نظرِ ثانی کی تاریخ اور سرکاری ذرائع کے حوالے درج ہیں۔ جہاں ذرائع میں اختلاف ہو یا بات واضح نہ ہو، وہاں رہنمائی یہی بتاتی ہے۔ اپنی صورتِ حال کے لیے کسی وکیل یا ٹیکس مشیر سے رجوع کریں۔"
      - question: "کیلکولیٹر اپنے اعداد کیسے نکالتے ہیں؟"
        answer: "پائی پائی تک درست حساب سے، آخر میں صرف ایک بار گول کر کے، اور ہر نتیجہ اپنا حساب قدم بہ قدم دکھاتا ہے۔ کرایے میں اضافے اور پہلے مہینے کے کیلکولیٹر وہی اصول استعمال کرتے ہیں جو ایپ کرتی ہے؛ ٹیکس کیلکولیٹر ٹیکس سال 2027 کے لیے ایف بی آر کا ریٹ کارڈ استعمال کرتا ہے۔"
closing:
  body: "کوئی سوال جس کا جواب یہاں نہیں؟ پروجیکٹ کے گٹ ہب صفحے پر پوچھیں۔"
  linkLabel: "گٹ ہب پر پوچھیں"
