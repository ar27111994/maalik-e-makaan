title: "سوالات اور جوابات"
description: "مالکِ مکان ایپ کے بارے میں جوابات: ایپ کہاں سے حاصل کریں، یہ کیا ریکارڈ رکھتی ہے، زبانیں، نگران، رازداری، کرایے پر ٹیکس کی کٹوتی، پولیس رجسٹریشن اور کیلکولیٹر۔"
heading: "سوالات اور جوابات"
intro: "ایپ، ان قانونی تقاضوں جن پر نظر رکھنے میں یہ آپ کی مدد کرتی ہے، اور اس ویب سائٹ کے بارے میں مختصر جوابات۔ ایپ کے ورژن 1.0 کا اجرا 9 نومبر 2026 کو ہوا، اور ایپ سے متعلق جوابات بتاتے ہیں کہ یہ آج کیا کرتی ہے۔"
groups:
  - heading: "ایپ"
    items:
      - question: "مالکِ مکان ایپ کیا ہے؟"
        answer: "پاکستان کے مالکانِ مکان کے لیے ایک ایپ، جس میں جائیدادوں، کرایہ داروں، کرایے، ادائیگیوں، رسیدوں، بجلی گیس کے بلوں اور کاغذات کا ایک قابلِ بھروسا ریکارڈ اردو یا انگریزی میں رکھا جا سکے۔ یہ چند پورشنوں، فلیٹوں یا دکانوں کے مالک، بیرونِ ملک مقیم اس مالک جس کی جائیداد کوئی رشتہ دار سنبھالتا ہو، اور چھوٹے ہاسٹل یا پلازہ کے مالک کے لیے ہے۔"
      - question: "کیا اسے ابھی استعمال کیا جا سکتا ہے؟"
        answer: "جی ہاں۔ ورژن 1.0 کا اجرا 9 نومبر 2026 کو ہوا، اور کوئی بھی اکاؤنٹ بنا سکتا ہے۔ ویب ایپ فون یا کمپیوٹر کے کسی بھی جدید براؤزر میں چلتی ہے۔ اینڈرائیڈ کے لیے انسٹال کرنے والی فائلیں گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں، اور ایپ گوگل پلے پر بھی آئے گی۔ آئی فون پر، جب تک ایپ اسٹور پر ایپ نہیں آتی، آزمائشی صارفین گٹ ہب پر موجود ورژن اپنے ایپل اکاؤنٹ سے دستخط کر کے چلا سکتے ہیں۔ ان سب کے لنک ڈاؤن لوڈ کے صفحے پر ہیں۔"
      - question: "ایپ کی قیمت کیا ہے؟"
        answer: "فی الحال کچھ نہیں: ابتدائی رسائی کے دوران ایپ مفت ہے۔ تفصیل قیمتوں کے صفحے پر ہے۔"
      - question: "کیا مالکِ مکان ایپ آن لائن کرایہ وصول کرتی ہے؟"
        answer: "نہیں۔ یہ آپ کو ملنے والی ادائیگیاں درج کرتی ہے، چاہے نقد ہوں یا کسی بینک یا موبائل والٹ کے ذریعے، اور ان کی رسید جاری کرتی ہے۔ یہ خود کوئی ادائیگی وصول نہیں کرتی اور نہ رقم اپنے پاس رکھتی ہے۔"
      - question: "کیا یہ کمزور انٹرنیٹ پر چلتی ہے؟"
        answer: "اسے درمیانے درجے کے اینڈرائیڈ فونز اور غیر یقینی موبائل ڈیٹا کو سامنے رکھ کر بنایا گیا ہے: تازہ معلومات آنے تک یہ آخری بار لوڈ ہونے والا ڈیٹا فوراً دکھاتی ہے، اور کنکشن ٹوٹنے کی وجہ سے دو بار بھیجی گئی ادائیگی بھی صرف ایک بار درج ہوتی ہے۔"
      - question: "یہ کن زبانوں میں دستیاب ہے؟"
        answer: "اردو اور انگریزی۔ ایپ پہلی بار کھولنے پر آپ ان میں سے ایک زبان چنتے ہیں، جسے بعد میں ترتیبات میں بدلا جا سکتا ہے۔ اردو دائیں سے بائیں، نستعلیق میں لکھی جاتی ہے۔ واٹس ایپ کی یاد دہانیاں رومن اردو میں بھی لکھی جا سکتی ہیں۔"
      - question: "کیا یہ اوپن سورس ہے؟"
        answer: "جی ہاں۔ ایپ، اس کا ڈیٹابیس اور یہ ویب سائٹ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلے ہیں، تاکہ کوئی بھی دیکھ سکے کہ یہ کیسے کام کرتے ہیں۔"
      - question: "آگے کیا آنے والا ہے؟"
        answer: "ورژن 1.0 کے بعد کے منصوبے آئندہ منصوبے کے صفحے پر ہیں، اور ہر ورژن میں کیا بدلا، یہ ہر ورژن کی تبدیلیوں کے صفحے پر درج ہے۔"
  - heading: "کرایہ، رسیدیں اور نگران"
    items:
      - question: "رسید نمبر کیسے رکھے جاتے ہیں؟"
        answer: "ہر ادائیگی کو آپ کے پورٹ فولیو میں اس سال کے مسلسل سلسلے کا اگلا نمبر ملتا ہے۔ غلطی سے درج ادائیگی وجہ لکھ کر منسوخ کی جاتی ہے، مٹائی نہیں جاتی، اس لیے سلسلے میں کوئی خلا نہیں رہتا اور ہر رسید کا سراغ لگایا جا سکتا ہے۔"
      - question: "کیا کوئی اور میری طرف سے کرایہ وصول کر سکتا ہے؟"
        answer: "جی ہاں۔ کسی رشتہ دار، نگران یا اکاؤنٹنٹ کو اس کے اپنے کردار کے ساتھ مدعو کریں: مالک، منیجر، اکاؤنٹنٹ یا ناظر (جو صرف دیکھ سکتا ہے)۔ مالک دیکھ سکتا ہے کہ ان میں سے ہر ایک نے کتنی نقدی وصول کی، کتنی آگے دی اور کتنی ابھی اس کے پاس ہے۔"
      - question: "یاد دہانیاں کیسے بھیجی جاتی ہیں؟"
        answer: "ایپ ایک شائستہ یاد دہانی لکھ کر اسے واٹس ایپ میں کرایہ دار کے نام کھول دیتی ہے؛ بھیجنے کا بٹن آپ خود دباتے ہیں، اور پیغام آپ کے اپنے نمبر سے جاتا ہے۔ ہر پیغام پر کوئی خرچ نہیں آتا، اور ایپ ہر یاد دہانی کا اندراج رکھتی ہے۔"
      - question: "کیا یہ ادھورے مہینے یا سالانہ اضافے کا حساب لگا سکتی ہے؟"
        answer: "جی ہاں۔ پہلے مہینے کا کرایہ ان دنوں کے حساب سے لگ سکتا ہے جتنے دن کرایہ دار رہے، اور کرایہ داری کا ہر سال مکمل ہونے پر ایپ سالانہ اضافہ تجویز کرتی ہے، قریب ترین 100 روپے تک گول کر کے۔ اس سائٹ کے کیلکولیٹر یہی حساب استعمال کرتے ہیں۔"
  - heading: "ٹیکس"
    items:
      - question: "کیا ایپ میرے انکم ٹیکس کا حساب لگاتی ہے؟"
        answer: "نہیں۔ یہ دفعہ 155 کے تحت کرایہ داروں کا کاٹا ہوا ٹیکس درج کرتی ہے، مرمت کی مد میں پانچویں حصے کی کٹوتی کا حساب لگاتی ہے اور آپ کے ٹیکس مشیر کے لیے جولائی سے جون کی اسٹیٹمنٹ بناتی ہے۔ یہ آپ کے حتمی ٹیکس کا اندازہ نہیں لگاتی، اور یہ اسٹیٹمنٹ ٹیکس مشورہ نہیں ہے۔"
      - question: "کن کرایہ داروں کو کرایے سے ٹیکس کاٹنا ہوتا ہے؟"
        answer: "دفعہ 155 کے تحت ایف بی آر کی رہنمائی میں حکومتیں، کمپنیاں، غیر منافع بخش تنظیمیں اور خیراتی ادارے، غیر ملکی سفارتی مشن، کچھ کاروبار جیسے نجی تعلیمی ادارے اور ہسپتال، اور وہ افراد یا افراد کی انجمنیں شامل ہیں جو سال میں 15 لاکھ روپے یا اس سے زیادہ کرایہ ادا کریں۔ تفصیل اور ذرائع کرایے کے ٹیکس کی رہنمائی میں ہیں۔"
      - question: "کیا کرایے سے کاٹا گیا ٹیکس میرا حتمی ٹیکس ہے؟"
        answer: "نہیں۔ دفعہ 155 کے تحت کٹا ہوا ٹیکس قابلِ تعدیل ہے: یہ سال کے آپ کے حتمی انکم ٹیکس میں شمار ہوتا ہے، جو آپ کی تمام آمدنی اور کٹوتیوں پر منحصر ہے۔"
  - heading: "پولیس رجسٹریشن اور کرایہ نامہ"
    items:
      - question: "کیا مجھے اپنے کرایہ دار کی پولیس رجسٹریشن کرانی ہوگی؟"
        answer: "پنجاب، سندھ، خیبر پختونخوا اور بلوچستان کے صوبائی قوانین اس کا تقاضا کرتے ہیں، اور مہلت 48 گھنٹے سے 15 دن تک ہے۔ اسلام آباد پولیس کے مطابق رجسٹریشن لازمی ہے، لیکن ہمیں کوئی ایسا قانون نہیں ملا جو مہلت مقرر کرے۔ پولیس رجسٹریشن کی رہنمائی میں ہر صوبے کا قانون اور اس کے ذرائع دیے گئے ہیں۔"
      - question: "ایپ پولیس رجسٹریشن کی یاد دہانی کیسے کراتی ہے؟"
        answer: "اس کی اطلاعات میں ہر وہ رجسٹریشن دکھائی جاتی ہے جو ابھی باقی ہو یا جس کی مہلت گزر چکی ہو۔ مہلت اسی تاریخ سے گنی جاتی ہے جس سے ہر صوبے کا قانون گنتا ہے: پنجاب میں کرایہ دار کے مکان میں آنے سے 15 دن، اور سندھ میں اس سے دوسرے دن کے آخر تک (وہاں قانون 48 گھنٹے دیتا ہے، اس لیے اس سے پہلے رجسٹریشن کرا لیں)؛ خیبر پختونخوا میں کرایہ نامے پر دستخط سے 7 کیلنڈر دن اور بلوچستان میں 3 دن، اس لیے دستخط کی تاریخ ضرور درج کریں۔ اسلام آباد، گلگت بلتستان اور آزاد کشمیر میں یہ کرایہ دار کے مکان میں آنے کے ایک دن بعد کی مہلت تجویز کرتی ہے؛ یہ ایپ کی تجویز ہے، قانونی مہلت نہیں۔"
      - question: "اتنے کرایہ نامے 11 مہینے کے کیوں ہوتے ہیں؟"
        answer: "رجسٹریشن ایکٹ 1908 کے تحت ایک سال سے زیادہ مدت یا سال بہ سال کے پٹے کی رجسٹریشن لازمی ہے۔ 11 مہینے کے کرایہ ناموں کی یہی عام وجہ بتائی جاتی ہے، لیکن ہمیں کوئی سرکاری ذریعہ نہیں ملا جو خود اس رواج کو بیان کرتا ہو۔"
  - heading: "رازداری"
    items:
      - question: "میرے کرایہ داروں کی تفصیلات کون دیکھ سکتا ہے؟"
        answer: "صرف وہ لوگ جنہیں آپ اپنے پورٹ فولیو میں مدعو کریں، اور وہ بھی اپنے کردار کی حد تک۔ شناختی کارڈ نمبر اسکرین پر خود بخود چھپے رہتے ہیں اور شناختی دستاویزات نجی اسٹوریج میں رکھی جاتی ہیں، جو مختصر مدت کے لنک سے کھلتی ہیں۔"
      - question: "کیا یہ ویب سائٹ میری نگرانی کرتی ہے؟"
        answer: "نہیں۔ یہ نہ کوئی کوکی رکھتی ہے، نہ کوئی تجزیاتی یا ٹریکنگ ٹول استعمال کرتی ہے اور نہ کسی دوسری سائٹ سے کچھ منگواتی ہے۔ کیلکولیٹر آپ کے براؤزر کے اندر ہی کام کرتے ہیں: آپ جو لکھتے ہیں وہ کہیں نہیں بھیجا جاتا۔"
  - heading: "رہنمائی اور کیلکولیٹر"
    items:
      - question: "کیا یہ رہنمائی قانونی یا ٹیکس مشورہ ہے؟"
        answer: "نہیں۔ یہ عمومی معلومات ہے؛ ہر رہنمائی پر آخری نظرِ ثانی کی تاریخ اور سرکاری ذرائع کے حوالے درج ہیں۔ جہاں ذرائع میں اختلاف ہو یا بات واضح نہ ہو، وہاں رہنمائی یہی بتاتی ہے۔ اپنی صورتِ حال کے لیے کسی وکیل یا ٹیکس مشیر سے رجوع کریں۔"
      - question: "کیلکولیٹر اپنے اعداد کیسے نکالتے ہیں؟"
        answer: "پائی پائی تک درست حساب سے، آخر میں صرف ایک بار گول کر کے، اور ہر نتیجہ اپنا حساب قدم بہ قدم دکھاتا ہے۔ کرایے میں اضافے اور پہلے مہینے کے کیلکولیٹر وہی اصول استعمال کرتے ہیں جو ایپ کرتی ہے؛ ٹیکس کیلکولیٹر ٹیکس سال 2027 کے لیے ایف بی آر کا ریٹ کارڈ استعمال کرتا ہے۔"
closing:
  body: "کوئی سوال جس کا جواب یہاں نہیں، یا ایپ میں کوئی خرابی نظر آئی؟ پروجیکٹ کے گٹ ہب صفحے پر ہمیں بتائیں۔"
  linkLabel: "گٹ ہب پر بتائیں"
