title: "سوالات اور جوابات"
description: "مالکِ مکان ایپ کے بارے میں جوابات: ایپ کہاں سے ملے گی، یہ کیا ریکارڈ رکھتی ہے، زبانیں، نگران، پرائیویسی، کرائے پر ٹیکس کی کٹوتی، پولیس رجسٹریشن اور کیلکولیٹر۔"
heading: "سوالات اور جوابات"
intro: "ایپ کے بارے میں، ان قانونی باتوں کے بارے میں جن پر نظر رکھنے میں یہ آپ کی مدد کرتی ہے، اور اس ویب سائٹ کے بارے میں چھوٹے جواب۔ ایپ کا ورژن 1.0، 9 نومبر 2026 کو جاری ہوا۔ ایپ کے بارے میں جواب بتاتے ہیں کہ یہ آج کیا کرتی ہے۔"
groups:
  - heading: "ایپ"
    items:
      - question: "مالکِ مکان ایپ کیا ہے؟"
        answer: "پاکستان میں مکانوں کے مالکوں کے لیے ایک ایپ۔ اس میں آپ اپنی جائیدادوں، کرایہ داروں، کرائے، ادائیگیوں، رسیدوں، بلوں اور کاغذات کا ایک قابلِ بھروسا ریکارڈ اردو یا انگریزی میں رکھتے ہیں۔ یہ چند پورشنوں، فلیٹوں یا دکانوں کے مالک کے لیے ہے، اس اوورسیز مالک کے لیے جس کی جائیداد کوئی رشتہ دار سنبھالتا ہو، اور چھوٹے ہاسٹل یا پلازہ کے مالک کے لیے۔"
      - question: "کیا میں اسے ابھی استعمال کر سکتا ہوں؟"
        answer: "جی ہاں۔ ورژن 1.0، 9 نومبر 2026 کو جاری ہوا، اور کوئی بھی اکاؤنٹ بنا سکتا ہے۔ ویب ایپ فون یا کمپیوٹر کے کسی بھی جدید براؤزر میں چلتی ہے۔ اینڈرائیڈ کے لیے انسٹال کرنے والی فائلیں گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں، اور ایپ گوگل پلے پر بھی آئے گی۔ آئی فون کے لیے ایپ ابھی ایپ اسٹور پر نہیں آئی۔ تب تک ٹیسٹ کرنے والے گٹ ہب والا ورژن اپنے ایپل اکاؤنٹ سے دستخط کر کے چلا سکتے ہیں۔ ان سب کے لنک ڈاؤن لوڈ کے صفحے پر ہیں۔"
      - question: "ایپ کی قیمت کیا ہے؟"
        answer: "فی الحال کچھ نہیں: ایپ ابھی شروعاتی دور میں مفت ہے۔ تفصیل قیمتوں کے صفحے پر ہے۔"
      - question: "کیا مالکِ مکان ایپ آن لائن کرایہ وصول کرتی ہے؟"
        answer: "نہیں۔ آپ کو جو ادائیگیاں ملیں، یہ انہیں درج کرتی ہے، چاہے نقد ہوں یا کسی بینک یا موبائل والٹ کے ذریعے، اور ان کی رسید بناتی ہے۔ یہ خود کوئی ادائیگی وصول نہیں کرتی، اور نہ رقم اپنے پاس رکھتی ہے۔"
      - question: "کیا یہ کمزور انٹرنیٹ پر چلتی ہے؟"
        answer: "ہم نے اسے درمیانے درجے کے اینڈرائیڈ فونز اور کبھی چلتے کبھی رکتے موبائل ڈیٹا کے لیے بنایا ہے۔ تازہ معلومات آنے تک یہ وہی ڈیٹا فوراً دکھاتی ہے جو آخری بار لوڈ ہوا تھا۔ انٹرنیٹ ٹوٹنے سے کوئی ادائیگی دو بار چلی جائے، تب بھی وہ ایک ہی بار درج ہوتی ہے۔"
      - question: "یہ کن زبانوں میں دستیاب ہے؟"
        answer: "اردو اور انگریزی۔ ایپ پہلی بار کھولنے پر آپ ان میں سے ایک زبان چنتے ہیں، اور بعد میں اسے سیٹنگز میں بدل سکتے ہیں۔ اردو دائیں سے بائیں، صاف حروف میں لکھی جاتی ہے جو فون پر آسانی سے پڑھے جاتے ہیں۔ واٹس ایپ کی یاد دہانیاں رومن اردو میں بھی بن سکتی ہیں۔"
      - question: "کیا یہ اوپن سورس ہے؟"
        answer: "جی ہاں۔ ایپ، اس کا ڈیٹابیس اور یہ ویب سائٹ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلے ہیں، تاکہ کوئی بھی دیکھ سکے کہ یہ کیسے کام کرتے ہیں۔"
      - question: "آگے کیا آنے والا ہے؟"
        answer: "ورژن 1.0 کے بعد کیا آ رہا ہے، یہ روڈ میپ کے صفحے پر ہے۔ ہر ورژن میں کیا بدلا، یہ ہر ورژن کی تبدیلیوں کے صفحے پر لکھا ہے۔"
  - heading: "کرایہ، رسیدیں اور نگران"
    items:
      - question: "رسید نمبر کیسے رکھے جاتے ہیں؟"
        answer: "آپ کے پورٹ فولیو میں ہر سال رسید نمبر ایک کے بعد ایک چلتے ہیں، اور ہر ادائیگی کو اگلا نمبر ملتا ہے۔ غلطی سے درج ادائیگی آپ وجہ لکھ کر کینسل کرتے ہیں۔ یہ کبھی ڈیلیٹ نہیں ہوتی، اور اس کی رسید کا نمبر بھی وہی رہتا ہے۔ اس لیے بیچ میں کوئی نمبر خالی نہیں رہتا، اور ہر رسید کا پتہ لگایا جا سکتا ہے۔"
      - question: "کیا کوئی اور میری طرف سے کرایہ وصول کر سکتا ہے؟"
        answer: "جی ہاں۔ کسی رشتہ دار، نگران یا اکاؤنٹنٹ کو ان کے اپنے رول کے ساتھ دعوت بھیجیں: مالک، منیجر، اکاؤنٹنٹ، یا صرف دیکھنے والا۔ مالک دیکھ سکتا ہے کہ ان میں سے ہر ایک نے کتنی نقدی وصول کی، کتنی آگے دی، اور کتنی ابھی ان کے پاس ہے۔"
      - question: "یاد دہانیاں کیسے بھیجی جاتی ہیں؟"
        answer: "ایپ نرم لہجے کی یاد دہانی لکھ کر واٹس ایپ میں کرایہ دار کے نمبر پر کھول دیتی ہے۔ بھیجنے کا بٹن آپ خود دباتے ہیں، اور پیغام آپ کے اپنے نمبر سے جاتا ہے۔ کسی پیغام پر کوئی خرچ نہیں آتا، اور ایپ ہر یاد دہانی کا ریکارڈ رکھتی ہے۔"
      - question: "کیا یہ ادھورے مہینے یا سالانہ اضافے کا حساب لگا سکتی ہے؟"
        answer: "جی ہاں۔ پہلے مہینے کا کرایہ صرف ان دنوں کا لگ سکتا ہے جتنے دن جگہ کرایہ دار کے پاس رہی۔ کرایہ داری کا ہر سال پورا ہونے پر ایپ سالانہ اضافہ تجویز کرتی ہے، قریب ترین 100 روپے تک گول کر کے۔ اس سائٹ کے کیلکولیٹر بھی یہی حساب لگاتے ہیں۔"
  - heading: "ٹیکس"
    items:
      - question: "کیا ایپ میرے انکم ٹیکس کا حساب لگاتی ہے؟"
        answer: "نہیں۔ یہ وہ ٹیکس درج کرتی ہے جو کرایہ دار دفعہ 155 کے تحت کاٹتے ہیں۔ یہ مرمت کے لیے کرائے کے پانچویں حصے کا حساب بھی لگاتی ہے، جو ٹیکس کے حساب میں آمدنی میں سے نکلتا ہے۔ پھر یہ آپ کے ٹیکس مشیر کے لیے جولائی سے جون کی اسٹیٹمنٹ بناتی ہے۔ یہ آپ کے سال کے اصل ٹیکس کا اندازہ نہیں لگاتی، اور یہ اسٹیٹمنٹ ٹیکس مشورہ نہیں ہے۔"
      - question: "کن کرایہ داروں کو کرائے سے ٹیکس کاٹنا ہوتا ہے؟"
        answer: "دفعہ 155 پر ایف بی آر کی رہنمائی میں یہ کرایہ دار شامل ہیں: حکومتیں، کمپنیاں، غیر منافع بخش ادارے (جیسے ٹرسٹ) اور خیراتی ادارے، غیر ملکی سفارت خانے اور ہائی کمیشن، کچھ کاروبار جیسے نجی اسکول اور ہسپتال، اور وہ لوگ یا افراد کی انجمنیں (اے او پی) جو سال میں 15 لاکھ روپے یا اس سے زیادہ کرایہ دیں۔ تفصیل اور ذرائع کرائے کے ٹیکس کی رہنمائی میں ہیں۔"
      - question: "کیا کرائے سے کٹا ہوا ٹیکس میرا سال کا اصل ٹیکس ہے؟"
        answer: "نہیں۔ دفعہ 155 کے تحت کٹا ہوا ٹیکس ایڈجسٹ ہوتا ہے: یہ آپ کے سال کے اصل ٹیکس میں ادا شدہ مانا جاتا ہے۔ اس سے آپ کے ٹیکس کا حساب ختم نہیں ہوتا۔ سال کا اصل ٹیکس ریٹرن میں نکلتا ہے، اور یہ آپ کی ساری آمدنی پر، اور ٹیکس کے حساب میں آمدنی میں سے نکلنے والی رقموں پر منحصر ہے۔"
  - heading: "پولیس رجسٹریشن اور کرایہ نامہ"
    items:
      - question: "کیا مجھے اپنے کرایہ دار کی پولیس رجسٹریشن کروانی ہو گی؟"
        answer: "پنجاب، سندھ، خیبر پختونخوا اور بلوچستان کے صوبائی قوانین کے مطابق یہ لازم ہے۔ صوبے کے حساب سے رجسٹریشن 48 گھنٹے سے 15 دن کے اندر کروانی ہوتی ہے۔ اسلام آباد پولیس کے مطابق رجسٹریشن لازمی ہے، لیکن ہمیں کوئی ایسا قانون نہیں ملا جو آخری تاریخ دے۔ پولیس رجسٹریشن کی رہنمائی میں ہر صوبے کا قانون اور اس کے ذرائع ہیں۔"
      - question: "ایپ پولیس رجسٹریشن کی یاد دہانی کیسے کرواتی ہے؟"
        answer: "ایپ کی اطلاعات میں ہر وہ رجسٹریشن نظر آتی ہے جو ابھی نہیں ہوئی، یا جو لیٹ ہو چکی ہے۔ ایپ وقت اسی دن سے گنتی ہے جس سے ہر صوبے کا قانون گنتا ہے۔ پنجاب میں کرایہ دار کو جگہ (قبضہ) ملنے سے 15 دن۔ سندھ میں جگہ ملنے سے دوسرے دن کے آخر تک۔ وہاں قانون 48 گھنٹے دیتا ہے، اس لیے اس سے پہلے رجسٹریشن کروا لیں۔ خیبر پختونخوا میں کرایہ نامے پر دستخط سے 7 کیلنڈر دن، اور بلوچستان میں 3 دن، اس لیے دستخط کی تاریخ ضرور درج کریں۔ اسلام آباد، گلگت بلتستان اور آزاد کشمیر میں ایپ جگہ ملنے کے ایک دن بعد کی تاریخ تجویز کرتی ہے۔ یہ ایپ کی تجویز ہے، قانون کی آخری تاریخ نہیں۔"
      - question: "اتنے کرایہ نامے 11 مہینے کے کیوں ہوتے ہیں؟"
        answer: "رجسٹریشن ایکٹ 1908 کے مطابق ایک سال سے زیادہ کی لیز، یا ہر سال خود آگے چلنے والی لیز، رجسٹر کروانا لازمی ہے۔ 11 مہینے کے کرایہ ناموں کی عام طور پر یہی وجہ بتائی جاتی ہے، لیکن ہمیں کوئی سرکاری ذریعہ نہیں ملا جو خود اس رواج کو بیان کرتا ہو۔"
  - heading: "پرائیویسی"
    items:
      - question: "میرے کرایہ داروں کی تفصیلات کون دیکھ سکتا ہے؟"
        answer: "صرف وہ لوگ جنہیں آپ اپنے پورٹ فولیو میں شامل کریں، اور وہ بھی صرف اتنا جتنا ان کا رول اجازت دے۔ شناختی کارڈ نمبر اسکرین پر پہلے سے چھپے رہتے ہیں۔ شناختی کاغذات نجی اسٹوریج میں رہتے ہیں، اور ایسے لنک سے کھلتے ہیں جو تھوڑی دیر بعد کام کرنا بند کر دیتا ہے۔"
      - question: "کیا یہ ویب سائٹ میری نگرانی کرتی ہے؟"
        answer: "نہیں۔ یہ کوئی کوکی نہیں رکھتی، اور نہ اینالیٹکس یا ٹریکنگ کا کوئی ٹول استعمال کرتی ہے، یعنی کوئی ایسا ٹول نہیں جو گنے کہ کون کیا دیکھتا ہے۔ یہ کسی دوسری سائٹ سے بھی کچھ نہیں منگواتی۔ کیلکولیٹر آپ کے براؤزر کے اندر ہی کام کرتے ہیں: آپ جو لکھتے ہیں وہ کہیں نہیں جاتا۔"
  - heading: "رہنمائی اور کیلکولیٹر"
    items:
      - question: "کیا یہ رہنمائی قانونی یا ٹیکس مشورہ ہے؟"
        answer: "نہیں۔ یہ عام معلومات ہے۔ ہر رہنمائی پر لکھا ہے کہ اسے آخری بار کب چیک کیا، اور ساتھ سرکاری ذرائع کے حوالے ہیں۔ جہاں ذرائع آپس میں نہ ملیں یا بات صاف نہ ہو، وہاں رہنمائی یہی بتاتی ہے۔ اپنے معاملے کے لیے کسی وکیل یا ٹیکس مشیر سے پوچھیں۔"
      - question: "کیلکولیٹر حساب کیسے لگاتے ہیں؟"
        answer: "پائی پائی تک درست حساب سے، اور آخر میں صرف ایک بار گول کر کے۔ ہر جواب اپنا حساب قدم بہ قدم دکھاتا ہے۔ کرائے میں اضافے اور پہلے مہینے کے کیلکولیٹر وہی اصول استعمال کرتے ہیں جو ایپ کرتی ہے۔ ٹیکس کیلکولیٹر ٹیکس سال 2027 کے لیے ایف بی آر کا ریٹ کارڈ استعمال کرتا ہے۔"
closing:
  body: "کوئی سوال جس کا جواب یہاں نہیں، یا ایپ میں کوئی خرابی نظر آئی؟ پروجیکٹ کے گٹ ہب صفحے پر ہمیں بتائیں۔"
  linkLabel: "گٹ ہب پر بتائیں"
