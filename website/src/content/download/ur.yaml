title: "ایپ حاصل کریں"
description: "مالکِ مکان کہاں سے حاصل کریں: کسی بھی براؤزر میں ویب ایپ، اور اینڈرائیڈ فونز اور آئی فون کے لیے ایپس، یہ سب ورژن 1.0 کے ساتھ آئیں گی جو ابھی تیار ہو رہا ہے۔"
heading: "ایپ حاصل کریں"
intro: "مالکِ مکان ویب براؤزر میں، اور اینڈرائیڈ فونز اور آئی فون پر ایپ کے طور پر چلے گی، ہر جگہ ایک ہی ریکارڈ کے ساتھ۔ ورژن 1.0 ابھی جاری نہیں ہوا؛ ہر ایک کے دستیاب ہوتے ہی یہ صفحہ اس کا لنک دے گا۔"
