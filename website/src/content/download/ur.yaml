title: "ایپ ڈاؤن لوڈ کریں"
description: "مالکِ مکان ایپ کہاں سے ملے گی: کسی بھی براؤزر میں ویب ایپ، اینڈرائیڈ فونز کے لیے ایپ کی فائلیں، اور آئی فون پر ٹیسٹ کرنے والوں کے لیے ایک ورژن۔ ابھی مفت۔"
heading: "ایپ ڈاؤن لوڈ کریں"
intro: "مالکِ مکان ایپ ویب براؤزر میں بھی چلتی ہے اور اینڈرائیڈ فون اور آئی فون پر بھی، اور ہر جگہ آپ کا ریکارڈ ایک ہی رہتا ہے۔ ویب ایپ اب دستیاب ہے، اور کوئی بھی اکاؤنٹ بنا سکتا ہے۔ اینڈرائیڈ فون پر آپ ایپ ان فائلوں سے انسٹال کرتے ہیں جو گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں۔ آئی فون کا ورژن بھی ٹیسٹ کرنے والے وہیں سے لے سکتے ہیں۔ گوگل پلے اور ایپ اسٹور پر بھی ایپ آنے والی ہے۔ ایپ ابھی شروعاتی دور میں مفت ہے۔"
platforms:
  - name: "ویب ایپ"
    status: "دستیاب"
    available: true
    body: "فون یا کمپیوٹر کے کسی بھی جدید براؤزر کے لیے، کچھ انسٹال کیے بغیر۔ اسے کھولیں، اپنا اکاؤنٹ بنائیں اور اپنی جائیدادیں شامل کرنا شروع کریں۔"
  - name: "اینڈرائیڈ"
    status: "گٹ ہب پر موجود، گوگل پلے پر آ رہی ہے"
    available: true
    body: "اینڈرائیڈ 7.0 یا اس کے بعد کے ورژن والے فونز کے لیے۔ اسے ان فائلوں سے انسٹال کریں جو گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں۔ ہو سکتا ہے آپ کا فون پہلے براؤزر سے انسٹال کرنے کی اجازت مانگے۔ ایپ گوگل پلے پر بھی آنے والی ہے۔"
  - name: "آئی فون"
    status: "صرف ٹیسٹ کرنے والوں کے لیے"
    available: false
    body: "ایپ اسٹور پر ایپ آنے والی ہے۔ تب تک ٹیسٹ کرنے والے ہر ورژن کے ساتھ موجود فائل کو اپنے ایپل اکاؤنٹ سے دستخط کر کے انسٹال کر سکتے ہیں۔"
webApp:
  heading: "ویب ایپ کا پتہ"
  body: "نیچے دیا گیا پتہ کسی بھی براؤزر میں کھولیں، سائن اِن کریں اور اگلی بار کے لیے اسے محفوظ کر لیں۔ آپ جس فون یا کمپیوٹر پر بھی کھولیں، آپ کا ریکارڈ ایک ہی ہو گا۔"
  cta:
    label: "ویب ایپ کھولیں"
    href: "app"
release:
  heading: "ورژن {version}"
  date: "{date} کو جاری ہوا۔"
  notesHeading: "اس ورژن میں نیا کیا ہے"
  notesLanguage: "نیچے دی گئی تفصیل انگریزی میں لکھی گئی ہے۔"
  filesHeading: "فائلیں ڈاؤن لوڈ کریں"
  files:
    android-arm64:
      label: "اینڈرائیڈ (زیادہ تر فونز)"
      note: "زیادہ تر اینڈرائیڈ فونز کے لیے۔ اگر آپ کو یقین نہیں کہ کون سی فائل چاہیے، تو یہی لیں۔"
    android-arm32:
      label: "اینڈرائیڈ (پرانے فونز)"
      note: "ان پرانے اینڈرائیڈ فونز کے لیے جن پر زیادہ تر فونز والی فائل انسٹال نہیں ہوتی۔"
    android-x86:
      label: "اینڈرائیڈ (ایمولیٹر اور کروم بُک)"
      note: "کمپیوٹر پر اینڈرائیڈ ایمولیٹر کے لیے، اور انٹیل یا اے ایم ڈی پروسیسر والی کروم بُک کے لیے۔"
    ios:
      label: "آئی فون (بغیر دستخط، ٹیسٹ کرنے والوں کے لیے)"
      note: "ان ٹیسٹ کرنے والوں کے لیے جو انسٹال کرنے سے پہلے اسے اپنے ایپل اکاؤنٹ سے دستخط کرتے ہیں۔ مفت اکاؤنٹ کے ساتھ ایپ 7 دن چلتی ہے، پھر اسے دوبارہ دستخط کر کے انسٹال کرنا پڑتا ہے۔"
    web:
      label: "ویب ایپ کی فائلیں"
      note: "ویب ایپ کی فائلیں، ان لوگوں کے لیے جو اسے خود اپنے سرور پر چلانا چاہیں۔ باقی سب ویب ایپ سیدھا کھول سکتے ہیں۔"
    checksums:
      label: "چیک سم (ایس ایچ اے 256)"
      note: "اینڈرائیڈ اور ویب ایپ کی فائلوں کے ایس ایچ اے 256 چیک سم، یہ چیک کرنے کے لیے کہ جو فائل ڈاؤن لوڈ ہوئی، وہ پوری اور بغیر کسی تبدیلی کے پہنچی۔"
  allReleases:
    label: "سب ورژن اور ان کی تفصیل"
    href: "/releases/"
  github: "گٹ ہب پر یہ ورژن"
requirements:
  heading: "آپ کو کیا چاہیے"
  items:
    - "آپ کی ای میل، اکاؤنٹ بنانے اور دعوتیں وصول کرنے کے لیے۔"
    - "موبائل ڈیٹا یا وائی فائی والا فون یا کمپیوٹر۔ ہم نے ایپ کمزور انٹرنیٹ پر بھی چلنے کے لیے بنائی ہے۔"
    - "آپ کے فون پر واٹس ایپ، اگر آپ اپنے نمبر سے یاد دہانیاں بھیجنا چاہیں۔"
