title: "خصوصیات"
description: "مالکِ مکان کا ورژن 1.0 کیا کرنے کے لیے بنایا جا رہا ہے: رسیدوں کے ساتھ کرایے کا کھاتہ، واٹس ایپ یاد دہانیاں، نگرانوں کے کردار، قانونی ریکارڈ، رپورٹیں اور اردو۔"
heading: "خصوصیات"
intro: "نیچے دی گئی ہر چیز ورژن 1.0 کا حصہ ہے جو اس وقت تیار ہو رہا ہے، سوائے آخری حصے کے، جو اس کے بعد کے لیے طے ہے۔ ہر خصوصیت ویسے بیان کی گئی ہے جیسے وہ جاری ہونے پر کام کرے گی۔"
status:
  v1: "ورژن 1.0 میں"
  later: "1.0 کے بعد طے شدہ"
  note: "ورژن 1.0 ابھی جاری نہیں ہوا۔ ہر خصوصیت دستیاب ہونے پر یہ صفحہ بتا دے گا۔"
sections:
  - id: "ledger"
    heading: "نمبر والی رسیدوں کے ساتھ کرایے کا کھاتہ"
    status: "v1"
    body: "ہر جائیداد اور کرایہ دار کا ایک ہی کھاتہ، پائی پائی کے درست حساب کے ساتھ۔ کرایہ ہر مہینے خود واجب ہو جاتا ہے، اور ہر ادائیگی سب سے پرانے واجبات سے ملائی جاتی ہے۔"
    points:
      - "ہر جاری کرایہ داری کا ماہانہ کرایہ خود بخود واجب، اور چاہیں تو پہلے ادھورے مہینے کا کرایہ دنوں کے حساب سے۔"
      - "نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ، چیک یا کارڈ سے ادائیگیاں، ہر ایک کے حوالہ نمبر اور چاہیں تو ثبوت کی تصویر کے ساتھ۔"
      - "جزوی ادائیگیاں، پیشگی رقم، اور وہ فاضل رقم جو اگلے واجبات میں خود منہا ہو جاتی ہے۔"
      - "ہر ادائیگی کی اردو اور انگریزی میں نمبر والی پی ڈی ایف رسید، ہر سال کے مسلسل سلسلے میں، جو واٹس ایپ پر بھیجی جا سکے۔"
      - "ہر کرایہ داری کی اپنی شرائط کے مطابق تاخیر کی فیس، ہر واجب الادا مہینے پر زیادہ سے زیادہ ایک بار، اور زرِ ضمانت کا وصولی سے واپسی تک حساب۔"
      - "کوئی مالی اندراج مٹایا نہیں جاتا: غلطی وجہ لکھ کر منسوخ کی جاتی ہے، اور ریکارڈ بتاتا ہے کہ کس نے اور کب کی۔"
  - id: "reminders"
    heading: "یاد دہانیاں جو آپ کے اپنے واٹس ایپ سے جائیں"
    status: "v1"
    body: "ایپ یاد دہانی لکھ کر واٹس ایپ میں کرایہ دار کے نام کھول دیتی ہے؛ آپ اسے اپنے نمبر سے بھیجتے ہیں، فی پیغام کسی خرچ کے بغیر۔"
    points:
      - "قریب آتے کرایے، آج واجب کرایے اور تاخیر شدہ کرایے، وصول شدہ ادائیگی اور بجلی گیس کے بل کے لیے تیار یاد دہانیاں۔"
      - "ہر یاد دہانی اردو، انگریزی یا رومن اردو میں۔"
      - "رات گئے یا جمعے کی نماز کے وقت ذرا انتظار کرنے کا نرم مشورہ۔"
      - "روزانہ کی فہرست کہ کس چیز پر توجہ چاہیے: واجب اور تاخیر شدہ کرایہ، ختم ہوتے معاہدے، واجب سالانہ اضافے، باقی پولیس رجسٹریشن، ختم ہوتے شناختی کارڈ اور ادا نہ ہونے والے بل۔"
  - id: "team"
    heading: "نگران، اکاؤنٹنٹ اور بیرونِ ملک مقیم مالکان"
    status: "v1"
    body: "آپ کا ہاتھ بٹانے والوں کو ان کا اپنا کردار دیں، تاکہ مالک کہیں سے بھی ان کے ہاتھ سے گزرنے والا ہر روپیہ دیکھ سکے۔"
    points:
      - "چار کردار: مالک، منیجر (نگران یا رشتہ دار)، اکاؤنٹنٹ اور صرف دیکھنے والا، ہر ایک کو صرف وہی اجازت جو اس کے کردار کو درکار ہو۔"
      - "ای میل کے ذریعے ایک بار استعمال ہونے والے لنک سے دعوت، جو سات دن بعد ختم ہو جاتا ہے۔"
      - "ہر رکن کے پاس موجود نقدی، اور نگران سے مالک کو رقم کی حوالگی کا ریکارڈ۔"
      - "ریکارڈ اور رقم میں ہر تبدیلی کا آڈٹ ریکارڈ، کہ کس نے کی اور کب۔"
  - id: "compliance"
    heading: "پولیس رجسٹریشن، کرایہ نامہ اور بجلی گیس"
    status: "v1"
    body: "پاکستانی کرایہ داری کے لیے درکار کاغذات اسی کرایہ داری کے ساتھ رکھیں، اور دیکھیں کہ کیا ابھی باقی ہے۔"
    points:
      - "ہر کرایہ داری کی پولیس رجسٹریشن: صورتِ حال، ذریعہ، حوالہ نمبر اور تاریخ، ہر صوبے کے قانون کے مطابق گنی گئی مہلت کے ساتھ، اور پنجاب، سندھ اور اسلام آباد پولیس کے پورٹلز کے براہِ راست لنک۔"
      - "کرایہ نامہ: دستخط کی تاریخ، ای اسٹامپ نمبر اور رقم، پنجاب کے رینٹ رجسٹرار کے ہاں صورتِ حال اور رجسٹریشن نمبر، استعمال کی اجازت اور آگے کرایے پر دینے کی رضامندی۔"
      - "ہر جائیداد یا یونٹ کے بجلی، گیس، پانی اور انٹرنیٹ کنکشن، ماہانہ بل، آمد اور رخصت کے وقت میٹر ریڈنگ، اور بجلی کے 200 یونٹ والے محفوظ ٹیرف کی حد کے قریب پہنچنے پر انتباہ۔"
      - "کرایہ دار کی تفصیلات، جن میں شناختی کارڈ نمبر جانچا جاتا ہے اور اسکرین پر چھپا رہتا ہے، ساتھ رہنے والے بالغ افراد، ضامن، اور تفصیلات محفوظ رکھنے کی رضامندی تاریخ کے ساتھ۔"
  - id: "reports"
    heading: "ڈیش بورڈ، اسٹیٹمنٹ اور ٹیکس سال"
    status: "v1"
    body: "ایک نظر میں اپنی صورتِ حال دیکھیں، اور اپنے مشیر کو درکار اعداد کچھ دوبارہ لکھے بغیر دے دیں۔"
    points:
      - "اس مہینے متوقع اور وصول شدہ کرایہ، کس کے ذمے کتنا اور کب سے، خالی اور بھرے یونٹ، اور آنے والے کام، سب ایک ڈیش بورڈ پر۔"
      - "ہر کرایہ دار کے واجبات، ادائیگیوں اور رسید نمبروں کی اسٹیٹمنٹ، کسی تنازع کے حل کے لیے۔"
      - "بیرونِ ملک مقیم مالک کے لیے ماہانہ اسٹیٹمنٹ۔"
      - "ہر جائیداد کی جولائی سے جون کے ٹیکس سال کی اسٹیٹمنٹ: مجموعی کرایہ، دفعہ 155 کے تحت کرایہ داروں کا کاٹا ہوا ٹیکس، مرمت کی مد میں پانچویں حصے کی کٹوتی اور دیگر اخراجات۔ یہ ٹیکس مشورہ نہیں، اور ایپ کبھی آپ کے حتمی ٹیکس کا اندازہ نہیں لگاتی۔"
      - "کھاتے، ادائیگیوں اور اخراجات کی اسپریڈشیٹ فائلیں۔"
  - id: "connection"
    heading: "عام فونز اور کمزور انٹرنیٹ کے لیے"
    status: "v1"
    body: "اسے درمیانے درجے کے اینڈرائیڈ فونز اور آتے جاتے موبائل ڈیٹا کے لیے بنایا جا رہا ہے، اور آئی فون اور ویب کے لیے بھی۔"
    points:
      - "تازہ معلومات آنے تک ایپ آخری بار لوڈ ہونے والا ڈیٹا فوراً دکھاتی ہے۔"
      - "کنکشن ٹوٹنے کی وجہ سے دو بار بھیجی گئی ادائیگی بھی صرف ایک بار درج ہوتی ہے۔"
      - "تصویریں اپ لوڈ ہونے سے پہلے فون پر ہی چھوٹی کر دی جاتی ہیں۔"
  - id: "languages"
    heading: "اردو اور انگریزی برابر"
    status: "v1"
    body: "ایپ پہلی بار کھولتے وقت کوئی بھی زبان چنیں۔ اردو دائیں سے بائیں، نستعلیق میں، آرام سے پڑھے جانے والے سائز میں ہے۔"
    points:
      - "ہر اسکرین، رسید اور اسٹیٹمنٹ دونوں زبانوں میں۔"
      - "رقمیں ایسے ہندسوں میں جو کالم میں سیدھے رہیں، اور چاہیں تو لاکھ اور کروڑ میں۔"
      - "اردو ہندسوں میں لکھی رقمیں اور نمبر بھی سمجھے جاتے ہیں۔"
  - id: "later"
    heading: "ورژن 1.0 کے بعد"
    status: "later"
    body: "یہ پہلے اجرا کے بعد کے لیے طے ہیں۔ یہ ورژن 1.0 کا حصہ نہیں۔"
    points:
      - "کرایہ داروں کے لیے ایک لنک جس سے وہ اپنا کھاتہ اور رسیدیں دیکھ سکیں، بدل نہ سکیں۔"
      - "واٹس ایپ بزنس سروس کے ذریعے خود بخود بھیجی جانے والی یاد دہانیاں، جب یہ سروس فعال ہو جائے۔"
      - "آپ کے فون پر نوٹیفکیشن۔"
      - "ہاسٹل اور پیئنگ گیسٹ کے لیے الگ طریقہ، جس میں بہت سے بستروں کا ایک مہینے کا کرایہ جلدی سے درج ہو سکے۔"
      - "رخصتی کے وقت تصویروں کے ساتھ جانچ کی فہرست۔"
      - "کرایہ داری ختم ہونے کے کچھ مہینے بعد شناختی دستاویزات کا خود بخود حذف ہونا۔"
closing:
  heading: "دیکھیں یہ سب کیسے جڑتا ہے"
  body: "جائیداد شامل کرنے سے لے کر اپنے مشیر کو ٹیکس سال کی اسٹیٹمنٹ دینے تک، قدم بہ قدم۔"
