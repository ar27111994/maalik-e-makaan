title: "فیچرز"
description: "مالکِ مکان ایپ آج کیا کرتی ہے: رسیدوں کے ساتھ کرائے کا کھاتہ، واٹس ایپ پر یاد دہانیاں، نگرانوں کے لیے رول، قانونی ریکارڈ، رپورٹیں اور اردو۔"
heading: "فیچرز"
intro: "نیچے دی گئی ہر چیز آج ایپ میں موجود ہے، سوائے آخری حصے کے، جو ہم اگلے ورژنوں میں لانا چاہتے ہیں۔ ہر فیچر ویسے ہی لکھا ہے جیسے وہ آج ویب پر اور آپ کے فون پر کام کرتا ہے۔"
status:
  v1: "ایپ میں موجود"
  later: "بعد میں"
  note: "ورژن 1.0، 9 نومبر 2026 کو جاری ہوا، اور ایپ ابھی شروعاتی دور میں مفت ہے۔ آگے کیا آ رہا ہے، یہ روڈ میپ کے صفحے پر ہے۔ ہر ورژن میں کیا بدلا، یہ ہر ورژن کی تبدیلیوں کے صفحے پر ہے۔"
sections:
  - id: "ledger"
    heading: "نمبر والی رسیدوں کے ساتھ کرائے کا کھاتہ"
    status: "v1"
    body: "ہر جائیداد اور کرایہ دار کا ایک ہی کھاتہ، پائی پائی کے درست حساب کے ساتھ۔ کرایہ ہر مہینے خود بخود لگ جاتا ہے۔ ہر ادائیگی پہلے سب سے پرانے چارج میں لگتی ہے، جب تک آپ خود نہ چنیں کہ وہ کن چارجز میں لگے۔ ایپ صرف ادائیگیوں کا ریکارڈ رکھتی ہے، پیسوں کا لین دین نہیں کرتی۔ لین دین ویسے ہی ہوتا ہے جیسے ہمیشہ سے ہوتا آیا ہے۔"
    points:
      - "ہر جاری کرایہ داری میں ماہانہ کرایہ خود بخود لگتا ہے، اور چاہیں تو پہلے مہینے کا کرایہ دنوں کے حساب سے۔"
      - "نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ، چیک یا کارڈ سے ادائیگیاں، ہر ایک حوالہ نمبر کے ساتھ، اور چاہیں تو ثبوت کی تصویر بھی۔"
      - "کچھ حصہ ادا کرنا، رقم پہلے دے دینا، اور زیادہ دی گئی رقم (کریڈٹ) جو خود بخود اگلے چارجز میں لگ جاتی ہے۔"
      - "ہر ادائیگی کی نمبر والی پی ڈی ایف رسید، اردو یا انگریزی میں، جو آپ واٹس ایپ پر بھیج سکتے ہیں۔ ہر سال نمبر ایک کے بعد ایک چلتے ہیں، بیچ میں کوئی نمبر خالی نہیں رہتا۔"
      - "ہر کرایہ داری کی اپنی شرائط کے مطابق لیٹ فیس، جو کسی بھی لیٹ مہینے پر ایک سے زیادہ بار نہیں لگتی۔ اور سیکیورٹی ڈپازٹ کا حساب، ملنے سے لے کر واپس کرنے تک۔"
      - "رقم کی کوئی انٹری ڈیلیٹ نہیں ہوتی۔ غلطی ہو تو آپ وجہ لکھ کر انٹری کینسل کرتے ہیں، اور آڈٹ ریکارڈ میں رہتا ہے کہ کس نے اور کب کینسل کی۔"
  - id: "reminders"
    heading: "یاد دہانیاں جو آپ کے اپنے واٹس ایپ سے جائیں"
    status: "v1"
    body: "ایپ یاد دہانی لکھ کر کرایہ دار کے نمبر پر واٹس ایپ میں کھول دیتی ہے۔ آپ اسے اپنے نمبر سے بھیجتے ہیں، اور فی پیغام کوئی خرچ نہیں۔"
    points:
      - "تیار یاد دہانیاں: جب کرائے کی تاریخ قریب ہو، آج ہو یا گزر چکی ہو، جب ادائیگی مل جائے، اور بجلی، گیس، پانی یا انٹرنیٹ کے بل کے لیے۔"
      - "ہر یاد دہانی اردو، انگریزی یا رومن اردو میں۔"
      - "رات گئے یا جمعے کی نماز کے وقت ذرا انتظار کرنے کا نرم مشورہ۔"
      - "ایپ میں روزانہ کی فہرست کہ کن باتوں پر دھیان دیں: جس کرائے کی تاریخ آ گئی یا جو لیٹ ہے، ختم ہوتے کرایہ نامے، کرایہ بڑھنے کی تاریخیں، باقی پولیس رجسٹریشن، ایکسپائر ہوتے شناختی کارڈ، اور جو بل ادا نہیں ہوئے۔"
  - id: "team"
    heading: "منیجر، اکاؤنٹنٹ اور اوورسیز مالک"
    status: "v1"
    body: "آپ کا ہاتھ بٹانے والوں کو ان کا اپنا رول دیں، تاکہ مالک کہیں سے بھی ان کے ہاتھ سے گزرنے والا ہر روپیہ دیکھ سکے۔"
    points:
      - "چار رول: مالک، منیجر (کوئی نگران یا رشتہ دار)، اکاؤنٹنٹ، اور صرف دیکھنے والا۔ ہر رول کو صرف وہی اجازت ملتی ہے جو اس کے کام کے لیے چاہیے۔"
      - "دعوت ایک ایسے لنک سے جاتی ہے جو صرف ایک بار کام کرتا ہے۔ آپ اسے ای میل سے بھیجیں یا واٹس ایپ پر دے دیں۔ یہ لنک سات دن بعد کام کرنا بند کر دیتا ہے۔"
      - "ہر ممبر کے ہاتھ میں نقدی کا حساب، اور نگران سے مالک کو آگے دی گئی نقدی کا ریکارڈ۔"
      - "ایپ ریکارڈ اور رقم کی ہر تبدیلی لکھ لیتی ہے: کس نے کی اور کب۔ یہ تفصیل ابھی ایپ کی کسی اسکرین پر نظر نہیں آتی۔"
  - id: "compliance"
    heading: "پولیس رجسٹریشن، کرایہ نامہ، بل اور کنکشن"
    status: "v1"
    body: "پاکستان میں کرایہ داری کے لیے جو کاغذات چاہییں، وہ اسی کرایہ داری کے ساتھ رکھیں، اور دیکھیں کہ کون سا کام ابھی نہیں ہوا۔"
    points:
      - "ہر کرایہ داری کی پولیس رجسٹریشن: اسٹیٹس، کس ذریعے سے ہوئی، حوالہ نمبر اور تاریخ۔ ہر صوبے کے اصولوں کے حساب سے آخری تاریخ۔ اور پنجاب، سندھ اور اسلام آباد پولیس کے پورٹلز کے سیدھے لنک۔"
      - "کرایہ نامہ: دستخط کی تاریخ، ای اسٹامپ نمبر اور رقم، پنجاب کے رینٹ رجسٹرار کے پاس رجسٹریشن کا اسٹیٹس اور نمبر، جگہ کس کام کے لیے استعمال ہو سکتی ہے، اور آگے کرائے پر دینے کی رضامندی۔"
      - "ہر جائیداد یا یونٹ کے بجلی، گیس، پانی اور انٹرنیٹ کنکشن، ماہانہ بل، کرایہ دار کے آنے اور جانے کے وقت میٹر ریڈنگ، اور بجلی کے 200 یونٹ والے پروٹیکٹڈ ٹیرف کی حد کے قریب پہنچنے پر وارننگ۔"
      - "کرایہ دار کی تفصیلات: شناختی کارڈ نمبر، جسے ایپ چیک کرتی ہے اور اسکرین پر چھپا کر رکھتی ہے۔ ساتھ رہنے والے بالغ لوگ، حوالے، اور تفصیلات رکھنے کی رضامندی، تاریخ کے ساتھ۔"
  - id: "reports"
    heading: "ڈیش بورڈ، اسٹیٹمنٹ اور ٹیکس سال"
    status: "v1"
    body: "ایک نظر میں اپنا حساب دیکھیں۔ اپنے مشیر کو جو نمبر چاہییں، وہ کچھ بھی دوبارہ لکھے بغیر دے دیں۔"
    points:
      - "ایک ڈیش بورڈ پر سب کچھ: اس مہینے کتنا کرایہ آنا ہے اور کتنا مل چکا، کس کے ذمے کتنا باقی ہے اور کب سے، کون سے یونٹ خالی ہیں اور کون سے کرائے پر، اور آگے کیا کام آ رہے ہیں۔"
      - "ہر کرایہ دار کے چارجز، ادائیگیوں اور رسید نمبروں کی اسٹیٹمنٹ، جو جھگڑا ہو تو کام آئے۔"
      - "اوورسیز مالک کے لیے ماہانہ اسٹیٹمنٹ۔"
      - "ہر جائیداد یا یونٹ کے خرچے، رسید کی تصویر کے ساتھ۔ اور مرمت کی درخواستیں، شکایت سے لے کر کام مکمل ہونے تک۔"
      - "ہر جائیداد کی جولائی سے جون کے ٹیکس سال کی اسٹیٹمنٹ: پورا کرایہ (ٹیکس کٹنے سے پہلے)، دفعہ 155 کے تحت کرایہ داروں کا کاٹا ہوا ٹیکس، مرمت کے لیے کرائے کا پانچواں حصہ جو ٹیکس کے حساب میں آمدنی میں سے نکلتا ہے، اور دوسرے خرچے۔ یہ ٹیکس مشورہ نہیں، اور ایپ کبھی آپ کے سال کے اصل ٹیکس کا اندازہ نہیں لگاتی۔"
      - "کھاتے، ادائیگیوں اور خرچوں کی فائلیں، جو ایکسل میں کھلتی ہیں۔"
  - id: "connection"
    heading: "عام فونز اور کمزور انٹرنیٹ کے لیے"
    status: "v1"
    body: "ہم نے ایپ درمیانے درجے کے اینڈرائیڈ فونز اور کبھی چلتے کبھی رکتے موبائل انٹرنیٹ کے لیے بنائی ہے۔ یہ فون یا کمپیوٹر کے ویب براؤزر میں بھی چلتی ہے۔"
    points:
      - "تازہ معلومات آنے تک ایپ وہی ڈیٹا فوراً دکھاتی ہے جو آخری بار لوڈ ہوا تھا۔"
      - "انٹرنیٹ ٹوٹنے سے کوئی ادائیگی دو بار چلی جائے، تب بھی وہ ایک ہی بار درج ہوتی ہے۔"
      - "ایپ تصویریں اپ لوڈ کرنے سے پہلے آپ کے فون یا کمپیوٹر پر ہی چھوٹی کر دیتی ہے۔"
  - id: "languages"
    heading: "اردو اور انگریزی، دونوں برابر"
    status: "v1"
    body: "ایپ پہلی بار کھولتے وقت کوئی بھی زبان چنیں۔ اردو دائیں سے بائیں، صاف حروف میں، اور ایسے سائز میں نظر آتی ہے جو فون پر آرام سے پڑھا جائے۔"
    points:
      - "ہر اسکرین، رسید اور اسٹیٹمنٹ دونوں زبانوں میں۔"
      - "رقمیں ایسے ہندسوں میں جو کالم میں سیدھ میں رہیں، اور چاہیں تو لاکھ اور کروڑ کے حساب سے۔"
      - "اردو ہندسوں میں لکھی گئی رقمیں اور نمبر بھی ایپ سمجھ لیتی ہے۔"
  - id: "later"
    heading: "اگلے ورژنوں میں"
    status: "later"
    body: "یہ چیزیں ہم ورژن 1.0 کے بعد لانا چاہتے ہیں، اور یہ ابھی ایپ میں نہیں۔ ان کا تازہ حال روڈ میپ کے صفحے پر ہے۔"
    points:
      - "کرایہ داروں کے لیے ایک لنک جس سے وہ اپنا کھاتہ اور رسیدیں دیکھ سکیں، بدل نہ سکیں۔"
      - "واٹس ایپ بزنس سروس کے ذریعے خود بخود جانے والی یاد دہانیاں، جب یہ سروس سیٹ اپ ہو جائے۔"
      - "آپ کے فون پر نوٹیفکیشن۔"
      - "ہاسٹل اور پیئنگ گیسٹ کے لیے الگ طریقہ، جس میں بہت سے بستروں کا ایک مہینے کا کرایہ ایک ساتھ جلدی درج ہو سکے۔"
      - "جگہ خالی کرتے وقت تصویروں کے ساتھ چیک لسٹ۔"
      - "کرایہ داری ختم ہونے کے کچھ مہینے بعد شناختی کاغذات کا خود بخود ڈیلیٹ ہونا۔"
closing:
  heading: "دیکھیں یہ سب کیسے جڑتا ہے"
  body: "جائیداد شامل کرنے سے لے کر اپنے مشیر کو ٹیکس سال کی اسٹیٹمنٹ دینے تک، قدم بہ قدم۔"
