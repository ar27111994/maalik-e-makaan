title: "خصوصیات"
description: "مالکِ مکان ایپ آج کیا کرتی ہے: رسیدوں کے ساتھ کرایے کا کھاتہ، واٹس ایپ پر یاد دہانیاں، نگرانوں کے کردار، قانونی ریکارڈ، رپورٹیں اور اردو۔"
heading: "خصوصیات"
intro: "نیچے دی گئی ہر چیز آج ایپ میں موجود ہے، سوائے آخری حصے کے، جو آئندہ ورژنز کے منصوبے میں شامل ہے۔ ہر خصوصیت اسی طرح بیان کی گئی ہے جیسے وہ آج ویب پر اور آپ کے فون پر کام کرتی ہے۔"
status:
  v1: "ایپ میں موجود"
  later: "منصوبے میں"
  note: "ورژن 1.0 کا اجرا 9 نومبر 2026 کو ہوا، اور ابتدائی رسائی کے دوران ایپ مفت ہے۔ آگے کیا آ رہا ہے، یہ آئندہ منصوبے کے صفحے پر ہے، اور ہر ورژن میں کیا بدلا، یہ ہر ورژن کی تبدیلیوں کے صفحے پر۔"
sections:
  - id: "ledger"
    heading: "نمبر والی رسیدوں کے ساتھ کرایے کا کھاتہ"
    status: "v1"
    body: "ہر جائیداد اور کرایہ دار کا ایک ہی کھاتہ، پائی پائی کے درست حساب کے ساتھ۔ کرایہ ہر مہینے خود واجب ہو جاتا ہے، اور ہر ادائیگی پہلے سب سے پرانے واجبات میں لگتی ہے، جب تک آپ خود نہ چنیں کہ وہ کن واجبات میں لگے۔ ایپ ادائیگیوں کا ریکارڈ رکھتی ہے، رقم منتقل نہیں کرتی: لین دین ویسے ہی ہوتا ہے جیسے ہمیشہ سے ہوتا آیا ہے۔"
    points:
      - "ہر جاری کرایہ داری کا ماہانہ کرایہ خود بخود واجب، اور چاہیں تو پہلے مہینے کا کرایہ دنوں کے حساب سے۔"
      - "نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ، چیک یا کارڈ سے ادائیگیاں، ہر ایک حوالہ نمبر کے ساتھ، اور چاہیں تو ثبوت کی تصویر بھی۔"
      - "جزوی ادائیگیاں، پیشگی رقم، اور وہ فاضل رقم جو خود بخود اگلے واجبات میں لگ جاتی ہے۔"
      - "ہر ادائیگی کی نمبر والی پی ڈی ایف رسید، اردو یا انگریزی میں، ہر سال ایک مسلسل سلسلے میں، جو واٹس ایپ پر بھیجی جا سکتی ہے۔"
      - "ہر کرایہ داری کی اپنی شرائط کے مطابق تاخیر کی فیس، جو کسی مہینے کے بقایا کرایے پر ایک سے زیادہ بار نہیں لگتی، اور زرِ ضمانت کا وصولی سے واپسی تک حساب۔"
      - "کوئی مالی اندراج مٹایا نہیں جاتا: غلطی وجہ لکھ کر منسوخ کی جاتی ہے، اور آڈٹ ریکارڈ میں محفوظ رہتا ہے کہ کس نے اور کب منسوخ کی۔"
  - id: "reminders"
    heading: "یاد دہانیاں جو آپ کے اپنے واٹس ایپ سے جائیں"
    status: "v1"
    body: "ایپ یاد دہانی لکھ کر کرایہ دار کے نمبر پر واٹس ایپ میں کھول دیتی ہے؛ آپ اسے اپنے نمبر سے بھیجتے ہیں، اور فی پیغام کوئی خرچ نہیں۔"
    points:
      - "جلد واجب ہونے والے، آج واجب اور تاخیر والے کرایے کے لیے، موصول ہونے والی ادائیگی کے لیے اور بجلی گیس کے بل کے لیے تیار یاد دہانیاں۔"
      - "ہر یاد دہانی اردو، انگریزی یا رومن اردو میں۔"
      - "رات گئے یا جمعے کی نماز کے وقت ذرا انتظار کرنے کا نرم مشورہ۔"
      - "ایپ میں روزانہ کی فہرست کہ کن باتوں پر توجہ چاہیے: واجب اور تاخیر والا کرایہ، ختم ہوتے معاہدے، کرایے میں اضافے جن کا وقت آ گیا ہے، زیرِ التوا پولیس رجسٹریشن، میعاد ختم ہوتے شناختی کارڈ اور ادا نہ ہونے والے بل۔"
  - id: "team"
    heading: "نگران، اکاؤنٹنٹ اور بیرونِ ملک مقیم مالکان"
    status: "v1"
    body: "آپ کا ہاتھ بٹانے والوں کو ان کا اپنا کردار دیں، تاکہ مالک کہیں سے بھی ان کے ہاتھ سے گزرنے والا ہر روپیہ دیکھ سکے۔"
    points:
      - "چار کردار: مالک، منیجر (نگران یا رشتہ دار)، اکاؤنٹنٹ اور ناظر (جو صرف دیکھ سکے)، ہر ایک کو صرف وہی اجازت جو اس کے کردار کو درکار ہو۔"
      - "ایک بار استعمال ہونے والے لنک کے ذریعے دعوت، جو ای میل سے بھیجا جاتا ہے یا واٹس ایپ پر دیا جا سکتا ہے، اور جس کی میعاد سات دن بعد ختم ہو جاتی ہے۔"
      - "ہر رکن کے پاس موجود نقدی، اور نگران سے مالک کو رقم کی حوالگی کا ریکارڈ۔"
      - "ریکارڈ اور رقم میں ہر تبدیلی محفوظ ہوتی ہے، اس تفصیل کے ساتھ کہ کس نے کی اور کب۔ یہ تفصیل ابھی ایپ کی کسی اسکرین پر نظر نہیں آتی۔"
  - id: "compliance"
    heading: "پولیس رجسٹریشن، کرایہ نامہ اور بجلی گیس کے بل"
    status: "v1"
    body: "پاکستانی کرایہ داری کے لیے درکار کاغذات اسی کرایہ داری کے ساتھ رکھیں، اور دیکھیں کہ کیا ابھی باقی ہے۔"
    points:
      - "ہر کرایہ داری کی پولیس رجسٹریشن: صورتِ حال، ذریعہ، حوالہ نمبر اور تاریخ، ہر صوبے کے قواعد کے مطابق آخری تاریخ، اور پنجاب، سندھ اور اسلام آباد پولیس کے پورٹلز کے براہِ راست لنک۔"
      - "کرایہ نامہ: دستخط کی تاریخ، ای اسٹامپ نمبر اور رقم، پنجاب کے رینٹ رجسٹرار کے ہاں صورتِ حال اور رجسٹریشن نمبر، اجازت شدہ استعمال اور آگے کرایے پر دینے کی رضامندی۔"
      - "ہر جائیداد یا یونٹ کے بجلی، گیس، پانی اور انٹرنیٹ کنکشن، ماہانہ بل، کرایہ دار کے آنے اور جانے کے وقت میٹر ریڈنگ، اور بجلی کے 200 یونٹ والے پروٹیکٹڈ ٹیرف کی حد کے قریب پہنچنے پر انتباہ۔"
      - "کرایہ دار کی تفصیلات، جن میں شناختی کارڈ نمبر جانچا جاتا ہے اور اسکرین پر چھپا رہتا ہے، ساتھ رہنے والے بالغ افراد، حوالہ جات، اور تفصیلات محفوظ رکھنے کی رضامندی تاریخ کے ساتھ۔"
  - id: "reports"
    heading: "ڈیش بورڈ، اسٹیٹمنٹ اور ٹیکس سال"
    status: "v1"
    body: "ایک نظر میں اپنی صورتِ حال دیکھیں، اور اپنے مشیر کو درکار اعداد و شمار کچھ بھی دوبارہ لکھے بغیر دے دیں۔"
    points:
      - "اس مہینے متوقع اور وصول شدہ کرایہ، کس کے ذمے کتنا اور کب سے، خالی اور بھرے یونٹ، اور آنے والے کام، سب ایک ڈیش بورڈ پر۔"
      - "ہر کرایہ دار کے واجبات، ادائیگیوں اور رسید نمبروں کی اسٹیٹمنٹ، کسی تنازع کے حل کے لیے۔"
      - "بیرونِ ملک مقیم مالک کے لیے ماہانہ اسٹیٹمنٹ۔"
      - "ہر جائیداد یا یونٹ کے اخراجات، رسید کی تصویر کے ساتھ، اور مرمت کی درخواستیں، شکایت سے لے کر کام مکمل ہونے تک۔"
      - "ہر جائیداد کی جولائی سے جون کے ٹیکس سال کی اسٹیٹمنٹ: مجموعی کرایہ، دفعہ 155 کے تحت کرایہ داروں کا کاٹا ہوا ٹیکس، مرمت کی مد میں پانچویں حصے کی کٹوتی اور دیگر اخراجات۔ یہ ٹیکس مشورہ نہیں، اور ایپ کبھی آپ کے حتمی ٹیکس کا اندازہ نہیں لگاتی۔"
      - "کھاتے، ادائیگیوں اور اخراجات کی اسپریڈشیٹ (سی ایس وی) فائلیں۔"
  - id: "connection"
    heading: "عام فونز اور کمزور انٹرنیٹ کے لیے"
    status: "v1"
    body: "ایپ درمیانے درجے کے اینڈرائیڈ فونز اور کبھی چلتے کبھی رکتے موبائل انٹرنیٹ کو سامنے رکھ کر بنائی گئی ہے، اور یہ فون یا کمپیوٹر کے ویب براؤزر میں بھی چلتی ہے۔"
    points:
      - "تازہ معلومات آنے تک ایپ آخری بار لوڈ ہونے والا ڈیٹا فوراً دکھاتی ہے۔"
      - "کنکشن ٹوٹنے کی وجہ سے دو بار بھیجی گئی ادائیگی بھی صرف ایک بار درج ہوتی ہے۔"
      - "تصویریں اپ لوڈ ہونے سے پہلے آپ کے فون یا کمپیوٹر پر ہی چھوٹی کر دی جاتی ہیں۔"
  - id: "languages"
    heading: "اردو اور انگریزی، دونوں برابر"
    status: "v1"
    body: "ایپ پہلی بار کھولتے وقت کوئی بھی زبان چنیں۔ اردو دائیں سے بائیں، نستعلیق میں اور آرام سے پڑھے جانے والے سائز میں دکھائی دیتی ہے۔"
    points:
      - "ہر اسکرین، رسید اور اسٹیٹمنٹ دونوں زبانوں میں۔"
      - "رقمیں ایسے ہندسوں میں جو کالم میں سیدھ میں رہیں، اور چاہیں تو لاکھ اور کروڑ کے حساب سے۔"
      - "اردو ہندسوں میں لکھی گئی رقمیں اور نمبر بھی ایپ سمجھ لیتی ہے۔"
  - id: "later"
    heading: "آئندہ ورژنز کے منصوبے"
    status: "later"
    body: "یہ چیزیں ورژن 1.0 کے بعد کے منصوبے میں شامل ہیں اور ابھی ایپ میں موجود نہیں۔ تازہ ترین صورتِ حال آئندہ منصوبے کے صفحے پر ہے۔"
    points:
      - "کرایہ داروں کے لیے ایک لنک جس سے وہ اپنا کھاتہ اور رسیدیں دیکھ سکیں، بدل نہ سکیں۔"
      - "واٹس ایپ بزنس سروس کے ذریعے خود بخود بھیجی جانے والی یاد دہانیاں، جب یہ سروس فعال ہو جائے۔"
      - "آپ کے فون پر نوٹیفکیشن۔"
      - "ہاسٹل اور پیئنگ گیسٹ کے لیے الگ طریقہ، جس میں بہت سے بستروں کا ایک مہینے کا کرایہ ایک ساتھ جلدی درج ہو سکے۔"
      - "مکان خالی کرتے وقت تصویروں کے ساتھ جانچ کی فہرست۔"
      - "کرایہ داری ختم ہونے کے کچھ مہینے بعد شناختی دستاویزات کا خود بخود حذف ہونا۔"
closing:
  heading: "دیکھیں یہ سب کیسے جڑتا ہے"
  body: "جائیداد شامل کرنے سے لے کر اپنے مشیر کو ٹیکس سال کی اسٹیٹمنٹ دینے تک، قدم بہ قدم۔"
