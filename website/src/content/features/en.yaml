# The features page (/features/). Its Urdu twin is ur.yaml; keep both in step.
# Every point is a requirement of version 1.0 in .planning/REQUIREMENTS.md and
# is in the released app, except the "later" section, which is its Should-Have
# list and points to the roadmap page (/roadmap/). Where a requirement is only
# partly built (◐), the point says what is there today. British English.
title: "Features"
description: "What Maalik-e-Makaan does today: a rent ledger with receipts, WhatsApp reminders, caretaker roles, compliance records, reports and Urdu."
heading: "Features"
intro: "Every section below is in the app today, apart from the last, which is planned for later versions. Each feature is described as it works now, on the web and on your phone."
status:
  v1: "In the app"
  later: "Planned"
  note: "Version 1.0 was released on 9 November 2026, and the app is free while it is in early access. What is planned next is on the roadmap page, and what changed in each version is in the release notes."
sections:
  - id: "ledger"
    heading: "A rent ledger with numbered receipts"
    status: "v1"
    body: "One ledger for every property and tenant, kept exactly to the paisa. Rent falls due by itself each month, and every payment goes to the oldest dues first, unless you choose which dues it pays. Payments are recorded, not processed: the money changes hands the way it always has."
    points:
      - "Monthly rent due automatically for every active tenancy, with an optional part-month charge for the first month."
      - "Payments by cash, bank transfer, Raast, JazzCash, Easypaisa, cheque or card, each with a reference and an optional photo of the proof."
      - "Part payments, advances and credit that is applied to the next dues by itself."
      - "A numbered PDF receipt for every payment, in English or Urdu, in an unbroken series each year, to share on WhatsApp."
      - "Late fees by each tenancy's own terms, charged at most once for each overdue month, and the security deposit from receipt to refund."
      - "Nothing financial is deleted: a mistake is cancelled with a reason, and the audit trail keeps who cancelled it and when."
  - id: "reminders"
    heading: "Reminders that go from your own WhatsApp"
    status: "v1"
    body: "The app writes the reminder and opens it in WhatsApp, addressed to the tenant; you send it from your own number, with no charge per message."
    points:
      - "Ready-made reminders for rent due soon, due today and overdue, for a payment received and for a utility bill."
      - "Every reminder in English, Urdu or Roman Urdu."
      - "A gentle suggestion to wait when it is late at night or time for Friday prayers."
      - "A daily list in the app of what needs attention: rent due and overdue, agreements ending, rent increases due, police registrations pending, CNICs expiring and unpaid bills."
  - id: "team"
    heading: "Caretakers, accountants and overseas owners"
    status: "v1"
    body: "Give the people who help you a role of their own, so the owner can see every rupee they handle, from anywhere."
    points:
      - "Four roles: owner, manager (a caretaker or relative), accountant and viewer, each allowed only what the role needs."
      - "Invitations through a single-use link, sent by email or shared on WhatsApp, that expires after seven days."
      - "Cash in hand for each member, and handovers from a caretaker to the owner."
      - "Every change to the records and the money is logged with who made it and when. The app does not show this log on a screen yet."
  - id: "compliance"
    heading: "Police registration, agreements and utilities"
    status: "v1"
    body: "Keep the paperwork that Pakistani tenancies need with the tenancy itself, and see what is still pending."
    points:
      - "Police registration for each tenancy: status, channel, reference number and date, a deadline worked out from each province's rules, and direct links to the Punjab, Sindh and Islamabad police portals."
      - "The rent agreement: the date signed, the e-stamp number and amount, Punjab Rent Registrar status and registration number, permitted use and subletting consent."
      - "Electricity, gas, water and internet connections for each property or unit, with monthly bills, meter readings at move-in and move-out, and a warning near the 200-unit protected electricity tariff."
      - "Tenant details with the CNIC checked and masked on screen, adults living with the tenant, references, and consent to keep the details recorded with a date."
  - id: "reports"
    heading: "Dashboard, statements and the tax year"
    status: "v1"
    body: "See where you stand at a glance, and hand your adviser the figures they need, without retyping anything."
    points:
      - "A dashboard of rent expected and collected this month, who owes what and since when, occupancy and what is coming up."
      - "A statement of each tenant's dues, payments and receipt numbers, to settle a dispute."
      - "A monthly statement for an overseas owner."
      - "Expenses for each property or unit, with a photo of the receipt, and maintenance requests from the first report to the finished repair."
      - "A July–June tax-year statement for each property: gross rent, tax withheld by tenants under section 155, the one-fifth repairs allowance and other expenses. It is not tax advice, and the app never estimates your final tax."
      - "Spreadsheet (CSV) exports of the ledger, payments and expenses."
  - id: "connection"
    heading: "Made for real phones and patchy connections"
    status: "v1"
    body: "It is made for mid-range Android phones and mobile data that comes and goes, and it also works in a web browser on a phone or a computer."
    points:
      - "The last data the app loaded shows straight away while it refreshes."
      - "A payment sent twice because the connection dropped is still recorded only once."
      - "Photos are made smaller on your phone or computer before they upload."
  - id: "languages"
    heading: "Urdu and English as equals"
    status: "v1"
    body: "Choose either language when you first open the app. Urdu reads right to left in Nastaliq, at a size that is comfortable to read."
    points:
      - "Every screen, receipt and statement in both languages."
      - "Amounts in figures that line up, with lakh and crore if you prefer them."
      - "Amounts and numbers typed in Urdu digits are understood too."
  - id: "later"
    heading: "Planned for later versions"
    status: "later"
    body: "These are planned after version 1.0 and are not in the app yet. The roadmap page has the latest plans."
    points:
      - "A read-only link for tenants to see their own ledger and receipts."
      - "Reminders sent automatically through the WhatsApp Business service, once it is set up."
      - "Notifications on your phone."
      - "A hostel and paying-guest mode, with a quick way to record a month's rent for many beds."
      - "A move-out checklist with photos."
      - "Removing identity documents automatically some months after a tenancy ends."
closing:
  heading: "See how it fits together"
  body: "From adding a property to handing your adviser the tax-year statement, step by step."
  cta:
    label: "How it works"
    href: "/how-it-works/"
