title: "ایپ کیسے کام کرتی ہے"
description: "مالکِ مکان ایپ قدم بہ قدم کیسے کام کرتی ہے: اکاؤنٹ بنائیں، جائیدادیں اور کرایہ دار شامل کریں، ادائیگی درج کر کے رسید بھیجیں، اور باقی رقم اور کاغذات پر نظر رکھیں۔"
heading: "ایپ کیسے کام کرتی ہے"
intro: "ورژن 1.0 جاری ہو چکا ہے، اور ایپ ابھی شروعاتی دور میں مفت ہے۔ یہ وہ قدم ہیں جو ایک مالکِ مکان پہلے دن سے ٹیکس سال کے آخر تک اٹھاتا ہے۔"
steps:
  - heading: "اکاؤنٹ اور اپنا پورٹ فولیو بنائیں"
    body: "فون یا کمپیوٹر کے کسی بھی براؤزر میں ویب ایپ کھولیں، یا اینڈرائیڈ ایپ انسٹال کریں۔ اردو یا انگریزی چنیں، اور اپنی ای میل اور پاس ورڈ سے اکاؤنٹ بنائیں۔ پھر اپنا پورٹ فولیو بنائیں، یعنی آپ کی سب جائیدادیں، ایک جگہ۔ اس میں آپ کی جائیدادیں، کرایہ دار اور رقموں کا حساب رہتا ہے۔"
    points:
      - "اینڈرائیڈ کے لیے انسٹال کرنے والی فائلیں گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں، اور ایپ گوگل پلے پر بھی آئے گی۔"
      - "آئی فون پر ویب ایپ براؤزر میں چلتی ہے۔ جب تک ایپ اسٹور پر ایپ نہیں آتی، ٹیسٹ کرنے والے گٹ ہب سے بغیر دستخط کا ورژن بھی انسٹال کر سکتے ہیں۔ اس کے لیے وہ اسے اپنے ایپل اکاؤنٹ سے دستخط کرتے ہیں۔"
      - "شروع کرنے سے پہلے آپ اپنی ای میل کی تصدیق کرتے ہیں۔ پاس ورڈ بھول جائیں تو نیا بنا سکتے ہیں۔"
      - "کسی رشتہ دار کا مکان، یا الگ حساب والا پلازہ، الگ پورٹ فولیو میں رکھیں۔"
      - "آپ سائن اِن رہتے ہیں۔ سائن آؤٹ کریں تو ایپ نے جو ریکارڈ آپ کے فون یا کمپیوٹر پر رکھا تھا، وہ صاف ہو جاتا ہے۔"
  - heading: "اپنی جائیدادیں اور یونٹ شامل کریں"
    body: "ایک مکان، پورشنوں یا فلیٹوں کی عمارت، دکانوں کا پلازہ، یا کمروں اور بستروں والا ہاسٹل۔ ہر جائیداد اس کے صوبے کے ساتھ شامل کریں۔ پھر اس کے اندر کے یونٹ شامل کریں، اور ہر ایک کا وہ کرایہ جو آپ مانگتے ہیں۔"
    points:
      - "صوبے سے طے ہوتا ہے کہ پولیس رجسٹریشن کتنے وقت کے اندر کروانی ہے۔"
      - "ہر یونٹ بتاتا ہے کہ وہ کرائے پر ہے، خالی ہے (اور کب سے)، یا دستیاب نہیں۔"
  - heading: "ہر کرایہ دار اور کرایہ داری شامل کریں"
    body: "کرایہ دار کی تفصیلات اور جو شرائط طے ہوئیں، وہ درج کریں: کرایہ، کرایہ دینے کی تاریخ، تاریخ کے کتنے دن بعد لیٹ فیس لگے، سیکیورٹی ڈپازٹ، سالانہ اضافہ، لیٹ فیس (اگر ہو) اور نوٹس کی مدت۔"
    points:
      - "شناختی کارڈ نمبر اسکرین پر تب تک چھپا رہتا ہے جب تک آپ اسے دکھانا نہ چاہیں، اور شناختی کارڈ کی تصویریں نجی اسٹوریج میں رہتی ہیں۔"
      - "برسوں پرانا کرایہ دار شامل کر رہے ہیں؟ ایپ میں کرایہ اسی مہینے سے لگانا شروع کریں۔"
      - "ایک یونٹ پر دو کرایہ داریاں کبھی ایک ساتھ نہیں چل سکتیں۔"
  - heading: "کاغذات مکمل رکھیں"
    body: "ہر کرایہ داری کے ساتھ اس کی پولیس رجسٹریشن اور کرایہ نامہ درج رہتا ہے۔ ایپ بتاتی ہے کہ آپ کے صوبے میں پولیس رجسٹریشن کی آخری تاریخ کیا ہے، اور کون سی رجسٹریشن ابھی نہیں ہوئی۔"
    points:
      - "پنجاب، سندھ اور اسلام آباد میں ایک لنک سے پولیس رجسٹریشن کی ویب سائٹ کھل جاتی ہے۔"
      - "جہاں ہمیں ایسا کوئی قانون نہیں ملا جو آخری تاریخ دے، وہاں ایپ کرایہ دار کو جگہ ملنے کے ایک دن بعد یاد دلاتی ہے۔ یہ صرف ایپ کی یاد دہانی ہے۔"
      - "کرایہ نامے کے ای اسٹامپ اور پنجاب کے رینٹ رجسٹرار کی تفصیلات مکمل ہوتے ہی شامل کریں، اور ساتھ کاغذات کی تصویریں یا پی ڈی ایف بھی۔"
  - heading: "اپنا ہاتھ بٹانے والوں کو دعوت بھیجیں"
    body: "اگر چاہیں تو کسی رشتہ دار، نگران یا اکاؤنٹنٹ کو ای میل سے دعوت بھیجیں، ان کے اپنے رول کے ساتھ۔ لنک صرف ایک بار، سات دن تک اور صرف اسی ای میل کے لیے کام کرتا ہے۔ آپ اسے واٹس ایپ پر بھی بھیج سکتے ہیں۔"
    points:
      - "منیجر جائیدادیں سنبھالتا ہے اور رقمیں درج کرتا ہے۔ اکاؤنٹنٹ ادائیگیاں اور خرچے درج کرتا ہے۔ صرف دیکھنے والا بس دیکھ سکتا ہے، کچھ بدل نہیں سکتا۔"
      - "اوورسیز مالک دیکھ سکتا ہے کہ نگران کے پاس کتنی نقدی ہے، اور آگے دی گئی ہر نقدی بھی۔ وہ مالک کی ماہانہ اسٹیٹمنٹ بھی ڈاؤن لوڈ کر سکتا ہے۔"
  - heading: "ادائیگیاں درج کریں اور رسیدیں بھیجیں"
    body: "ہر مہینے کا کرایہ خود بخود لگ جاتا ہے۔ کرایہ نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ یا چیک سے ملے تو اسے درج کریں، اور نمبر والی رسید واٹس ایپ پر بھیج دیں۔"
    points:
      - "ایپ ادائیگیوں کا ریکارڈ رکھتی ہے، خود رقم وصول نہیں کرتی۔ لین دین ویسے ہی ہوتا ہے جیسے ہمیشہ سے ہوتا آیا ہے۔"
      - "ادائیگی پہلے سب سے پرانے چارج میں لگتی ہے، جب تک آپ خود چارج نہ چنیں۔ زیادہ دی گئی رقم کریڈٹ بن کر اگلے چارجز کے لیے رہتی ہے۔"
      - "ہر رسید آپ اردو یا انگریزی میں بھیج سکتے ہیں۔"
      - "کوئی کمپنی یا سرکاری دفتر ٹیکس کاٹے تو اسے سرٹیفکیٹ نمبر کے ساتھ درج کریں۔ ملی ہوئی نقد رقم اور کٹا ہوا ٹیکس مل کر کرایہ پورا کرتے ہیں۔"
      - "غلط انٹری آپ وجہ لکھ کر کینسل کرتے ہیں۔ وہ ڈیلیٹ نہیں ہوتی، ریکارڈ میں رہتی ہے۔"
  - heading: "جو کچھ باقی ہے، اس پر نظر رکھیں"
    body: "ایپ ہر روز بتاتی ہے کہ کن باتوں پر دھیان دیں: جس کرائے کی تاریخ آ گئی یا جو لیٹ ہے، باقی پولیس رجسٹریشن، ختم ہوتے کرایہ نامے، کرایہ بڑھنے کی تاریخیں، ایکسپائر ہوتے شناختی کارڈ، اور جو بل ادا نہیں ہوئے۔ ڈیش بورڈ پر نظر آتا ہے کہ کس کے ذمے کتنا باقی ہے اور کب سے۔"
    points:
      - "اپنے واٹس ایپ سے اردو، انگریزی یا رومن اردو میں نرم لہجے کی یاد دہانی بھیجیں۔"
      - "رات گئے یا نمازِ جمعہ کے وقت ایپ مشورہ دیتی ہے کہ یاد دہانی ذرا بعد میں بھیجیں۔"
      - "کرایہ داری کا ہر سال مکمل ہونے پر ایپ نیا کرایہ تجویز کرتی ہے۔"
  - heading: "سال کا حساب مکمل کریں"
    body: "30 جون کے بعد ہر جائیداد کی ٹیکس سال کی اسٹیٹمنٹ اپنے ٹیکس مشیر کے لیے ڈاؤن لوڈ کریں۔ یہ پی ڈی ایف میں بھی ملتی ہے، اور ایکسل میں کھلنے والی فائل میں بھی۔ کرایہ داروں کی اسٹیٹمنٹ اور مالک کی ماہانہ اسٹیٹمنٹ جب چاہیں نکالیں۔"
    points:
      - "ٹیکس سال کی اسٹیٹمنٹ میں یہ ہوتا ہے: پورا کرایہ (ٹیکس کٹنے سے پہلے)، کٹا ہوا ٹیکس، مرمت کے لیے کرائے کا پانچواں حصہ جو ٹیکس کے حساب میں آمدنی میں سے نکلتا ہے، اور دوسرے خرچے۔ یہ ٹیکس مشورہ نہیں، اور ایپ آپ کے سال کے اصل ٹیکس کا حساب نہیں لگاتی۔"
      - "کرایہ دار کی اسٹیٹمنٹ میں ہر چارج، ہر ادائیگی، ہر رسید نمبر اور باقی رقم لکھی ہوتی ہے۔"
closing:
  heading: "شروع کرنے کے لیے تیار ہیں؟"
  body: "اپنے فون یا کمپیوٹر پر ویب ایپ کھولیں، اپنا اکاؤنٹ بنائیں اور اپنی پہلی جائیداد شامل کریں۔ ایپ ابھی شروعاتی دور میں مفت ہے۔"
