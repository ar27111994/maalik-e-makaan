title: "طریقۂ کار"
description: "مالکِ مکان کا ورژن 1.0 کیسے کام کرے گا، قدم بہ قدم: جائیدادیں اور کرایہ دار شامل کریں، ادائیگیاں درج کر کے رسیدیں بھیجیں، واجبات اور کاغذات پر نظر رکھیں۔"
heading: "طریقۂ کار"
intro: "ورژن 1.0 ابھی تیار ہو رہا ہے۔ یہ وہ مراحل ہیں جن سے مالکِ مکان پہلے دن سے ٹیکس سال کے اختتام تک گزرے گا۔"
steps:
  - heading: "اپنی زبان چنیں اور اکاؤنٹ بنائیں"
    body: "ایپ پہلی بار کھولتے وقت اردو یا انگریزی چنیں، اور اپنے ای میل پتے اور پاس ورڈ سے اکاؤنٹ بنائیں۔"
    points:
      - "اکاؤنٹ استعمال ہونے سے پہلے آپ کا ای میل تصدیق کیا جاتا ہے، اور بھولا ہوا پاس ورڈ دوبارہ بنایا جا سکتا ہے۔"
      - "آپ فون پر سائن ان رہتے ہیں، اور سائن آؤٹ کرنے پر ایپ کا محفوظ کیا ہوا ریکارڈ فون سے صاف ہو جاتا ہے۔"
  - heading: "اپنی جائیدادیں اور یونٹ شامل کریں"
    body: "ایک مکان، پورشنوں یا فلیٹوں کی عمارت، دکانوں کا پلازہ، یا کمروں اور بستروں والا ہاسٹل: ہر جائیداد اس کے صوبے کے ساتھ شامل کریں، پھر اس کے اندر کے یونٹ ان کے مطلوبہ کرایے کے ساتھ۔"
    points:
      - "صوبے سے طے ہوتا ہے کہ پولیس رجسٹریشن کی کون سی مہلت لاگو ہوگی۔"
      - "ہر یونٹ بتاتا ہے کہ وہ کرایے پر ہے، خالی ہے (اور کب سے)، یا دستیاب نہیں۔"
  - heading: "ہر کرایہ دار اور کرایہ داری شامل کریں"
    body: "کرایہ دار کی تفصیلات اور طے شدہ شرائط درج کریں: کرایہ، ادائیگی کا دن، رعایتی دن، زرِ ضمانت، سالانہ اضافہ، تاخیر کی فیس اگر ہو، اور نوٹس کی مدت۔"
    points:
      - "کرایہ نامے کے ای اسٹامپ اور رینٹ رجسٹرار کی تفصیلات، اور پولیس رجسٹریشن، مکمل ہوتے ہی شامل کریں۔"
      - "برسوں پرانا کرایہ دار شامل کر رہے ہیں؟ حساب اسی مہینے سے شروع کریں۔"
      - "ایک یونٹ پر دو کرایہ داریاں کبھی ایک ساتھ نہیں چل سکتیں۔"
  - heading: "اپنا ہاتھ بٹانے والوں کو مدعو کریں"
    body: "اگر چاہیں: کسی رشتہ دار، نگران یا اکاؤنٹنٹ کو ای میل سے اس کے اپنے کردار کے ساتھ مدعو کریں، اور ان کا درج کیا ہوا سب کچھ دیکھیں۔"
    points:
      - "بیرونِ ملک مقیم مالک نگران کے پاس موجود نقدی اور ہر حوالگی دیکھ سکتا ہے۔"
  - heading: "ادائیگیاں ملتے ہی درج کریں"
    body: "ہر مہینے واجبات خود سامنے آ جاتے ہیں۔ کرایہ نقد یا ٹرانسفر سے ملے تو اسے درج کریں اور نمبر والی رسید واٹس ایپ پر بھیج دیں۔"
    points:
      - "ادائیگی پہلے سب سے پرانے واجبات چکاتی ہے؛ زائد رقم اگلے مہینے کے لیے فاضل رقم کے طور پر رہتی ہے۔"
      - "کمپنی کرایہ دار کا کاٹا ہوا ٹیکس اس کے سرٹیفکیٹ نمبر کے ساتھ درج ہوتا ہے، تاکہ مجموعی کرایہ پورا ادا شمار ہو۔"
  - heading: "واجبات پر نظر رکھیں"
    body: "ایپ ہر روز بتاتی ہے کہ کس چیز پر آپ کی توجہ چاہیے: واجب اور تاخیر شدہ کرایہ، باقی پولیس رجسٹریشن، ختم ہوتے معاہدے، واجب سالانہ اضافے اور ادا نہ ہونے والے بل۔"
    points:
      - "ایک بٹن سے اپنے واٹس ایپ سے شائستہ یاد دہانی بھیجیں۔"
      - "کرایہ داری کی سالگرہ پر ایپ نیا کرایہ تجویز کرتی ہے۔"
  - heading: "سال مکمل کریں"
    body: "30 جون کے بعد ہر جائیداد کی ٹیکس سال کی اسٹیٹمنٹ اپنے ٹیکس مشیر کے لیے ڈاؤن لوڈ کریں، اور ضرورت ہو تو کرایہ داروں کی اسٹیٹمنٹ بھی۔"
    points:
      - "اسٹیٹمنٹ میں مجموعی کرایہ، کاٹا گیا ٹیکس، مرمت کی مد میں پانچویں حصے کی کٹوتی اور اخراجات ہوتے ہیں۔ یہ ٹیکس مشورہ نہیں۔"
closing:
  heading: "شروع کرنے سے پہلے کوئی سوال؟"
  body: "ایپ کیا ریکارڈ رکھتی ہے، اسے کون دیکھ سکتا ہے، اور قانون مالکانِ مکان سے کیا تقاضا کرتا ہے۔"
