# keep both in step. Version 1.0 has been released, so each step says what the
# app does today, in the present tense. Urdu script only.
title: "طریقۂ کار"
description: "مالکِ مکان ایپ قدم بہ قدم کیسے کام کرتی ہے: اکاؤنٹ بنائیں، جائیدادیں اور کرایہ دار شامل کریں، ادائیگیاں درج کر کے رسیدیں بھیجیں، اور واجبات اور کاغذات پر نظر رکھیں۔"
heading: "طریقۂ کار"
intro: "ورژن 1.0 جاری ہو چکا ہے، اور ابتدائی رسائی کے دوران ایپ مفت ہے۔ یہ وہ مراحل ہیں جن سے ایک مالکِ مکان پہلے دن سے ٹیکس سال کے اختتام تک گزرتا ہے۔"
steps:
  - heading: "اکاؤنٹ اور اپنا پورٹ فولیو بنائیں"
    body: "فون یا کمپیوٹر کے کسی بھی براؤزر میں ویب ایپ کھولیں، یا اینڈرائیڈ ایپ انسٹال کریں۔ اردو یا انگریزی چنیں، اپنے ای میل پتے اور پاس ورڈ سے اکاؤنٹ بنائیں، اور اپنا پورٹ فولیو بنائیں: اس میں آپ کی جائیدادیں، کرایہ دار اور رقوم کا حساب رہتا ہے۔"
    points:
      - "اینڈرائیڈ کے لیے انسٹال کرنے والی فائلیں گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں، اور ایپ گوگل پلے پر بھی آئے گی۔"
      - "آئی فون پر ویب ایپ براؤزر میں چلتی ہے۔ جب تک ایپ اسٹور پر ایپ نہیں آتی، آزمائشی صارفین گٹ ہب پر موجود بغیر دستخط کا ورژن اپنے ایپل اکاؤنٹ سے دستخط کر کے انسٹال بھی کر سکتے ہیں۔"
      - "شروع کرنے سے پہلے آپ اپنے ای میل پتے کی تصدیق کرتے ہیں، اور پاس ورڈ بھول جائیں تو نیا بنا سکتے ہیں۔"
      - "کسی رشتہ دار کا مکان، یا الگ حساب والا پلازہ، ایک علیحدہ پورٹ فولیو میں رکھیں۔"
      - "آپ سائن ان رہتے ہیں، اور سائن آؤٹ کرنے پر ایپ کا محفوظ کیا ہوا ریکارڈ آپ کے فون یا کمپیوٹر سے صاف ہو جاتا ہے۔"
  - heading: "اپنی جائیدادیں اور یونٹ شامل کریں"
    body: "ایک مکان، پورشنوں یا فلیٹوں کی عمارت، دکانوں کا پلازہ، یا کمروں اور بستروں والا ہاسٹل: ہر جائیداد اس کے صوبے کے ساتھ شامل کریں، پھر اس کے اندر کے یونٹ ان کے مطلوبہ کرایے کے ساتھ۔"
    points:
      - "صوبے سے طے ہوتا ہے کہ پولیس رجسٹریشن کی کون سی مہلت لاگو ہوگی۔"
      - "ہر یونٹ بتاتا ہے کہ وہ کرایے پر ہے، خالی ہے (اور کب سے)، یا دستیاب نہیں۔"
  - heading: "ہر کرایہ دار اور کرایہ داری شامل کریں"
    body: "کرایہ دار کی تفصیلات اور طے شدہ شرائط درج کریں: کرایہ، ادائیگی کا دن، رعایتی دن، زرِ ضمانت، سالانہ اضافہ، تاخیر کی فیس (اگر ہو) اور نوٹس کی مدت۔"
    points:
      - "شناختی کارڈ نمبر اسکرین پر تب تک چھپا رہتا ہے جب تک آپ اسے دکھانا نہ چاہیں، اور شناختی کارڈ کی تصاویر نجی اسٹوریج میں رکھی جاتی ہیں۔"
      - "برسوں پرانا کرایہ دار شامل کر رہے ہیں؟ حساب اسی مہینے سے شروع کریں۔"
      - "ایک یونٹ پر دو کرایہ داریاں کبھی ایک ساتھ نہیں چل سکتیں۔"
  - heading: "کاغذات مکمل رکھیں"
    body: "ہر کرایہ داری کے ساتھ اس کی پولیس رجسٹریشن اور کرایہ نامہ درج رہتا ہے۔ ایپ بتاتی ہے کہ آپ کے صوبے میں پولیس رجسٹریشن کی مہلت کب ختم ہوتی ہے، اور کون سی رجسٹریشنیں ابھی باقی ہیں۔"
    points:
      - "پنجاب، سندھ اور اسلام آباد میں ایک لنک سے پولیس رجسٹریشن کی ویب سائٹ کھل جاتی ہے۔"
      - "جہاں ایپ کے علم میں کوئی قانون مہلت مقرر نہیں کرتا، وہاں ایپ کرایہ دار کے منتقل ہونے کے ایک دن بعد یاد دہانی کرواتی ہے۔"
      - "کرایہ نامے کے ای اسٹامپ اور پنجاب کے رینٹ رجسٹرار کی تفصیلات مکمل ہوتے ہی شامل کریں، اور ساتھ کاغذات کی تصاویر یا پی ڈی ایف بھی۔"
  - heading: "اپنا ہاتھ بٹانے والوں کو مدعو کریں"
    body: "اگر چاہیں: کسی رشتہ دار، نگران یا اکاؤنٹنٹ کو ای میل سے اس کے اپنے کردار کے ساتھ مدعو کریں۔ لنک صرف ایک بار، سات دن تک اور صرف اسی پتے کے لیے کام کرتا ہے؛ آپ اسے واٹس ایپ پر بھی بھیج سکتے ہیں۔"
    points:
      - "منیجر جائیدادیں سنبھالتا اور رقوم درج کرتا ہے، اکاؤنٹنٹ ادائیگیاں اور اخراجات درج کرتا ہے، اور ناظر صرف دیکھ سکتا ہے۔"
      - "بیرونِ ملک مقیم مالک نگران کے پاس موجود نقدی اور نقدی کی ہر حوالگی دیکھ سکتا ہے، اور مالک کی ماہانہ اسٹیٹمنٹ ڈاؤن لوڈ کر سکتا ہے۔"
  - heading: "ادائیگیاں درج کریں اور رسیدیں بھیجیں"
    body: "ہر مہینے کا کرایہ خود بخود واجب ہو جاتا ہے۔ کرایہ نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ یا چیک سے ملے تو اسے درج کریں اور نمبر والی رسید واٹس ایپ پر بھیج دیں۔"
    points:
      - "ایپ ادائیگیوں کا ریکارڈ رکھتی ہے، خود رقم وصول نہیں کرتی۔ لین دین ویسے ہی ہوتا ہے جیسے ہمیشہ سے ہوتا آیا ہے۔"
      - "ادائیگی پہلے سب سے پرانے واجبات چکاتی ہے، جب تک آپ خود واجبات نہ چنیں؛ زائد رقم اگلے واجبات کے لیے کریڈٹ کے طور پر محفوظ رہتی ہے۔"
      - "ہر رسید اردو یا انگریزی میں بھیجی جا سکتی ہے۔"
      - "کوئی کمپنی یا سرکاری ادارہ ٹیکس کاٹے تو اسے سرٹیفکیٹ نمبر کے ساتھ درج کریں: نقد رقم اور ٹیکس مل کر کرایہ ادا کرتے ہیں۔"
      - "غلطی وجہ لکھ کر منسوخ کی جاتی ہے، کبھی مٹائی نہیں جاتی۔"
  - heading: "واجبات پر نظر رکھیں"
    body: "ایپ ہر روز بتاتی ہے کہ کن باتوں پر آپ کی توجہ چاہیے: واجب اور تاخیر شدہ کرایہ، زیرِ التوا پولیس رجسٹریشن، ختم ہوتے معاہدے، کرایے میں واجب اضافے، ختم ہوتی میعاد والے شناختی کارڈ اور ادا نہ ہونے والے بل۔ ڈیش بورڈ پر نظر آتا ہے کہ کس کے ذمے کتنا ہے اور کب سے۔"
    points:
      - "اپنے واٹس ایپ سے اردو، انگریزی یا رومن اردو میں شائستہ یاد دہانی بھیجیں۔"
      - "رات گئے یا نمازِ جمعہ کے وقت ایپ مشورہ دیتی ہے کہ یاد دہانی ذرا بعد میں بھیجیں۔"
      - "کرایہ داری کا ہر سال مکمل ہونے پر ایپ نیا کرایہ تجویز کرتی ہے۔"
  - heading: "سال کا حساب مکمل کریں"
    body: "30 جون کے بعد ہر جائیداد کی ٹیکس سال کی اسٹیٹمنٹ اپنے ٹیکس مشیر کے لیے پی ڈی ایف یا اسپریڈشیٹ فائل کی صورت میں ڈاؤن لوڈ کریں۔ کرایہ داروں کی اسٹیٹمنٹ اور مالک کی ماہانہ اسٹیٹمنٹ جب چاہیں حاصل کریں۔"
    points:
      - "ٹیکس سال کی اسٹیٹمنٹ میں مجموعی کرایہ، کاٹا گیا ٹیکس، مرمت کی مد میں پانچویں حصے کی کٹوتی اور دیگر اخراجات ہوتے ہیں۔ یہ ٹیکس مشورہ نہیں، اور ایپ آپ کے حتمی ٹیکس کا حساب نہیں لگاتی۔"
      - "کرایہ دار کی اسٹیٹمنٹ میں ہر واجب رقم، ہر ادائیگی، ہر رسید نمبر اور باقی رقم درج ہوتی ہے۔"
closing:
  heading: "شروع کرنے کے لیے تیار ہیں؟"
  body: "اپنے فون یا کمپیوٹر پر ویب ایپ کھولیں، اپنا اکاؤنٹ بنائیں اور اپنی پہلی جائیداد شامل کریں۔ ابتدائی رسائی کے دوران یہ مفت ہے۔"
