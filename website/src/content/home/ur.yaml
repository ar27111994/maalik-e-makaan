features:
  heading: "ورژن 1.0 کیا کرے گا"
  items:
    - title: "واجبات خود بخود"
      body: "ہر جاری کرایہ داری کا ماہانہ کرایہ خود بخود واجب الادا ہو جاتا ہے۔ چاہیں تو پہلے مہینے کا کرایہ دنوں کے حساب سے لگے، اور تاخیر کی فیس اور زرِ ضمانت کا حساب بھی ساتھ رہتا ہے۔ بقایا جات کی فہرست بتاتی ہے کہ کس کے ذمے کتنا ہے اور کب سے۔"
    - title: "دو زبانوں میں نمبر والی رسیدیں"
      body: "نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ یا چیک سے ملنے والی ہر ادائیگی درج کریں۔ ہر ادائیگی کو مسلسل سلسلے کا اگلا رسید نمبر اور اردو اور انگریزی میں پی ڈی ایف رسید ملتی ہے جو آپ واٹس ایپ پر بھیج سکتے ہیں۔"
    - title: "واٹس ایپ پر یاد دہانی"
      body: "اردو، انگریزی یا رومن اردو میں شائستہ یاد دہانیاں واٹس ایپ میں کھلتی ہیں اور آپ کے اپنے نمبر سے جاتی ہیں، فی پیغام کوئی خرچ نہیں۔"
    - title: "نگران اور بیرونِ ملک مقیم مالکان"
      body: "کسی رشتہ دار یا نگران کو اس کا اپنا کردار دیں۔ وہ جو بھی ادائیگی درج کرے اور جتنی نقدی اس کے پاس ہو، سب ایک آڈٹ ریکارڈ میں محفوظ رہتا ہے جسے مالک بیرونِ ملک سے بھی دیکھ سکتا ہے۔"
    - title: "پولیس رجسٹریشن اور کرایہ نامہ"
      body: "ہر کرایہ دار کی پولیس رجسٹریشن اور کرایہ نامے کا ریکارڈ رکھیں، پنجاب کے رینٹ رجسٹرار کی تفصیلات سمیت، اور دیکھیں کہ کون سی رجسٹریشن ابھی باقی ہے۔"
    - title: "بجلی، گیس اور ٹیکس سال کی اسٹیٹمنٹ"
      body: "ہر یونٹ کے بجلی اور گیس کے کنکشن، بل اور میٹر ریڈنگ محفوظ رکھیں۔ جولائی سے جون کا ٹیکس سال ختم ہونے پر کرایے، دفعہ 155 کے تحت کاٹے گئے ٹیکس اور مرمت کی مد میں کرایے کے پانچویں حصے کی کٹوتی کی اسٹیٹمنٹ اپنے ٹیکس مشیر کے لیے حاصل کریں۔ یہ ٹیکس مشورہ نہیں ہے۔"
steps:
  heading: "یہ کیسے کام کرے گا"
  items:
    - title: "اپنی جائیدادیں اور یونٹ شامل کریں"
      body: "مکان، پورشن، فلیٹ، دکان، کمرہ یا بستر، ہر ایک کے مطلوبہ کرایے کے ساتھ۔"
    - title: "کرایہ دار اور کرایہ داری شامل کریں"
      body: "کرایہ، ادائیگی کا دن، زرِ ضمانت، سالانہ اضافہ اور تاخیر کی فیس، جیسا طے ہوا ہو۔"
    - title: "ادائیگیاں ملتے ہی درج کریں"
      body: "ہر مہینے واجبات خود سامنے آ جاتے ہیں۔ جو رقم ملے وہ درج کریں اور رسید بھیج دیں۔"
    - title: "اپنی صورتِ حال دیکھیں"
      body: "ڈیش بورڈ پر وصول شدہ اور باقی کرایہ، تاخیر کرنے والے کرایہ دار اور تجدید کے قریب کرایہ داریاں نظر آتی ہیں۔"
trust:
  heading: "بھروسے کے قابل"
  items:
    - title: "پائی پائی کا درست حساب"
      body: "رقمیں بالکل درست محفوظ ہوں گی، اندازاً نہیں۔ مالی اندراج کبھی مٹائے نہیں جائیں گے بلکہ وجہ لکھ کر منسوخ کیے جائیں گے۔"
    - title: "شروع سے نجی"
      body: "ہر پورٹ فولیو کا ریکارڈ ڈیٹابیس میں الگ رہے گا، شناختی کارڈ نمبر اسکرین پر بطورِ طے شدہ چھپے رہیں گے اور شناختی دستاویزات نجی اسٹوریج میں رکھی جائیں گی۔"
    - title: "اردو اور انگریزی برابر"
      body: "ایپ پہلی بار کھولتے وقت آپ کوئی بھی زبان چن سکیں گے۔ اردو دائیں سے بائیں اور نستعلیق میں ہوگی، اور ہر رسید دونوں زبانوں میں ہوگی۔ یہ سائٹ ابھی سے اسی طرح کام کرتی ہے۔"
    - title: "اوپن سورس"
      body: "اس کا کوڈ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلا ہے، تاکہ کوئی بھی دیکھ سکے کہ یہ کیسے کام کرتی ہے۔"
faq:
  heading: "عام سوالات"
  items:
    - question: "کیا مالکِ مکان ایپ آن لائن کرایہ وصول کرے گی؟"
      answer: "نہیں۔ یہ آپ کو ملنے والی ادائیگیاں درج کرے گی، چاہے نقد ہوں یا کسی بینک یا موبائل والٹ کے ذریعے، اور ان کی رسید جاری کرے گی۔ یہ خود کوئی ادائیگی وصول نہیں کرے گی۔"
    - question: "کیا ایپ میرے انکم ٹیکس کا حساب لگائے گی؟"
      answer: "نہیں۔ یہ دفعہ 155 کے تحت کرایہ داروں کا کاٹا ہوا ٹیکس درج کرے گی، مرمت کی مد میں پانچویں حصے کی کٹوتی کا حساب لگائے گی اور آپ کے ٹیکس مشیر کے لیے جولائی سے جون کی اسٹیٹمنٹ بنائے گی۔ یہ آپ کے حتمی ٹیکس کا اندازہ نہیں لگائے گی، اور یہ اسٹیٹمنٹ ٹیکس مشورہ نہیں ہے۔"
  more:
    label: "تمام سوالات اور جوابات"
    href: "/faq/"
