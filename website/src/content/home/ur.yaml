  lede: "مالکِ مکان ایپ رجسٹر، ایکسل شیٹ اور واٹس ایپ کے پیغامات کی جگہ ایک ایسا کھاتہ دیتی ہے جس پر آپ بھروسا کر سکیں۔ اس میں صاف نظر آتا ہے کہ کس کے ذمے کتنا کرایہ ہے اور کب سے، چاہے آپ اردو میں کام کریں یا انگریزی میں۔ ورژن 1.0 جاری ہو چکا ہے: ویب ایپ کھولیں اور اپنا اکاؤنٹ بنائیں۔ ابتدائی رسائی کے دوران یہ مفت ہے۔"
