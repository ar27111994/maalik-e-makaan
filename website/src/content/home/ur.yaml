features:
  heading: "ایپ کیا کرتی ہے"
  items:
    - title: "خود بخود بننے والے واجبات"
      body: "ہر جاری کرایہ داری کا ماہانہ کرایہ خود بخود واجب الادا ہو جاتا ہے، اور ساتھ ہی تاخیر کی فیس اور زرِ ضمانت کا حساب بھی رہتا ہے۔ چاہیں تو پہلے مہینے کا کرایہ دنوں کے حساب سے لگایا جا سکتا ہے۔ بقایا جات کی فہرست بتاتی ہے کہ کس کے ذمے کتنا ہے اور کب سے۔"
    - title: "اردو یا انگریزی میں نمبر والی رسیدیں"
      body: "نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ یا چیک سے ملنے والی ہر ادائیگی درج کریں۔ ہر ادائیگی کو مسلسل سلسلے کا اگلا رسید نمبر ملتا ہے، اور اس کی پی ڈی ایف رسید آپ اپنی پسند سے اردو یا انگریزی میں واٹس ایپ پر بھیج سکتے ہیں۔"
    - title: "واٹس ایپ پر یاد دہانی"
      body: "اردو، انگریزی یا رومن اردو میں شائستہ یاد دہانیاں واٹس ایپ میں تیار کھلتی ہیں اور آپ انھیں اپنے نمبر سے بھیجتے ہیں۔ ہر پیغام پر کوئی خرچ نہیں آتا۔"
    - title: "نگران اور بیرونِ ملک مقیم مالکان"
      body: "کسی رشتہ دار یا نگران کو اس کا اپنا کردار دیں۔ ایپ ہر ایک کے پاس موجود نقدی اور مالک کو دی گئی ہر رقم کا حساب رکھتی ہے، اور ماہانہ اسٹیٹمنٹ سے بیرونِ ملک مقیم مالک بھی پوری طرح باخبر رہتا ہے۔"
    - title: "پولیس رجسٹریشن اور کرایہ نامہ"
      body: "ہر کرایہ دار کی پولیس رجسٹریشن اور کرایہ نامے کا ریکارڈ رکھیں، پنجاب کے رینٹ رجسٹرار کی تفصیلات سمیت، اور دیکھیں کہ کون سی رجسٹریشن ابھی باقی ہے۔"
    - title: "بجلی، گیس اور ٹیکس سال کی اسٹیٹمنٹ"
      body: "ہر جائیداد یا یونٹ کے بجلی اور گیس کے کنکشن، بل اور میٹر ریڈنگ محفوظ رکھیں۔ جولائی سے جون کے ہر ٹیکس سال کے لیے کرایے، دفعہ 155 کے تحت کاٹے گئے ٹیکس اور مرمت کی مد میں کرایے کے پانچویں حصے کی کٹوتی کی اسٹیٹمنٹ اپنے ٹیکس مشیر کے لیے حاصل کریں۔ یہ ٹیکس مشورہ نہیں ہے۔"
steps:
  heading: "ایپ کیسے کام کرتی ہے"
  items:
    - title: "اپنی جائیدادیں اور یونٹ شامل کریں"
      body: "مکان، پورشن، فلیٹ، دکان، کمرہ یا بستر، ہر ایک کے مطلوبہ کرایے کے ساتھ۔"
    - title: "کرایہ دار اور کرایہ داری شامل کریں"
      body: "کرایہ، ادائیگی کا دن، زرِ ضمانت، سالانہ اضافہ اور تاخیر کی فیس، جیسا طے ہوا ہو۔"
    - title: "ادائیگیاں ملتے ہی درج کریں"
      body: "ہر مہینے واجبات خود سامنے آ جاتے ہیں۔ جو رقم ملے وہ درج کریں اور رسید بھیج دیں۔"
    - title: "اپنی صورتِ حال دیکھیں"
      body: "ڈیش بورڈ پر وصول شدہ اور باقی کرایہ، تاخیر کرنے والے کرایہ دار اور تجدید کے قریب کرایہ داریاں نظر آتی ہیں۔"
trust:
  heading: "بھروسے کے قابل"
  items:
    - title: "پائی پائی کا درست حساب"
      body: "رقمیں بالکل درست محفوظ ہوتی ہیں، اندازاً نہیں۔ مالی اندراج کبھی مٹائے نہیں جاتے بلکہ وجہ لکھ کر منسوخ کیے جاتے ہیں۔"
    - title: "شروع ہی سے رازداری"
      body: "ہر پورٹ فولیو کا ریکارڈ ڈیٹابیس میں الگ رہتا ہے، شناختی کارڈ نمبر اسکرین پر تب تک چھپے رہتے ہیں جب تک آپ خود انھیں نہ دکھائیں، اور شناختی دستاویزات نجی اسٹوریج میں رکھی جاتی ہیں۔"
    - title: "اردو اور انگریزی برابر"
      body: "ایپ پہلی بار کھولتے وقت اردو یا انگریزی چن لیں۔ ایپ میں اردو دائیں سے بائیں، نستعلیق میں نظر آتی ہے، اور ہر رسید آپ اس زبان میں بناتے ہیں جو آپ کا کرایہ دار پڑھتا ہے، اردو یا انگریزی۔ یہ ویب سائٹ بھی دونوں زبانوں میں ہے۔"
    - title: "اوپن سورس"
      body: "ایپ کا کوڈ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلا ہے، تاکہ کوئی بھی دیکھ سکے کہ یہ کیسے کام کرتی ہے۔"
faq:
  heading: "عام سوالات"
  items:
    - question: "ایپ کہاں سے حاصل کریں؟"
      answer: "ویب ایپ آپ کے فون یا کمپیوٹر کے براؤزر میں چلتی ہے: اسے کھولیں اور اپنا اکاؤنٹ بنائیں۔ اینڈرائیڈ کے لیے انسٹال کرنے والی فائلیں گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں، اور ایپ گوگل پلے پر بھی آئے گی۔ آئی فون کے لیے، جب تک ایپ اسٹور پر ایپ نہیں آتی، گٹ ہب پر بغیر دستخط کا ایک ورژن موجود ہے جسے آزمائشی صارفین اپنے ایپل اکاؤنٹ سے دستخط کر کے چلا سکتے ہیں۔"
    - question: "ایپ کی قیمت کیا ہے؟"
      answer: "فی الحال کچھ نہیں: ابتدائی رسائی کے دوران ایپ مفت ہے۔ تفصیل قیمتوں کے صفحے پر ہے۔"
    - question: "کیا مالکِ مکان ایپ آن لائن کرایہ وصول کرتی ہے؟"
      answer: "نہیں۔ یہ آپ کو ملنے والی ادائیگیاں درج کرتی ہے، چاہے نقد ہوں یا کسی بینک یا موبائل والٹ کے ذریعے، اور ان کی رسید جاری کرتی ہے۔ یہ خود کوئی ادائیگی وصول نہیں کرتی۔"
    - question: "کیا ایپ میرے انکم ٹیکس کا حساب لگاتی ہے؟"
      answer: "نہیں۔ یہ دفعہ 155 کے تحت کرایہ داروں کا کاٹا ہوا ٹیکس درج کرتی ہے، مرمت کی مد میں پانچویں حصے کی کٹوتی کا حساب لگاتی ہے اور آپ کے ٹیکس مشیر کے لیے جولائی سے جون کی اسٹیٹمنٹ بناتی ہے۔ یہ آپ کے حتمی ٹیکس کا اندازہ نہیں لگاتی، اور یہ اسٹیٹمنٹ ٹیکس مشورہ نہیں ہے۔"
  more:
    label: "تمام سوالات اور جوابات"
    href: "/faq/"
