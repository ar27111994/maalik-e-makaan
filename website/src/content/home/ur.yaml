  lede: "مالکِ مکان رجسٹر، ایکسل شیٹ اور واٹس ایپ کے پیغامات کی جگہ ایک ایسا کھاتہ دیتا ہے جس پر آپ بھروسا کر سکیں۔ اس میں صاف نظر آتا ہے کہ کس کے ذمے کتنا کرایہ ہے اور کب سے، چاہے آپ اردو میں کام کریں یا انگریزی میں۔"
