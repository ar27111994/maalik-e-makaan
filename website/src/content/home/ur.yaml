features:
  heading: "ایپ کیا کرتی ہے"
  items:
    - title: "خود بخود لگنے والے چارجز"
      body: "ہر جاری کرایہ داری میں ہر مہینے کرایہ خود بخود لگ جاتا ہے، اور ساتھ لیٹ فیس اور سیکیورٹی ڈپازٹ کا حساب بھی رہتا ہے۔ چاہیں تو پہلے مہینے کا کرایہ دنوں کے حساب سے لگائیں۔ لیٹ رقموں کی فہرست بتاتی ہے کہ کس کے ذمے کتنا باقی ہے اور کب سے۔"
    - title: "اردو یا انگریزی میں نمبر والی رسیدیں"
      body: "نقد، بینک ٹرانسفر، راست، جاز کیش، ایزی پیسہ یا چیک سے جو ادائیگی ملے، اسے درج کریں۔ ہر ادائیگی کو اگلا رسید نمبر ملتا ہے: نمبر ایک کے بعد ایک چلتے ہیں، بیچ میں کوئی نمبر خالی نہیں رہتا۔ اس کی پی ڈی ایف رسید آپ اپنی پسند سے اردو یا انگریزی میں واٹس ایپ پر بھیج سکتے ہیں۔"
    - title: "واٹس ایپ پر یاد دہانی"
      body: "اردو، انگریزی یا رومن اردو میں نرم لہجے کی یاد دہانیاں واٹس ایپ میں تیار کھلتی ہیں، اور آپ انہیں اپنے نمبر سے بھیجتے ہیں۔ کسی پیغام پر کوئی خرچ نہیں آتا۔"
    - title: "منیجر اور اوورسیز مالک"
      body: "کسی رشتہ دار یا نگران کو ان کا اپنا رول دیں۔ ایپ حساب رکھتی ہے کہ ہر ایک کے پاس کتنی نقدی ہے، اور مالک کو کتنی نقدی آگے دی گئی۔ ماہانہ اسٹیٹمنٹ سے اوورسیز مالک بھی پوری طرح باخبر رہتا ہے۔"
    - title: "پولیس رجسٹریشن اور کرایہ نامہ"
      body: "ہر کرایہ دار کی پولیس رجسٹریشن اور کرایہ نامے کا ریکارڈ رکھیں، پنجاب کے رینٹ رجسٹرار کی تفصیل سمیت۔ اور دیکھیں کہ کون سی رجسٹریشن ابھی نہیں ہوئی۔"
    - title: "بجلی، گیس اور ٹیکس سال کی اسٹیٹمنٹ"
      body: "ہر جائیداد یا یونٹ کے بجلی اور گیس کے کنکشن، بل اور میٹر ریڈنگ ریکارڈ میں رکھیں۔ جولائی سے جون کے ہر ٹیکس سال کی اسٹیٹمنٹ اپنے ٹیکس مشیر کے لیے نکالیں۔ اس میں کرایہ ہوتا ہے، دفعہ 155 کے تحت کٹا ہوا ٹیکس، اور مرمت کے لیے کرائے کا پانچواں حصہ، جو ٹیکس کے حساب میں آمدنی میں سے نکلتا ہے۔ یہ ٹیکس مشورہ نہیں ہے۔"
steps:
  heading: "ایپ کیسے کام کرتی ہے"
  items:
    - title: "اپنی جائیدادیں اور یونٹ شامل کریں"
      body: "مکان، پورشن، فلیٹ، دکان، کمرہ یا بستر، اور ہر ایک کا وہ کرایہ جو آپ مانگتے ہیں۔"
    - title: "کرایہ دار اور کرایہ داری شامل کریں"
      body: "کرایہ، کرایہ دینے کی تاریخ، سیکیورٹی ڈپازٹ، سالانہ اضافہ اور لیٹ فیس، جیسے طے ہوا ہو۔"
    - title: "ادائیگیاں ملتے ہی درج کریں"
      body: "ہر مہینے کے چارجز خود سامنے آ جاتے ہیں۔ جو رقم ملے وہ درج کریں اور رسید بھیج دیں۔"
    - title: "اپنا حساب ایک نظر میں دیکھیں"
      body: "ڈیش بورڈ پر نظر آتا ہے کہ کتنا کرایہ مل چکا اور کتنا باقی ہے، کون سے کرایہ دار لیٹ ہیں، اور کن کرایہ داریوں کو رینیو کرنے کا وقت آ رہا ہے۔"
trust:
  heading: "بھروسے کے قابل"
  items:
    - title: "پائی پائی کا درست حساب"
      body: "ایپ ہر رقم بالکل درست رکھتی ہے، گول کر کے اندازاً نہیں۔ رقم کی کوئی انٹری غلط ہو تو آپ وجہ لکھ کر اسے کینسل کرتے ہیں۔ کینسل ہونے والی انٹری ریکارڈ میں رہتی ہے، مٹائی نہیں جاتی۔"
    - title: "شروع ہی سے پرائیویسی"
      body: "ہر پورٹ فولیو کا ریکارڈ ڈیٹابیس میں الگ رہتا ہے۔ شناختی کارڈ نمبر اسکرین پر تب تک چھپے رہتے ہیں جب تک آپ خود انہیں نہ دکھائیں۔ شناختی کاغذات نجی اسٹوریج میں رہتے ہیں۔"
    - title: "اردو اور انگریزی برابر"
      body: "ایپ پہلی بار کھولتے وقت اردو یا انگریزی چن لیں۔ ایپ میں اردو دائیں سے بائیں، نستعلیق میں نظر آتی ہے۔ ہر رسید آپ اسی زبان میں بناتے ہیں جو آپ کا کرایہ دار پڑھتا ہے، اردو یا انگریزی۔ یہ ویب سائٹ بھی دونوں زبانوں میں ہے۔"
    - title: "اوپن سورس"
      body: "ایپ کا کوڈ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلا ہے، تاکہ کوئی بھی دیکھ سکے کہ یہ کیسے کام کرتی ہے۔"
faq:
  heading: "عام سوالات"
  items:
    - question: "ایپ کہاں سے ملے گی؟"
      answer: "ویب ایپ آپ کے فون یا کمپیوٹر کے براؤزر میں چلتی ہے۔ اسے کھولیں اور اپنا اکاؤنٹ بنائیں۔ اینڈرائیڈ کے لیے انسٹال کرنے والی فائلیں گٹ ہب پر ہر ورژن کے ساتھ موجود ہیں، اور ایپ گوگل پلے پر بھی آئے گی۔ آئی فون کے لیے ایپ ابھی ایپ اسٹور پر نہیں آئی۔ تب تک گٹ ہب پر بغیر دستخط کا ایک ورژن موجود ہے، جسے ٹیسٹ کرنے والے اپنے ایپل اکاؤنٹ سے دستخط کر کے چلا سکتے ہیں۔"
    - question: "ایپ کی قیمت کیا ہے؟"
      answer: "فی الحال کچھ نہیں: ایپ ابھی شروعاتی دور میں مفت ہے۔ تفصیل قیمتوں کے صفحے پر ہے۔"
    - question: "کیا مالکِ مکان ایپ آن لائن کرایہ وصول کرتی ہے؟"
      answer: "نہیں۔ آپ کو جو ادائیگیاں ملیں، یہ انہیں درج کرتی ہے، چاہے نقد ہوں یا کسی بینک یا موبائل والٹ کے ذریعے، اور ان کی رسید بناتی ہے۔ یہ خود کوئی ادائیگی وصول نہیں کرتی۔"
    - question: "کیا ایپ میرے انکم ٹیکس کا حساب لگاتی ہے؟"
      answer: "نہیں۔ یہ وہ ٹیکس درج کرتی ہے جو کرایہ دار دفعہ 155 کے تحت کاٹتے ہیں۔ یہ مرمت کے لیے کرائے کے پانچویں حصے کا حساب بھی لگاتی ہے، جو ٹیکس کے حساب میں آمدنی میں سے نکلتا ہے۔ پھر یہ آپ کے ٹیکس مشیر کے لیے جولائی سے جون کی اسٹیٹمنٹ بناتی ہے۔ یہ آپ کے سال کے اصل ٹیکس کا اندازہ نہیں لگاتی، اور یہ اسٹیٹمنٹ ٹیکس مشورہ نہیں ہے۔"
