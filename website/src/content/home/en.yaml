# The English home page. Its Urdu twin is ur.yaml; keep both in step (same
# number of items, in the same order). British English.
# Version 1.0 has been released (CHANGELOG.md), so the copy says what the app
# does, in the present tense, and claims only what .planning/REQUIREMENTS.md
# marks done (☑). While APP_STATUS (src/lib/release.ts) is "available", as it is
# now, the page shows hero.appCta, closing.appBody and closing.appCta;
# hero.primaryCta, closing.body and closing.cta are the fallback and must stay
# true. The FAQ answers are also the key facts in llms.txt.
title: "Maalik-e-Makaan: rent records for Pakistani landlords"
description: "An app for Pakistani landlords: rent, receipts in English or Urdu, WhatsApp reminders, police registration and tax-year records in one place. Free in early access."
hero:
  heading: "Rent, receipts and records for Pakistani landlords"
  lede: "Maalik-e-Makaan replaces the register, the spreadsheet and the WhatsApp thread with one ledger you can trust. It shows who owes what, and since when, in English or Urdu. Version 1.0 is out: open the web app and create your account. It is free during early access."
  primaryCta:
    label: "Try the calculators"
    href: "/tools/"
  appCta:
    label: "Open the web app"
    href: "app"
  secondaryCta:
    label: "See the features"
    href: "/features/"
receipt:
  caption: "An example receipt. The name and amount are made up."
  title: "Receipt"
  numberLabel: "No."
  number: "2026-0042"
  payerLabel: "Received from"
  payer: "Ayesha Khan"
  lineLabel: "Rent for November 2026"
  amountRupees: 45000
  methodLabel: "Paid by"
  method: "Cash"
  status: "Paid"
  balanceLabel: "Balance due"
features:
  heading: "What the app does"
  items:
    - title: "Dues that create themselves"
      body: "Rent falls due automatically each month for every active tenancy, with late fees, deposits and an optional part-month charge for the first month. The overdue list shows who owes what, and since when."
    - title: "Numbered receipts in English or Urdu"
      body: "Record payments in cash, by bank transfer, Raast, JazzCash, Easypaisa or cheque. Each one gets the next receipt number in an unbroken series, and a PDF receipt to share on WhatsApp in English or Urdu, as you choose."
    - title: "Reminders on WhatsApp"
      body: "Polite reminders in English, Urdu or Roman Urdu open in WhatsApp, ready to send from your own number, with nothing to pay per message."
    - title: "Caretakers and overseas owners"
      body: "Give a relative or caretaker a role of their own. The app tracks the cash each one holds and every handover to the owner, and a monthly statement keeps an owner abroad up to date."
    - title: "Police registration and agreements"
      body: "Keep each tenant's police registration and rent agreement on record, including Punjab Rent Registrar details, and see which registrations are still pending."
    - title: "Utilities and tax-year statements"
      body: "Keep electricity and gas connections, bills and meter readings for each property or unit. For each July–June tax year, get a statement of rent, tax withheld under section 155 and the one-fifth repairs allowance for your tax adviser. It is not tax advice."
steps:
  heading: "How it works"
  items:
    - title: "Add your properties and units"
      body: "Houses, portions, flats, shops, rooms or beds, each with its asking rent."
    - title: "Add tenants and tenancies"
      body: "The rent, due day, deposit, yearly increase and late-fee terms, as agreed."
    - title: "Record payments as they arrive"
      body: "Dues appear each month. Record what you receive and share the receipt."
    - title: "See where you stand"
      body: "The dashboard shows rent collected and outstanding, tenants who are late and tenancies that are due for renewal."
trust:
  heading: "Built to be trusted"
  items:
    - title: "Exact to the paisa"
      body: "Amounts are stored exactly, never as rounded approximations. Financial records are cancelled with a reason, never deleted."
    - title: "Private from the start"
      body: "Each portfolio's records are kept apart in the database, CNIC numbers are masked on screen by default and identity documents are held in private storage."
    - title: "English and Urdu as equals"
      body: "Choose either language when you first open the app. Urdu reads right to left in clear letters that are easy to read on a phone, and you make each receipt in English or Urdu, whichever your tenant reads. This website is in both languages too."
    - title: "Open source"
      body: "The code is public on GitHub under the MIT licence, so anyone can check how it works."
faq:
  heading: "Questions"
  items:
    - question: "Where can I get the app?"
      answer: "The web app works in the browser on your phone or computer: open it and create your account. For Android, installable files are attached to each release on GitHub, and the app is coming to Google Play. For iPhone, until the App Store listing is ready, an unsigned build on GitHub is there for testers to sign with their own Apple Account."
    - question: "What does the app cost?"
      answer: "Nothing for now: the app is free while it is in early access. The pricing page has the details."
    - question: "Does Maalik-e-Makaan collect rent online?"
      answer: "No. It records the payments you receive, whether in cash or through a bank or mobile wallet, and issues receipts for them. It does not take payments itself."
    - question: "Does it work out my income tax?"
      answer: "No. It records the tax that tenants withhold under section 155, works out the one-fifth repairs allowance and gives you a July–June statement for your tax adviser. It will not estimate your final tax, and the statement is not tax advice."
  more:
    label: "All questions and answers"
    href: "/faq/"
closing:
  heading: "Keep every rupee accounted for"
  body: "Version 1.0 is out. The download page shows where to get it: the web app, installable files for Android and a build for iPhone testers."
  cta:
    label: "Where to get the app"
    href: "/download/"
  appBody: "Open the web app on your phone or computer, create your account and add your first property. It is free during early access."
  appCta:
    label: "Open the web app"
    href: "app"
