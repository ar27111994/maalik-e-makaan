notes:
  heading: "How the plans work"
  items:
    - "A unit is anything you let separately with its own rent (a house, a portion, a flat, a room, a bed, a shop, an office or a floor) while it has a running lease. Empty units, and properties themselves, cost nothing, and you can add as many as you like."
    - "People are everyone who can sign in to your properties, including you. The people you invite never pay and need no plan of their own."
    - "The plans the apps show depend on the country of your Google Play or App Store account: a Pakistan account shows the rupee plans, any other country shows Overseas in that country’s currency. On our website anyone can pay the rupee prices."
    - "Always free, on every plan: the ledger, dues, late fees, deposits, receipts, WhatsApp reminders, police-registration deadlines, the dashboard, utilities, maintenance, expenses, tenant statements and CSV exports. You can always take your data out."
    - "Rupee prices include Pakistani tax. In Google Play and the App Store, the store shows any tax your country charges before you pay; some stores, such as the US ones, add it at checkout. Prices change at most once a year, with 60 days’ notice, and you keep your price for at least 12 months after a change."
    - "If you go over a limit, or a plan ends, nothing is deleted. Everything stays active for 14 days while we remind you; then the units above your plan become read-only, so you can still open, search and export them."
    - "Examples: a house of 4 portions is free. 8 flats let cost Rs 999 a month. A 40-bed hostel with every bed let costs Rs 3,499 a month. An owner in Dubai whose brother looks after 3 flats pays US$2.49 a month."
faq:
  heading: "Questions about pricing"
  items:
    - question: "Which currency will I pay in?"
      answer: "That depends on the country of your Google Play or App Store account, not on where you live. A Pakistan account shows Free, Pro and Business in rupees; an account anywhere else shows the Overseas plan in that country’s currency, and the store shows the price, with any tax your country charges, before you pay. On our website anyone can pay the rupee prices."
    - question: "Why does the Overseas plan cost more than the rupee plans?"
      answer: "It is the same app, with 10 GB of storage instead of 5 GB and priority support. Overseas prices are US$1 for each Rs 200 of the rupee price, at the nearest price ending in 49 or 99 cents; the store collects any tax your country charges, and keeps a fee. If you would rather pay in rupees, you can on our website, or a relative in Pakistan can pay for your account."
    - question: "I live abroad and a relative collects the rent. Which plan do we need?"
      answer: "Pro or Overseas, because Free has no room for a caretaker. From abroad, Overseas starts at US$2.49 a month for 5 let units, in your currency; or your relative can hold the plan and pay Pro in rupees, from Rs 499 a month. Either way the caretaker records each payment and hands cash over in the app, you confirm it, and you get a monthly owner statement."
    - question: "Will I need a card?"
      answer: "No. Rupee plans will be billed only once our website takes Raast, JazzCash or Easypaisa, so you can pay a month or a year in advance with no automatic renewal, and we remind you before it runs out. Free needs no payment at all."
    - question: "What happens to my records if I stop paying?"
      answer: "Nothing is deleted. Everything stays active for 14 days and we remind you. Then your account moves to Free: if you let more than 5 units, you choose which 5 stay active and the rest become read-only, so you can still open, search and export them. Choose a plan again and everything is active again."
    - question: "Can I cancel at any time?"
      answer: "Yes, in the app, on our website, or in Google Play or the App Store if you subscribed there. Your plan runs to the end of the month or year you paid for and then moves to Free. There is no contract and no cancellation fee."
    - question: "Do you give refunds?"
      answer: "For payments on our website, ask within 14 days of your first payment, or of a yearly renewal, and we refund it in full. Payments through Google Play or the App Store follow the store’s own refund rules; ask the store first, or write to us and we will help."
    - question: "The app is open source. Can I run it myself instead?"
      answer: "Yes. The app, its database and this website are public on GitHub under the MIT licence, and anyone may run their own copy on their own servers without paying us. A plan pays for the copy we run for you: hosting, backups, updates, the store apps and support."
