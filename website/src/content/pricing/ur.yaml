notes:
  heading: "پلان کیسے کام کرتے ہیں"
  items:
    - "یونٹ ہر وہ حصہ ہے جو آپ الگ کرائے پر دیتے ہیں (مکان، پورشن، فلیٹ، کمرہ، بستر، دکان، دفتر یا منزل)، جب تک اس کی کرایہ داری جاری ہو۔ خالی یونٹس اور خود جائیدادوں کی کوئی قیمت نہیں، اور آپ جتنے چاہیں شامل کر سکتے ہیں۔"
    - "لوگ وہ سب ہیں جو آپ کی جائیدادوں میں سائن ان کر سکتے ہیں، آپ سمیت۔ جنہیں آپ بلاتے ہیں وہ کبھی ادائیگی نہیں کرتے اور انہیں اپنے پلان کی ضرورت نہیں۔"
    - "ایپس میں نظر آنے والے پلان آپ کے گوگل پلے یا ایپ اسٹور اکاؤنٹ کے ملک پر منحصر ہیں: پاکستانی اکاؤنٹ میں روپوں والے پلان دکھائی دیتے ہیں، کسی اور ملک کے اکاؤنٹ میں اسی ملک کی کرنسی میں اوورسیز پلان۔ ہماری ویب سائٹ پر کوئی بھی روپوں والی قیمتیں ادا کر سکتا ہے۔"
    - "ہر پلان میں ہمیشہ مفت: کھاتہ، واجبات، تاخیری جرمانے، ڈپازٹ، رسیدیں، واٹس ایپ یاد دہانیاں، پولیس رجسٹریشن کی تاریخیں، ڈیش بورڈ، بجلی گیس، مرمت، اخراجات، کرایہ داروں کے گوشوارے اور سی ایس وی ایکسپورٹ۔ آپ اپنا ڈیٹا ہمیشہ نکال سکتے ہیں۔"
    - "روپوں والی قیمتوں میں پاکستانی ٹیکس شامل ہے۔ گوگل پلے اور ایپ اسٹور ادائیگی سے پہلے آپ کے ملک کا ٹیکس، اگر کوئی ہو، دکھاتے ہیں؛ کچھ اسٹور، جیسے امریکہ میں، یہ ٹیکس ادائیگی کے آخری مرحلے پر جوڑتے ہیں۔ قیمتیں سال میں زیادہ سے زیادہ ایک بار، 60 دن کی اطلاع کے ساتھ بدلتی ہیں، اور تبدیلی کے بعد کم از کم 12 ماہ تک آپ کی پرانی قیمت برقرار رہتی ہے۔"
    - "اگر آپ کسی حد سے بڑھ جائیں یا پلان ختم ہو جائے تو کچھ حذف نہیں ہوتا۔ یاد دہانیوں کے ساتھ 14 دن تک سب کچھ فعال رہتا ہے؛ پھر پلان سے زیادہ یونٹس صرف دیکھنے کے لیے رہ جاتے ہیں، تاکہ آپ انہیں کھول، تلاش اور ایکسپورٹ کر سکیں۔"
    - "مثالیں: چار پورشن والا مکان مفت ہے۔ کرائے پر دیے گئے آٹھ فلیٹ: ماہانہ 999 روپے۔ چالیس بستروں کا ہاسٹل جس کا ہر بستر کرائے پر ہو: ماہانہ 3,499 روپے۔ دبئی میں مقیم مالک جس کے تین فلیٹ اس کا بھائی سنبھالتا ہے: ماہانہ 2.49 ڈالر۔"
faq:
  heading: "قیمتوں کے بارے میں سوالات"
  items:
    - question: "میں کس کرنسی میں ادائیگی کروں گا؟"
      answer: "یہ اس پر منحصر ہے کہ آپ کا گوگل پلے یا ایپ اسٹور اکاؤنٹ کس ملک کا ہے، اس پر نہیں کہ آپ کہاں رہتے ہیں۔ پاکستانی اکاؤنٹ میں مفت، پرو اور بزنس روپوں میں دکھائی دیتے ہیں؛ کسی اور ملک کے اکاؤنٹ میں اوورسیز پلان اسی ملک کی کرنسی میں، اور اسٹور ادائیگی سے پہلے قیمت آپ کے ملک کے ٹیکس، اگر کوئی ہو، سمیت دکھاتا ہے۔ ہماری ویب سائٹ پر کوئی بھی روپوں والی قیمتیں ادا کر سکتا ہے۔"
    - question: "اوورسیز پلان روپوں والے پلانز سے مہنگا کیوں ہے؟"
      answer: "ایپ وہی ہے، بس 5 جی بی کے بجائے 10 جی بی جگہ اور ترجیحی مدد ملتی ہے۔ اوورسیز قیمت روپوں والی قیمت کے ہر 200 روپے پر ایک امریکی ڈالر ہے، جسے 49 یا 99 سینٹ پر ختم ہونے والی قریب ترین قیمت پر رکھا جاتا ہے؛ اسٹور آپ کے ملک کا ٹیکس، اگر کوئی ہو، وصول کرتا ہے اور اپنی فیس رکھتا ہے۔ اگر آپ روپوں میں ادائیگی چاہیں تو ہماری ویب سائٹ پر کر سکتے ہیں، یا پاکستان میں کوئی رشتہ دار آپ کے اکاؤنٹ کی ادائیگی کر سکتا ہے۔"
    - question: "میں بیرونِ ملک رہتا ہوں اور کرایہ ایک رشتہ دار وصول کرتا ہے۔ ہمیں کون سا پلان چاہیے؟"
      answer: "پرو یا اوورسیز، کیونکہ مفت پلان میں نگران کی گنجائش نہیں۔ بیرونِ ملک سے اوورسیز پانچ یونٹس کے لیے ماہانہ 2.49 ڈالر سے شروع ہوتا ہے، آپ کی کرنسی میں؛ یا آپ کا رشتہ دار پلان اپنے نام رکھ کر روپوں میں پرو ادا کر سکتا ہے، ماہانہ 499 روپے سے۔ دونوں صورتوں میں نگران ہر ادائیگی درج کرتا ہے اور ایپ میں نقد رقم حوالے کرتا ہے، آپ اس کی تصدیق کرتے ہیں، اور آپ کو ماہانہ گوشوارہ ملتا ہے۔"
    - question: "کیا مجھے کارڈ کی ضرورت ہو گی؟"
      answer: "نہیں۔ روپوں والے پلانز کی وصولی تبھی شروع ہو گی جب ہماری ویب سائٹ راست، جاز کیش یا ایزی پیسہ قبول کرنے لگے، تاکہ آپ ایک ماہ یا ایک سال کی پیشگی ادائیگی کر سکیں، خودکار تجدید کے بغیر، اور مدت ختم ہونے سے پہلے ہم آپ کو یاد دلائیں۔ مفت پلان کے لیے کسی ادائیگی کی ضرورت نہیں۔"
    - question: "اگر میں ادائیگی بند کر دوں تو میرے ریکارڈ کا کیا ہو گا؟"
      answer: "کچھ حذف نہیں ہوتا۔ 14 دن تک سب کچھ فعال رہتا ہے اور ہم آپ کو یاد دلاتے ہیں۔ پھر آپ کا اکاؤنٹ مفت پلان پر آ جاتا ہے: اگر آپ نے پانچ سے زیادہ یونٹس کرائے پر دیے ہیں تو آپ چنتے ہیں کہ کون سے پانچ فعال رہیں، باقی صرف دیکھنے کے لیے رہ جاتے ہیں، تاکہ آپ انہیں کھول، تلاش اور ایکسپورٹ کر سکیں۔ دوبارہ پلان لیں تو سب کچھ پھر فعال ہو جاتا ہے۔"
    - question: "کیا میں کسی بھی وقت پلان ختم کر سکتا ہوں؟"
      answer: "جی ہاں، ایپ میں، ہماری ویب سائٹ پر، یا اگر آپ نے گوگل پلے یا ایپ اسٹور سے لیا ہے تو وہاں۔ آپ کا پلان اس ماہ یا سال کے آخر تک چلتا ہے جس کی آپ نے ادائیگی کی ہے، پھر مفت پلان پر آ جاتا ہے۔ نہ کوئی معاہدہ ہے اور نہ ختم کرنے کی کوئی فیس۔"
    - question: "کیا آپ رقم واپس کرتے ہیں؟"
      answer: "ہماری ویب سائٹ پر کی گئی ادائیگی کے لیے پہلی ادائیگی، یا سالانہ تجدید، کے 14 دن کے اندر کہیں، ہم پوری رقم واپس کر دیں گے۔ گوگل پلے یا ایپ اسٹور کے ذریعے کی گئی ادائیگیوں پر اسٹور کے اپنے قواعد لاگو ہوتے ہیں؛ پہلے اسٹور سے رجوع کریں، یا ہمیں لکھیں، ہم مدد کریں گے۔"
    - question: "ایپ اوپن سورس ہے۔ کیا میں اسے خود چلا سکتا ہوں؟"
      answer: "جی ہاں۔ ایپ، اس کا ڈیٹابیس اور یہ ویب سائٹ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلے ہیں، اور کوئی بھی ہمیں ادائیگی کیے بغیر اپنے سرورز پر اپنی نقل چلا سکتا ہے۔ پلان کی ادائیگی اس نقل کے لیے ہے جو ہم آپ کے لیے چلاتے ہیں: ہوسٹنگ، بیک اپ، اپ ڈیٹس، اسٹور ایپس اور مدد۔"
