  heading: "ابتدائی رسائی کے دوران سب کے لیے مفت"
  body: "ابھی ادائیگی کا نظام شروع نہیں ہوا: ہر خصوصیت مفت ہے، یونٹس یا لوگوں کی کوئی حد نہیں، اور ادائیگی کی کوئی تفصیل نہیں مانگی جاتی۔ کسی بھی رقم کی وصولی سے پہلے آپ کو ای میل اور ایپ میں کم از کم 60 دن پہلے اطلاع دی جائے گی۔ کسی کو اس کی مرضی کے بغیر ادا شدہ پلان پر منتقل نہیں کیا جائے گا، اور ادائیگی شروع ہونے سے پہلے کھلنے والے اکاؤنٹس کو پہلے سال آدھی قیمت پر پلان ملے گا۔"
