title: "قیمتیں"
description: "کرائے پر دیے گئے پانچ یونٹس تک مفت۔ بڑے مالکوں کے لیے روپوں میں پرو اور بزنس پلان، اور ملک سے باہر رہنے والے مالکوں کے لیے اوورسیز پلان۔ ابھی سب کچھ مفت ہے۔"
heading: "قیمتیں"
intro: "پانچ پورشن، فلیٹ، دکانوں یا کمروں تک مفت۔ بڑے مالک، ٹیمیں اور اوورسیز مالک پیسوں والا پلان چنتے ہیں، جس کی قیمت اس سے طے ہوتی ہے کہ کتنے یونٹس کرائے پر ہیں۔ ابھی سب کچھ مفت ہے، کیونکہ ایپ ابھی شروعاتی دور میں ہے۔"
earlyAccess:
  heading: "ابھی سب کے لیے مفت"
  body: "ابھی ادائیگی کا نظام شروع نہیں ہوا۔ ہر فیچر مفت ہے، یونٹس یا لوگوں کی کوئی حد نہیں، اور ہم ادائیگی کی کوئی تفصیل نہیں مانگتے۔ کوئی بھی رقم لینے سے کم از کم 60 دن پہلے ہم آپ کو ای میل پر اور ایپ میں بتائیں گے۔ جب تک آپ خود کوئی پلان نہ چنیں، ہم آپ کو پیسوں والے پلان پر نہیں ڈالیں گے۔ ادائیگی شروع ہونے سے پہلے کھلنے والے اکاؤنٹس کو پہلے سال آدھی قیمت پر پلان ملے گا۔"
