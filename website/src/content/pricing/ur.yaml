notes:
  heading: "پلان کیسے کام کرتے ہیں"
  items:
    - "یونٹ ہر وہ حصہ ہے جو آپ الگ کرائے پر دیتے ہیں (مکان، پورشن، فلیٹ، کمرہ، بستر، دکان، دفتر یا منزل)، جب تک اس کی کرایہ داری جاری ہو۔ خالی یونٹس اور خود جائیدادوں کی کوئی قیمت نہیں، اور آپ جتنے چاہیں شامل کر سکتے ہیں۔"
    - "لوگ وہ سب ہیں جو آپ کی جائیدادوں میں سائن اِن کر سکتے ہیں، آپ سمیت۔ جنہیں آپ دعوت بھیجتے ہیں وہ کبھی ادائیگی نہیں کرتے، اور انہیں اپنے پلان کی ضرورت نہیں۔"
    - "ایپس میں کون سے پلان نظر آئیں، یہ آپ کے گوگل پلے یا ایپ اسٹور اکاؤنٹ کے ملک پر منحصر ہے۔ پاکستانی اکاؤنٹ میں روپوں والے پلان نظر آتے ہیں، اور کسی اور ملک کے اکاؤنٹ میں اوورسیز پلان، اسی ملک کی کرنسی میں۔ ہماری ویب سائٹ پر کوئی بھی روپوں والی قیمتیں ادا کر سکتا ہے۔"
    - "ہر پلان میں ہمیشہ مفت: کھاتہ، کرایہ اور دوسرے چارجز، لیٹ فیس، سیکیورٹی ڈپازٹ، رسیدیں، واٹس ایپ یاد دہانیاں، پولیس رجسٹریشن کی تاریخیں، ڈیش بورڈ، بل، مرمت، خرچ، کرایہ داروں کی اسٹیٹمنٹ، اور ایکسل میں کھلنے والی فائلیں۔ آپ اپنا ڈیٹا ہمیشہ نکال سکتے ہیں۔"
    - "روپوں والی قیمتوں میں پاکستانی ٹیکس شامل ہے۔ گوگل پلے اور ایپ اسٹور ادائیگی سے پہلے آپ کے ملک کا ٹیکس، اگر کوئی ہو، دکھاتے ہیں۔ کچھ اسٹور، جیسے امریکہ میں، یہ ٹیکس ادائیگی کے آخری قدم پر جوڑتے ہیں۔ قیمتیں سال میں زیادہ سے زیادہ ایک بار بدلتی ہیں، اور ہم 60 دن پہلے بتاتے ہیں۔ تبدیلی کے بعد کم از کم 12 مہینے تک آپ کی پرانی قیمت ہی رہتی ہے۔"
    - "اگر آپ کسی حد سے آگے جائیں یا پلان ختم ہو جائے تو کچھ ڈیلیٹ نہیں ہوتا۔ 14 دن تک سب کچھ چلتا رہتا ہے، اور ہم آپ کو یاد دلاتے رہتے ہیں۔ پھر پلان سے زیادہ یونٹس صرف دیکھنے کے لیے رہ جاتے ہیں، تاکہ آپ انہیں کھول، تلاش اور ایکسپورٹ کر سکیں۔"
    - "مثالیں: چار پورشن والا مکان مفت ہے۔ کرائے پر دیے گئے آٹھ فلیٹ: ماہانہ 999 روپے۔ چالیس بستروں کا ہاسٹل جس کا ہر بستر کرائے پر ہو: ماہانہ 3,499 روپے۔ دبئی میں رہنے والا مالک جس کے تین فلیٹ اس کا بھائی سنبھالتا ہے: ماہانہ 2.49 ڈالر۔"
faq:
  heading: "قیمتوں کے بارے میں سوالات"
  items:
    - question: "میں کس کرنسی میں ادائیگی کروں گا؟"
      answer: "یہ اس پر منحصر ہے کہ آپ کا گوگل پلے یا ایپ اسٹور اکاؤنٹ کس ملک کا ہے، اس پر نہیں کہ آپ کہاں رہتے ہیں۔ پاکستانی اکاؤنٹ میں مفت، پرو اور بزنس روپوں میں نظر آتے ہیں۔ کسی اور ملک کے اکاؤنٹ میں اوورسیز پلان اسی ملک کی کرنسی میں نظر آتا ہے، اور اسٹور ادائیگی سے پہلے قیمت دکھاتا ہے، آپ کے ملک کے ٹیکس سمیت، اگر کوئی ہو۔ ہماری ویب سائٹ پر کوئی بھی روپوں والی قیمتیں ادا کر سکتا ہے۔"
    - question: "اوورسیز پلان روپوں والے پلانز سے مہنگا کیوں ہے؟"
      answer: "ایپ وہی ہے، بس 5 جی بی کے بجائے 10 جی بی جگہ ملتی ہے، اور مدد میں آپ کی باری پہلے آتی ہے۔ اوورسیز قیمت روپوں والی قیمت کے ہر 200 روپے پر ایک امریکی ڈالر ہے۔ ہم اسے اس قریب ترین قیمت پر رکھتے ہیں جو 49 یا 99 سینٹ پر ختم ہو۔ اسٹور آپ کے ملک کا ٹیکس، اگر کوئی ہو، وصول کرتا ہے اور اپنی فیس رکھتا ہے۔ اگر آپ روپوں میں ادائیگی چاہیں تو ہماری ویب سائٹ پر کر سکتے ہیں، یا پاکستان میں کوئی رشتہ دار آپ کے اکاؤنٹ کی ادائیگی کر سکتا ہے۔"
    - question: "میں ملک سے باہر رہتا ہوں، اور کرایہ ایک رشتہ دار وصول کرتا ہے۔ ہمیں کون سا پلان چاہیے؟"
      answer: "پرو یا اوورسیز، کیونکہ مفت پلان میں نگران کی گنجائش نہیں۔ باہر سے آپ اوورسیز پلان لیں تو یہ پانچ یونٹس کے لیے ماہانہ 2.49 ڈالر سے شروع ہوتا ہے، آپ کی کرنسی میں۔ یا آپ کا رشتہ دار پلان اپنے نام رکھ کر روپوں میں پرو لے سکتا ہے، ماہانہ 499 روپے سے۔ دونوں صورتوں میں نگران ہر ادائیگی درج کرتا ہے اور ایپ میں نقدی آگے دینے کی انٹری کرتا ہے۔ آپ اس کی تصدیق کرتے ہیں، اور آپ کو مالک کی ماہانہ اسٹیٹمنٹ ملتی ہے۔"
    - question: "کیا مجھے کارڈ کی ضرورت ہو گی؟"
      answer: "نہیں۔ ہم روپوں والے پلانز کے پیسے تبھی لیں گے جب ہماری ویب سائٹ راست، جاز کیش یا ایزی پیسہ لینے لگے۔ تب آپ ایک مہینے یا ایک سال کی ایڈوانس ادائیگی کر سکیں گے۔ پلان خود بخود رینیو نہیں ہو گا، اور مدت ختم ہونے سے پہلے ہم آپ کو یاد دلائیں گے۔ مفت پلان کے لیے کوئی ادائیگی نہیں چاہیے۔"
    - question: "اگر میں ادائیگی بند کر دوں تو میرے ریکارڈ کا کیا ہو گا؟"
      answer: "کچھ ڈیلیٹ نہیں ہوتا۔ 14 دن تک سب کچھ چلتا رہتا ہے اور ہم آپ کو یاد دلاتے ہیں۔ پھر آپ کا اکاؤنٹ مفت پلان پر آ جاتا ہے۔ اگر آپ نے پانچ سے زیادہ یونٹس کرائے پر دیے ہیں تو آپ چنتے ہیں کہ کون سے پانچ چالو رہیں۔ باقی صرف دیکھنے کے لیے رہ جاتے ہیں، تاکہ آپ انہیں کھول، تلاش اور ایکسپورٹ کر سکیں۔ دوبارہ پلان لیں تو سب کچھ پھر چالو ہو جاتا ہے۔"
    - question: "کیا میں کسی بھی وقت پلان ختم کر سکتا ہوں؟"
      answer: "جی ہاں، ایپ میں، ہماری ویب سائٹ پر، یا اگر آپ نے گوگل پلے یا ایپ اسٹور سے لیا ہے تو وہاں۔ آپ کا پلان اس مہینے یا سال کے آخر تک چلتا ہے جس کی آپ نے ادائیگی کی ہے، پھر مفت پلان پر آ جاتا ہے۔ نہ کوئی معاہدہ ہے اور نہ ختم کرنے کی کوئی فیس۔"
    - question: "کیا آپ رقم واپس کرتے ہیں؟"
      answer: "اگر آپ نے ہماری ویب سائٹ پر ادائیگی کی ہے تو پہلی ادائیگی، یا سالانہ رینیو، کے 14 دن کے اندر کہیں۔ ہم پوری رقم واپس کر دیں گے۔ گوگل پلے یا ایپ اسٹور سے کی گئی ادائیگی پر رقم کی واپسی کے لیے اسٹور کے اپنے اصول لاگو ہوتے ہیں۔ پہلے اسٹور سے رابطہ کریں، یا ہمیں لکھیں، ہم مدد کریں گے۔"
    - question: "ایپ اوپن سورس ہے۔ کیا میں اسے خود چلا سکتا ہوں؟"
      answer: "جی ہاں۔ ایپ، اس کا ڈیٹابیس اور یہ ویب سائٹ ایم آئی ٹی لائسنس کے تحت گٹ ہب پر سب کے لیے کھلے ہیں۔ کوئی بھی ہمیں پیسے دیے بغیر اپنے سرورز پر اپنی کاپی چلا سکتا ہے۔ پلان کے پیسے اس کاپی کے لیے ہیں جو ہم آپ کے لیے چلاتے ہیں: ہوسٹنگ، بیک اپ، اپ ڈیٹس، اسٹور ایپس اور مدد۔"
closing:
  heading: "آج ہی مفت شروع کریں"
  body: "ویب پر سائن اپ کریں یا اینڈرائیڈ ایپ انسٹال کریں۔ جب تک ایپ شروعاتی دور میں ہے، سب کچھ مفت ہے۔"
