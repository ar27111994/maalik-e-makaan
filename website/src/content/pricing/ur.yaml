title: "قیمتیں"
description: "پانچ کرائے پر دیے گئے یونٹس تک مفت۔ بڑے مالکان کے لیے روپوں میں پرو اور بزنس، اور بیرونِ ملک مالکان کے لیے اوورسیز پلان۔ ابتدائی رسائی کے دوران سب کچھ مفت ہے۔"
heading: "قیمتیں"
intro: "پانچ پورشن، فلیٹ، دکانوں یا کمروں تک مفت۔ بڑے مالکان، ٹیمیں اور بیرونِ ملک مالکان ادا شدہ پلان چنتے ہیں، جس کی قیمت کرائے پر دیے گئے یونٹس کی تعداد سے طے ہوتی ہے۔ ابھی سب کچھ مفت ہے، کیونکہ ایپ ابتدائی رسائی کے مرحلے میں ہے۔"
