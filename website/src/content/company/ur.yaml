    value: "مالکِ مکان ایپ، ایم آئی ٹی لائسنس کے تحت اوپن سورس"
founder:
  heading: "بانی"
  name: "احمد ریحان"
  role: "بانی اور چیف ایگزیکٹو"
  bio:
    - "راولپنڈی سے تعلق رکھنے والے فل اسٹیک انجینئر، جو 2014 سے سافٹ ویئر بنا رہے ہیں۔ انہوں نے چار سال تک ایگل 6 کا فرنٹ اینڈ بنایا، جو بڑے اداروں کے لیے سائبر سیکیورٹی کا ایک پروڈکٹ ہے۔ انہوں نے اس کی فرنٹ اینڈ ٹیم کی بھرتی اور تربیت میں بھی حصہ لیا۔"
    - "وہ 40 سے زیادہ فری لانس پروجیکٹ مکمل کر چکے ہیں، اور اپ ورک پر ان کی ریٹنگ 5.0 ہے۔ وہ ڈویلپرز کے لیے اوپن سورس ٹولز اور ایجنٹ سسٹمز بھی بناتے ہیں۔ انہوں نے ایرڈ ایگریکلچر یونیورسٹی، راولپنڈی سے کمپیوٹر سائنس میں ماسٹرز کیا ہے۔"
  links: "ان کا کام اور سی وی"
deck:
  heading: "پچ ڈیک"
  body: "مسئلہ، پروڈکٹ، اس کے حساب پر بھروسا کیوں کیا جا سکتا ہے، آگے کیا آ رہا ہے، اور کمپنی پیسے کیسے کمائے گی، اٹھارہ سلائیڈوں میں۔ یہ ہر نئے ورژن کے ساتھ دوبارہ بنتی ہے، اس لیے اس پر ورژن اور تاریخ ہمیشہ تازہ ہوتی ہے۔"
  link: "پچ ڈیک ڈاؤن لوڈ کریں (پی ڈی ایف)"
  language: "پچ ڈیک انگریزی میں ہے۔"
contact:
  heading: "رابطہ کریں"
  body: "ایپ، اپنے ڈیٹا، پارٹنرشپ یا سرمایہ کاری کے بارے میں کوئی سوال ہو تو ہمیں لکھیں۔ کوئی خرابی ملے یا نئے فیچر کی تجویز ہو، تو گٹ ہب سب سے تیز ذریعہ ہے۔"
