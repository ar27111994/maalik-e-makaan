title: "مالکِ مکان کے پیچھے کمپنی"
description: "اے آر لیبز (ایس ایم سی-پرائیویٹ) لمیٹڈ مالکِ مکان بناتی ہے: ہم کون ہیں، کمپنی کیسے رجسٹرڈ ہے، بانی، پچ ڈیک اور ہم سے رابطے کا طریقہ۔"
heading: "کمپنی"
intro: "مالکِ مکان کو اے آر لیبز بناتی اور چلاتی ہے، جو پاکستان میں رجسٹرڈ ایک چھوٹی کمپنی ہے۔ ہم ایک ہی چیز بناتے ہیں: کرایے کا ایسا کھاتہ جس پر پاکستانی مالکانِ مکان بھروسا کر سکیں، اردو اور انگریزی میں۔"
