founder:
  heading: "بانی"
  name: "احمد ریحان"
  role: "بانی اور چیف ایگزیکٹو"
  bio:
    - "راولپنڈی سے تعلق رکھنے والے فل اسٹیک انجینئر، جو 2014 سے سافٹ ویئر بنا رہے ہیں۔ انہوں نے چار سال سائبر سیکیورٹی کے ایک بڑے ادارہ جاتی پروڈکٹ، ایگل 6، کا فرنٹ اینڈ بنایا اور اس کی فرنٹ اینڈ ٹیم کی بھرتی اور تربیت میں حصہ لیا۔"
    - "وہ 40 سے زیادہ فری لانس منصوبے مکمل کر چکے ہیں، جن پر اپ ورک پر ان کی ریٹنگ 5.0 ہے، اور ڈویلپرز کے لیے اوپن سورس ٹولز اور ایجنٹ سسٹمز بناتے ہیں۔ انہوں نے ایرڈ ایگریکلچر یونیورسٹی، راولپنڈی سے کمپیوٹر سائنس میں ماسٹرز کیا ہے۔"
  links: "ان کا کام اور سی وی"
deck:
  heading: "پچ ڈیک"
  body: "مسئلہ، پروڈکٹ، اس کے حساب پر بھروسا کیوں کیا جا سکتا ہے، آگے کا منصوبہ اور آمدنی کا طریقہ، اٹھارہ سلائیڈوں میں۔ یہ ہر نئے ورژن کے ساتھ دوبارہ بنتی ہے، اس لیے اس پر ورژن اور تاریخ ہمیشہ تازہ ہوتی ہے۔"
  link: "پچ ڈیک ڈاؤن لوڈ کریں (پی ڈی ایف)"
