  linkLabel: "Read the MIT licence on GitHub"
fonts:
  heading: "The fonts"
  body: "The text is set in three typefaces, served from this site rather than from a font service. All three are licensed under the SIL Open Font License, version 1.1."
  items:
    - licence: ofl-atkinson-hyperlegible-next
      role: "For English text, and for amounts and other numbers in both languages."
    - licence: ofl-noto-sans-arabic
      role: "For Urdu text, in plain, clear letters that are easy to read on a phone."
    - licence: ofl-noto-nastaliq-urdu
      role: "Only for the logo: the name Maalik-e-Makaan in Urdu at the top of each page, in the Nastaliq style."
