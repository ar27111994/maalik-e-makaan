title: "لائسنس"
description: "اس ویب سائٹ کے لائسنس: اس کا کوڈ ایم آئی ٹی لائسنس کے تحت جاری ہوا ہے، اور اس کے تینوں فونٹ ایس آئی ایل اوپن فونٹ لائسنس 1.1 کے تحت استعمال ہوتے ہیں۔"
heading: "لائسنس"
intro: "مالکِ مکان ایک اوپن سورس پروجیکٹ ہے۔ یہ ویب سائٹ آپ کے براؤزر کو جو کچھ بھیجتی ہے، اس سب کے لائسنس یہاں لکھے ہیں۔"
code:
  heading: "کوڈ"
  body: "ویب سائٹ اور ایپ ایم آئی ٹی لائسنس کے تحت جاری ہوئی ہیں۔ یہ لائسنس ہر کسی کو کوڈ استعمال کرنے، اس کی کاپی بنانے، اس میں تبدیلی کرنے اور اسے آگے بانٹنے کی اجازت دیتا ہے، شرط یہ ہے کہ کاپی رائٹ نوٹس اور لائسنس ساتھ رہیں۔"
  linkLabel: "ایم آئی ٹی لائسنس گٹ ہب پر پڑھیں"
fonts:
  heading: "فونٹ"
  body: "اس سائٹ کے الفاظ تین فونٹس میں لکھے ہیں۔ یہ فونٹ کسی فونٹ سروس سے نہیں، اسی سائٹ سے آتے ہیں۔ تینوں ایس آئی ایل اوپن فونٹ لائسنس، ورژن 1.1 کے تحت دستیاب ہیں۔"
  items:
    - licence: ofl-atkinson-hyperlegible-next
      role: "انگریزی الفاظ کے لیے، اور دونوں زبانوں میں رقموں اور دوسرے نمبروں کے لیے۔"
    - licence: ofl-noto-sans-arabic
      role: "اردو الفاظ کے لیے، صاف اور سادہ حروف میں جو فون پر آسانی سے پڑھے جاتے ہیں۔"
    - licence: ofl-noto-nastaliq-urdu
      role: "صرف لوگو کے لیے: ہر صفحے کے اوپر اردو میں لکھا نام مالکِ مکان، نستعلیق انداز میں۔"
  linkLabel: "{font} کا پورا لائسنس"
  note: "صفحوں کو ہلکا رکھنے کے لیے یہ سائٹ فونٹس کے چھوٹے ورژن خود دیتی ہے۔ ہر فائل میں صرف وہی حروف ہیں جن کی سائٹ کو ضرورت ہے، اور وہ ویب کے لیے بنے ایک چھوٹے (کمپریسڈ) فارمیٹ میں ہے۔ لائسنس اس کی اجازت دیتا ہے۔"
