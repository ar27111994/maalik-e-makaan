title: "لائسنس"
description: "اس ویب سائٹ کے لائسنس: اس کا کوڈ ایم آئی ٹی لائسنس کے تحت جاری کیا گیا ہے، اور اس کے دونوں فونٹ ایس آئی ایل اوپن فونٹ لائسنس 1.1 کے تحت استعمال ہوتے ہیں۔"
heading: "لائسنس"
intro: "مالکِ مکان ایک اوپن سورس منصوبہ ہے۔ یہ ویب سائٹ آپ کے براؤزر کو جو کچھ بھیجتی ہے، اس سب کے لائسنس یہاں درج ہیں۔"
code:
  heading: "کوڈ"
  body: "ویب سائٹ اور ایپ ایم آئی ٹی لائسنس کے تحت جاری کی گئی ہیں۔ یہ لائسنس ہر کسی کو کوڈ استعمال کرنے، اس کی نقل بنانے، اس میں تبدیلی کرنے اور اسے آگے تقسیم کرنے کی اجازت دیتا ہے، بشرطیکہ کاپی رائٹ نوٹس اور لائسنس کا متن ساتھ شامل ہو۔"
  linkLabel: "ایم آئی ٹی لائسنس گٹ ہب پر پڑھیں"
fonts:
  heading: "فونٹ"
  body: "اس سائٹ کی تحریر دو فونٹس میں ہے، جو کسی فونٹ سروس کے بجائے اسی سائٹ سے فراہم کیے جاتے ہیں۔ دونوں ایس آئی ایل اوپن فونٹ لائسنس، ورژن 1.1 کے تحت دستیاب ہیں۔"
  items:
    - licence: ofl-atkinson-hyperlegible-next
      role: "انگریزی تحریر کے لیے، اور دونوں زبانوں میں رقوم اور دوسرے اعداد کے لیے۔"
    - licence: ofl-noto-nastaliq-urdu
      role: "اردو تحریر کے لیے، اسی نستعلیق انداز میں جس کے اردو قارئین عادی ہیں۔"
  linkLabel: "{font} کے لائسنس کا متن"
  note: "صفحات کو ہلکا رکھنے کے لیے یہ سائٹ فونٹس کے مختصر نسخے فراہم کرتی ہے: ہر فائل میں صرف وہی حروف ہیں جن کی سائٹ کو ضرورت ہے، اور وہ ویب کے لیے موزوں مختصر فارمیٹ میں ہے۔ لائسنس اس کی اجازت دیتا ہے۔"
