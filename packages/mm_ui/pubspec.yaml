name: mm_ui
description: >-
  Maalik-e-Makaan design system: design tokens, light/dark/high-contrast
  themes, Latin and Urdu typography, and the shared component library.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  mm_core:
    path: ../mm_core

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # The fonts' and icons' licences, shown on the app's licence page
  # (MmLicenses.register).
  assets:
    - assets/fonts/OFL-AtkinsonHyperlegibleNext.txt
    - assets/fonts/OFL-NotoSansArabic.txt
    - assets/fonts/OFL-NotoNastaliqUrdu.txt
    - assets/fonts/LICENSE-lucide.txt
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
    # Urdu interface text (MmFontFamily.urdu), at its normal width, and the
    # Urdu wordmark only (MmFontFamily.urduWordmark), cut to the letters of
    # the app's Urdu name: both built from design/fonts/ by `make fonts`.
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Wordmark.ttf
    - family: MmIcons
      fonts:
        - asset: assets/fonts/MmIcons.ttf
