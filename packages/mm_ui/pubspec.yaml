name: mm_ui
description: >-
  Maalik-e-Makaan design system: design tokens, light/dark/high-contrast
  themes, Latin and Urdu Nastaliq typography, and the shared component library.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  mm_core:
    path: ../mm_core

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Variable.ttf
    - family: MmIcons
      fonts:
        - asset: assets/fonts/MmIcons.ttf
