include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - linux/**
    - web/**

linter:
  rules:
    # The gallery is an application, not a published library; public API
    # docs are required in packages/mm_ui itself.
    public_member_api_docs: false
