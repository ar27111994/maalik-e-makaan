name: mm_ui_gallery
description: >-
  The mm_ui component gallery: every component of the Maalik-e-Makaan design
  system in realistic use, for designers, testers and user acceptance testing.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mm_core:
    path: ../../mm_core
  mm_ui:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
